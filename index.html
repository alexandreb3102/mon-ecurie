function ageBand(age){
return age<=2?25:age<=4?20:age<=6?15:age<=9?10:age<=13?6:3;
}

function rawPotential(race){
let b=RACE[race]||{CSO:4,CCE:4,Dressage:4};
let quality=rand(45,68);
let hidden={};
DISC.forEach(d=>{
hidden[d]=clamp(quality+(b[d]||0)+rand(-18,18),40,99);
});
return hidden;
}

function estimateRange(real,age){
let w=ageBand(age);
return [
clamp(real-w,35,99),
clamp(real+w,40,99)
];
}

function rangesFor(p,age){
let out={};
DISC.forEach(d=>out[d]=estimateRange(p[d],age));
return out;
}

function probabilityProfile(p,price,race){
let avg=(p.CSO+p.CCE+p.Dressage)/3;
let elite=clamp((avg-68)/28,0,1);
let priceBoost=clamp(Math.log10(Math.max(price,1000))-3,0,2)/2;
let breedBoost=(RACE[race]?Math.max(...Object.values(RACE[race])):5)/18;

let exceptional=clamp(.02+elite*.28+priceBoost*.16+breedBoost*.05,.01,.55);
let very=clamp(.10+elite*.32+priceBoost*.14,.05,.70);
let good=clamp(.30+(1-elite)*.28,.15,.65);
let medium=Math.max(.02,1-exceptional-very-good);

let total=exceptional+very+good+medium;

return{
exceptional:exceptional/total,
very:very/total,
good:good/total,
medium:medium/total
};
}

function stat(n,v){
return `

<div class="statLine">
<span>${n}</span>
<b>${Math.round(v)}/100</b>

function value(h){

let p=
(h.potential.CSO+
h.potential.CCE+
h.potential.Dressage)/3;

let c=
(h.current.CSO+
h.current.CCE+
h.current.Dressage)/3;

let mental=h.character?.mental||60;

let base=
p*.50+
c*.32+
mental*.08+
h.experience.CSO*.03+
h.experience.CCE*.03+
h.experience.Dressage*.03;

let ageFactor=
h.age<4?.65:
h.age<=8?1:
h.age<=13?.92:
h.age<=18?.65:.35;

return Math.round(
2500+
Math.pow(clamp(base,0,100)/100,2.5)*
65000*
ageFactor
);
}

function train(id,d){

let h=game.horses.find(x=>String(x.id)===String(id));

if(!h)return;

if(h.retired){
open("🛑","Ce cheval est à la retraite.");
return;
}

if(h.injuries.some(i=>i.active)){
open("🩹","Impossible de travailler : le cheval est blessé.");
return;
}

if(h.fatigue>=75){
open("😴","Cheval trop fatigué.");
return;
}

let mentalFactor=
h.character.concentration>=75?1.2:
h.character.concentration>=55?1:
.8;

let gain=Math.max(
1,
Math.round(
(1+h.experience[d]/45)*mentalFactor
)
);

h.current[d]=clamp(
h.current[d]+gain,
0,
h.potential[d]
);

h.experience[d]=clamp(
h.experience[d]+2,
0,
100
);

h.regularity[d]=clamp(
h.regularity[d]+1,
0,
100
);

h.form=clamp(h.form+3,0,100);
h.fatigue=clamp(h.fatigue+14,0,100);

historyEvent(
h,
`Séance de travail en ${d} : +${gain} niveau.`
);

save();
horseBook(id,"train");
}

}

)
);

}

let stable=
game.horses.filter(
h=>!h.away&&!ids.includes(String(h.id))
);

trip={
event:e,
day:0,
remaining:e.days,
stableHorses:stable.map(h=>h.id),
travelHorses:horses.map(h=>h.id),
palefrenier:false,
palefrenierCost:0
};

let need=
stable.length>0&&e.days>1;

open(
"🚚 Préparation du départ",
`
<div class="notice">

🏆 ${e.city}<br>
📅 ${e.days} jour${e.days>1?"s":""}<br>
🐴 ${horses.length}
cheval${horses.length>1?"ux":""}
embarqué${horses.length>1?"s":""}

</div>

<div class="choice">

🏠 Chevaux restant à l'écurie :
<b>${stable.length}</b>

</div>

${
need?
`
<div class="notice alert">

Coût :
<b>${palefrenierCost(
stable.length,
e.days
)} €</b>

</div>

<button class="primary"
onclick="hirePalefrenier()">
👨‍🌾 Engager le palefrenier
</button>

${
trip.palefrenier?
`<div class="notice good">

</div>`:
""
}

`:
`

</div>
`
}

onclick="startTrip()">
🚚 Partir
</button>

);

}

function palefrenierCost(n,d){
return 80*d+25*n*d;
}

function hirePalefrenier(){

if(!trip)return;

let cost=
palefrenierCost(
trip.stableHorses.length,
trip.event.days
);

if(trip.palefrenier){

open(
"👨‍🌾",
"Le palefrenier est déjà engagé."
);

return;
}

if(game.money<cost){

open(
"💸",
"Pas assez d'argent."
);

return;
}

game.money-=cost;

trip.palefrenier=true;
trip.palefrenierCost=cost;

save();

prepareTrip();
}

function startTrip(){

if(
trip.event.days>1&&
trip.stableHorses.length&&
!trip.palefrenier
){

open(
"👨‍🌾",
"Engage le palefrenier avant de partir."
);

return;
}

trip.travelHorses.forEach(id=>{

let h=game.horses.find(
x=>String(x.id)===String(id)
);

if(h)
h.away=true;

});

runCompetitionDay();
}

function competitionScore(h,d,level){

let diff=
level==="Club"?0:
level==="Amateur"?8:
16;

let mental=
h.character.mental*.06+
h.character.calm*.025+
h.character.courage*.025+
h.character.concentration*.05;

let condition=
h.form*.08-
h.fatigue*.11+
h.health*.04;

let sport=
h.current[d]*.50+
h.potential[d]*.12+
h.experience[d]*.12+
h.regularity[d]*.10;

let random=Math.random()*18-9;

return sport+
mental+
condition+
random-
diff;
}

function runCompetitionDay(){

let e=trip.event;

trip.day++;
trip.remaining--;

let results=[];

trip.travelHorses.forEach(id=>{

let h=game.horses.find(
x=>String(x.id)===String(id)
);

if(!h)return;

let score=
competitionScore(
h,
e.discipline,
e.level
);

let competitors=[];

for(
let i=0;
i<e.places-1;
i++
)
competitors.push(
Math.random()*100
);

let rank=
1+
competitors.filter(
x=>x>score
).length;

rank=clamp(
rank,
1,
e.places
);

let penalties=0;
let summary="";

if(e.discipline==="CSO"){

let obstacles=
rand(10,14);

let bars=
chance(.18+
h.fatigue/400)?
rand(1,2):
0;

let refusals=
chance(
.06+
(100-h.character.courage)/1000
)?
1:
0;

let timeFault=
chance(.14+
h.fatigue/500)?
rand(1,3):
0;

penalties=
bars*4+
refusals*4+
timeFault;

let time=
clamp(
70+
Math.random()*18+
h.fatigue*.08-
h.character.concentration*.03,
58,
100
);

summary=
`${obstacles} obstacles · ${bars} barre(s) · ${refusals} refus · ${timeFault} pt(s) temps · chrono ${time.toFixed(2)} s`;

}

else if(e.discipline==="Dressage"){

let percent=
clamp(
50+
h.current.Dressage*.38+
h.character.concentration*.08+
h.character.calm*.05+
Math.random()*8-
h.fatigue*.04,
45,
85
);

penalties=
Math.round(
(100-percent)*10
)/10;

summary=
`Moyenne ${percent.toFixed(2)} %`;

}

else{

let dress=
clamp(
50+
h.current.CCE*.35+
h.character.concentration*.05+
Math.random()*10-
h.fatigue*.04,
45,
82
);

let cross=
rand(0,11);

let cso=
chance(
.20+
(100-h.character.courage)/500
)?
4:
0;

penalties=
Math.round(
(100-dress)*1.5+
cross+
cso
);

summary=
`Dressage ${dress.toFixed(2)} % · cross +${cross} · CSO +${cso}`;
}

let points=
qualificationPoints(
rank,
e.places,
penalties
);

h.qualPoints[e.discipline]+=points;

h.courses[e.discipline]++;

h.lastCompetitionDay=game.day;

h.experience[e.discipline]=
clamp(
h.experience[e.discipline]+3,
0,
100
);

h.fatigue=
clamp(
h.fatigue+28,
0,
100
);

h.form=
clamp(
h.form-8,
0,
100
);

if(rank===1){

h.career.wins[e.discipline]++;

h.career.earnings+=
e.level==="Club"?250:
e.level==="Amateur"?600:
1500;

game.money+=
e.level==="Club"?250:
e.level==="Amateur"?600:
1500;

}

if(rank<=3){

h.career.podiums[e.discipline]++;
}

if(
!h.career.bestRank[e.discipline]||
rank<h.career.bestRank[e.discipline]
){

h.career.bestRank[e.discipline]=rank;
}

let injuryChance=
.025+
h.fatigue/900+
(100-h.health)/1200+
(h.age>=14?.02:0);

if(chance(injuryChance)){

let injuryTypes=[
"petite lésion musculaire",
"tendinite légère",
"contusion",
"douleur dorsale",
"petit problème de pied"
];

let injury=
injuryTypes[
rand(0,injuryTypes.length-1)
];

let duration=rand(5,14);

h.injuries.push({
type:injury,
active:true,
until:game.day+duration
});

historyEvent(
h,
`Blessure après concours : ${injury}. Repos ${duration} jours.`
);
}

let result=
`J${dateDay()} · ${e.city} · ${e.discipline} ${e.level} · ${rank}e/${e.places} · ${summary} · +${points} pts`;

h.results.push(result);

historyEvent(
h,
`Concours à ${e.city} : ${rank}e/${e.places}, ${e.discipline}, +${points} points de qualification.`
);

results.push({
name:h.name,
rank,
places:e.places,
penalties,
points,
summary
});

});

save();

showDayResults(results);
}

function qualificationPoints(rank,total,penalties){

let q=Math.ceil(total*.25);

if(rank<=q)
return penalties===0?10:5;

if(rank<=Math.ceil(total*.5))
return 3;

if(rank<=Math.ceil(total*.75))
return 1;

return 0;
}

40,

)

mode==="foal"?

rand(3,14);

["Jument","Hongre","Entier"]

base=rand(3500,60000);

else
base=rand(2500,30000);

makeHorse(
"m"+Date.now()+i,
uniqueName(),
race,
age,
sex,
"market",
base,
p
);

h.purchasePrice=base;

h.ranges=rangesFor(
p,
age
);

arr.push(h);
}

return arr;
}

function marketList(er,mode){

let r=decodeURIComponent(er);

let horses=
generateMarket(
r,
mode==="auction"?5:6,
mode
);

let key=
mode+"_"+r;

marketCache[key]=horses;

open(
mode==="breeder"?
"🧬 Élevage · "+r:
mode==="auction"?
"🔨 Enchères · "+r:
"🐎 Marchand · "+r,

horses
.map((h,i)=>{

let p=
probabilityProfile(
h.potential,
h.purchasePrice,
h.race
);

return `
<div class="marketCard">

<div class="marketPic">🐎</div>

<span class="badge">${h.sex}</span>
<span class="badge">${h.age} ans</span>
<span class="badge">${h.race}</span>

<h3>${h.name}</h3>

<div class="choice">

<b>🧠 Mental :</b>
${h.character.mental}/100<br>

❤️ Gentillesse :
${h.character.gentillesse}<br>

🧘 Calme :
${h.character.calme}<br>

🦁 Courage :
${h.character.courage}<br>

🎯 Concentration :
${h.character.concentration}

</div>

${potentialHTML(h)}

${probHTML(p)}

<br>

<b>
${mode==="auction"?
"Mise de départ":
"Prix"} :
${money(h.purchasePrice)}
</b>

<button class="primary"
onclick="buyMarket('${key}',${i})">
💰 Acheter
</button>

</div>
`;
})
.join("")
);

}

function buyMarket(key,i){

let h=marketCache[key]?.[i];

if(!h)return;

if(game.money<h.purchasePrice){

open(
"💸",
"Pas assez d'argent."
);

return;
}

if(
game.horses.filter(
x=>x.place==="box"&&!x.away
).length>=game.boxes
){

open(
"🏠",
"Plus de box disponible."
);

return;
}

game.money-=h.purchasePrice;

h.id=
"h"+
Date.now()+
Math.random();

h.place="box";
h.away=false;

historyEvent(
h,
`Achat : ${money(h.purchasePrice)}.`
);

game.horses.push(h);

save();

horseBook(h.id);
}

function professional(key,id,cost,interval,gain){

let h=
game.horses.find(
x=>String(x.id)===String(id)
);

if(!h)return;

if(game.money<cost){

open(
"💸",
"Pas assez d'argent."
);

return;
}

game.money-=cost;

h[key]={
lastDay:game.day,
nextDay:game.day+interval
};

h.health=
clamp(
h.health+gain,
0,
100
);

if(key==="vet"){

h.injuries.forEach(i=>{

if(
i.active&&
game.day>=i.until
)
i.active=false;

});

if(
h.injuries.some(i=>i.active)
){

historyEvent(
h,
"Visite vétérinaire : blessure suivie, repos maintenu."
);

}else{

historyEvent(
h,
"Visite vétérinaire : contrôle général."
);

}

}else{

historyEvent(
h,
`Visite ${
key==="dentist"?
"du dentiste":
"de l'ostéopathe"
}.`
);

}

save();

horseBook(
id,
key==="vet"?
"health":
key
);
}

function retireHorse(id){

let h=
game.horses.find(
x=>String(x.id)===String(id)
);

if(!h)return;

if(h.age<20){

open(
"🛑",
"Le départ à la retraite est conseillé à partir de 20 ans."
);

return;
}

h.retired=true;
h.away=false;

historyEvent(
h,
"Départ à la retraite."
);

save();

horseBook(id);
}

function nextDay(){

if(trip){

open(
"🏆",
"Impossible d'avancer la journée pendant un concours."
);

return;
}

game.money=
Math.max(
0,
game.money-350
);

game.day++;

if(dateDay()===1)
game.year++;

game.horses.forEach(h=>{

if(h.away)
return;

if(dateDay()===1){

h.age++;

h.ranges=
rangesFor(
h.potential,
h.age
);

if(h.age===20&&!h.retired){

historyEvent(
h,
"Le cheval atteint 20 ans : retraite désormais conseillée."
);

}

}

if(h.age>=13){

h.current.CSO=
Math.min(
h.current.CSO,
h.potential.CSO
);

h.current.CCE=
Math.min(
h.current.CCE,
h.potential.CCE
);

h.current.Dressage=
Math.min(
h.current.Dressage,
h.potential.Dressage
);

}

h.fatigue=
clamp(
h.fatigue-
(h.place==="pasture"?10:7),
0,
100
);

h.form=
clamp(
h.form+1,
0,
100
);

if(h.place==="pasture"){

h.health=
clamp(
h.health+1,
0,
100
);

}

game.hay=
Math.max(
0,
game.hay-h.ration.hay
);

game.grain=
Math.max(
0,
game.grain-h.ration.grain
);

game.straw=
Math.max(
0,
game.straw-.5
);

h.injuries.forEach(i=>{

if(
i.active&&
game.day>=i.until
){

i.active=false;

historyEvent(
h,
`Fin de repos après ${i.type}.`
);

}

});

if(
chance(.012)&&
h.health<85
){

h.illnesses.push(
`Épisode léger détecté à J${game.day}`
);

h.health=
clamp(
h.health-5,
0,
100
);

historyEvent(
h,
"Petit épisode de santé, surveillance recommandée."
);

}

if(
game.hay===0||
game.grain===0
){

h.health=
clamp(
h.health-1,
0,
100
);

h.form=
clamp(
h.form-2,
0,
100
);

}

if(h.fatigue>80){

h.form=
clamp(
h.form-3,
0,
100
);

}

});

save();
}

render();
