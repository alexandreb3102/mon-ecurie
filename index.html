<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon Écurie — V0.2</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f3eee6;color:#2d261f}
header{background:#604633;color:#fff;padding:18px;text-align:center}
header h1{margin:0 0 8px}.money{font-size:28px;font-weight:800}
main{max-width:900px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 8px #0001}
button{border:0;border-radius:8px;padding:10px 12px;margin:3px;background:#604633;color:#fff;font-size:15px}
.horse{border-top:1px solid #ddd;padding:10px 0}
.log{background:#211c18;color:#eee;padding:12px;border-radius:10px;line-height:1.6}
</style>
</head>
<body>

<header>
<h1>🐴 Mon Écurie — V0.2</h1>
<div id="money" class="money"></div>
</header>

<main>
<div class="grid">

<div class="card">
<h2>🏡 Écurie</h2>
<div id="stable"></div>
<button onclick="buildBox()">Construire un box · 4 500 €</button>
</div>

<div class="card">
<h2>🌱 Prairie</h2>
<div id="field"></div>
<button onclick="restField()">Repos de la prairie</button>
</div>

<div class="card">
<h2>🌾 Fourrage</h2>
<div id="feed"></div>
<button onclick="buyHay()">Acheter 10 bottes · 250 €</button>
</div>

<div class="card">
<h2>📅 Temps</h2>
<div id="time"></div>
<button onclick="nextWeek()">Passer une semaine · 350 €</button>
</div>

</div>

<h2>🐎 Chevaux</h2>
<div id="horses" class="card"></div>

<h2>🏆 Activités</h2>
<button onclick="trainHorse(0)">Entraîner Luna</button>
<button onclick="competition()">Faire un concours</button>
<button onclick="buyHorse()">Acheter un cheval · 6 000 €</button>
<button onclick="lesson()">Donner un cours · +120 €</button>

<h2>📜 Journal</h2>
<div id="log" class="log"></div>
</main>

<script>
const game={
 money:12000,
 boxes:4,
 hectares:2,
 grass:3,
 hay:12,
 week:1,
 horses:[
  {name:"Luna",age:8,form:82,fatigue:18,potential:91},
  {name:"Caramel",age:12,form:76,fatigue:12,potential:72}
 ],
 logs:["Bienvenue dans votre première écurie !"]
};

const euro=n=>n.toLocaleString("fr-FR")+" €";

function message(txt){
 game.logs.unshift(txt);
 game.logs=game.logs.slice(0,6);
 render();
}

function render(){
 document.getElementById("money").textContent="💰 "+euro(game.money);
 document.getElementById("stable").textContent=
  game.boxes+" boxes · "+game.horses.length+"/"+game.boxes+" chevaux";
 document.getElementById("field").textContent=
  game.hectares+" ha · "+"⭐".repeat(game.grass)+" · "+game.horses.length+" chevaux";
 document.getElementById("feed").textContent=game.hay+" bottes";
 document.getElementById("time").textContent="Semaine "+game.week+"/52";

 document.getElementById("horses").innerHTML=game.horses.map((h,i)=>
  "<div class='horse'><b>"+h.name+"</b> · "+h.age+" ans<br>"+
  "Forme "+h.form+"% · Fatigue "+h.fatigue+"% · Potentiel "+h.potential+"%<br>"+
  "<button onclick='trainHorse("+i+")'>Entraîner</button>"+
  "<button onclick='healHorse("+i+")'>Repos</button></div>"
 ).join("");

 document.getElementById("log").innerHTML=game.logs.join("<br>");
}

function buildBox(){
 if(game.money<4500)return message("❌ Pas assez d'argent.");
 game.money-=4500;
 game.boxes++;
 message("🏠 Nouveau box construit : -4 500 €.");
}

function buyHay(){
 if(game.money<250)return message("❌ Pas assez d'argent.");
 game.money-=250;
 game.hay+=10;
 message("🌾 10 bottes achetées : -250 €.");
}

function restField(){
 game.grass=Math.min(4,game.grass+1);
 message("🌱 Prairie mise au repos.");
}

function trainHorse(i){
 const h=game.horses[i];
 if(!h)return;
 if(h.fatigue>70)return message("😴 "+h.name+" est trop fatigué.");
 h.form=Math.min(100,h.form+4);
 h.fatigue=Math.min(100,h.fatigue+16);
 message("🏇 Bonne séance pour "+h.name+".");
}

function healHorse(i){
 const h=game.horses[i];
 h.fatigue=Math.max(0,h.fatigue-30);
 message("😴 "+h.name+" récupère.");
}

function lesson(){
 game.money+=120;
 message("🏇 Cours donné : +120 €.");
}

function competition(){
 const h=game.horses[0];
 if(h.fatigue>65)return message("😴 "+h.name+" est trop fatigué.");
 h.fatigue=Math.min(100,h.fatigue+35);
 const score=Math.max(0,Math.round(h.form-Math.random()*35));
 const gain=score>80?700:score>60?300:0;
 game.money+=gain;

 if(score>80)message("🥇 "+h.name+" gagne ! +"+euro(gain)+".");
 else if(score>60)message("🏅 Bon classement ! +"+euro(gain)+".");
 else message("❌ Concours difficile pour "+h.name+".");
}

function buyHorse(){
 if(game.horses.length>=game.boxes)
  return message("🏡 Plus de box disponible.");

 if(game.money<6000)
  return message("❌ Pas assez d'argent.");

 game.money-=6000;

 const names=["Naya","Orion","Jupiter","Volt","Eclipse"];
 const name=names[Math.floor(Math.random()*names.length)];

 game.horses.push({
  name:name,
  age:5+Math.floor(Math.random()*6),
  form:65,
  potential:55+Math.floor(Math.random()*40),
  fatigue:10
 });

 message("🐴 "+name+" rejoint l'écurie : -6 000 €.");
}

function nextWeek(){
 if(game.money<350)
  return message("❌ Pas assez d'argent pour les charges.");

 game.money-=350;
 game.week++;

 game.horses.forEach(h=>{
  h.fatigue=Math.max(0,h.fatigue-20);
  h.form=Math.min(100,h.form+2);
 });

 if(game.hay>0)
  game.hay=Math.max(0,game.hay-game.horses.length);

 message("📅 Une semaine passe : -350 €.");
}

render();
</script>
</body>
</html>
