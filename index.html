<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Écurie V13.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07170d;font-family:Arial,sans-serif;color:#294b38}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#edf0e8}
header{position:sticky;top:0;z-index:50;padding:14px;background:linear-gradient(145deg,#173b25,#315f3c);color:#fff;box-shadow:0 3px 12px #0006}
h1{font:700 25px Georgia,serif;margin:0 0 8px}
.headerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.headerStat{background:#ffffff18;border-radius:10px;padding:7px;text-align:center;font-size:11px}
main{padding:10px 10px 88px}
.sectionTitle{font:700 18px Georgia,serif;color:#fff;background:linear-gradient(90deg,#315f3c,#6d8c59);padding:8px 10px;border-radius:12px;margin:13px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuBtn{border:1px solid #c9d3c4;border-radius:14px;min-height:68px;padding:10px;background:linear-gradient(145deg,#fffaf0,#dce8d4);color:#294b38;font-weight:900;box-shadow:0 3px 8px #0002}
.primary,.secondary,.back,.close{border:0;border-radius:11px;padding:10px;font-weight:900}
.primary{width:100%;background:#315f3c;color:#fff;margin-top:7px}
.secondary{width:100%;background:#d9e3d4;color:#294b38;margin-top:7px}
.back{background:#d9e3d4;color:#294b38;font-size:17px}
.close{background:#d5d1c5;font-size:17px}
.choice,.card,.marketCard{padding:11px;margin:7px 0;border-radius:14px;background:#fff;border:1px solid #d2dbce;box-shadow:0 2px 6px #0001}
.notice{padding:11px;margin:7px 0;border-radius:12px;background:#fff9e8;border:1px solid #dfd0a8}
.good{background:#edf7ea;border-color:#a9c79f}
.alert{background:#fff0e8;border-color:#d98d65}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#dfe8d7;font-size:11px;font-weight:800;margin:2px}
.input{width:100%;padding:10px;border:1px solid #c7d1c1;border-radius:10px;background:#fff}
.statLine{display:flex;justify-content:space-between;margin:7px 0}
.progress{height:8px;background:#d5dbd0;border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#5d8b5e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs{display:flex;gap:5px;overflow:auto;margin:8px 0}
.tabs button{white-space:nowrap;border:0;border-radius:10px;padding:9px;background:#d8e1d3;color:#294b38;font-weight:800}
.tabs button.active{background:#315f3c;color:#fff}
.hero{height:145px;margin:-10px -10px 10px;position:relative;overflow:hidden;background:linear-gradient(#8bb5c7 0 48%,#6f995e 48% 74%,#8a6943 74%);border-bottom:5px solid #584029}
.hero:before{content:"";position:absolute;left:-10%;bottom:20px;width:120%;height:75px;background:radial-gradient(ellipse at 15% 80%,#355c38 0 35px,transparent 36px),radial-gradient(ellipse at 50% 85%,#426b3e 0 45px,transparent 46px),radial-gradient(ellipse at 85% 80%,#355c38 0 40px,transparent 41px)}
.stable{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:180px;height:70px;background:#875737;border:5px solid #54331f}
.door{position:absolute;left:64px;bottom:0;width:50px;height:46px;background:#35261f;border:3px solid #d0a66d}
.hero .horse{position:absolute;right:18px;bottom:18px;font-size:68px}
.hero h2{position:absolute;left:12px;top:8px;color:#fff;text-shadow:0 2px 4px #000;font:700 21px Georgia,serif}
.horsePic,.marketPic{height:105px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7b997,#607b54 55%,#b59a6b);font-size:68px;margin-bottom:8px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#000b;z-index:100}
.modal.show{display:flex}
.modalBox{width:min(410px,95vw);max-height:92vh;overflow:auto;padding:16px;border-radius:22px;background:linear-gradient(145deg,#f8f1df,#dfe8d7);border:2px solid #b99d5b;box-shadow:0 20px 60px #000}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modalHead h2{margin:0;font:700 21px Georgia,serif}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#173b25;padding:5px;z-index:60}
.bottom button{border:0;background:#315f3c;color:#fff;border-radius:9px;padding:8px 2px;font-size:10px;font-weight:800}
.rank{text-align:center;font-size:25px;font-weight:900;padding:10px}
.map{position:relative;height:330px;border-radius:18px;background:linear-gradient(#b8d6df,#dfe8d7);border:2px solid #8ca68b;overflow:hidden}
.map:before{content:"🇫🇷";position:absolute;font-size:230px;opacity:.12;left:90px;top:35px}
.pin{position:absolute;border:0;border-radius:50%;width:42px;height:42px;background:#315f3c;color:#fff;font-size:19px;box-shadow:0 3px 7px #0006}
.pin span{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#fff;color:#294b38;padding:3px 6px;border-radius:7px;font-size:9px;white-space:nowrap;font-weight:900}
</style>
</head>

<body>
<div id="app">

<header>
<h1>🐴 Mon Écurie <span style="font-size:12px">V13.2</span></h1>
<div class="headerGrid">
<div class="headerStat">📅 <b id="dateLabel"></b><br><span id="dayLabel"></span><br><span id="season"></span></div>
<div class="headerStat">💰 <b id="money"></b><br><span id="rep"></span></div>
<div class="headerStat">🐴 <b id="horseCount"></b><br><span id="boxCount"></span></div>
</div>
</header>

<main>
<div class="hero">
<h2>🌿 La vie à l'écurie</h2>
<div class="stable"><div class="door"></div></div>
<div class="horse">🐎</div>
</div>

<div id="alerts"></div>

<div class="sectionTitle">📅 Gestion quotidienne</div>
<div class="grid">
<button class="menuBtn" onclick="nextDay()">⏩<br>Passer 1 jour</button>
<button class="menuBtn" onclick="calendarPage()">📆<br>Calendrier</button>
<button class="menuBtn" onclick="financesPage()">💰<br>Finances</button>
<button class="menuBtn" onclick="saveManual()">💾<br>Sauvegarder</button>
</div>

<div class="sectionTitle">🐴 Mes chevaux</div>
<div class="grid">
<button class="menuBtn" onclick="horsesPage()">🐎<br>Mes chevaux</button>
<button class="menuBtn" onclick="feedPage()">🥕<br>Rations</button>
<button class="menuBtn" onclick="trainingPage()">🏋️<br>Entraînement</button>
<button class="menuBtn" onclick="carePage()">❤️<br>Soins</button>
</div>

<div class="sectionTitle">🏪 Marché</div>
<div class="grid">
<button class="menuBtn" onclick="marketPage()">🏪<br>Marché</button>
<button class="menuBtn" onclick="salesPage()">💶<br>Vendre</button>
</div>

<div class="sectionTitle">👨‍⚕️ Professionnels</div>
<div class="grid">
<button class="menuBtn" onclick="vetPage()">🩺<br>Vétérinaire</button>
<button class="menuBtn" onclick="farrierPage()">🧲<br>Maréchal</button>
<button class="menuBtn" onclick="dentistPage()">🦷<br>Dentiste</button>
<button class="menuBtn" onclick="osteoPage()">👐<br>Ostéopathe</button>
</div>

<div class="sectionTitle">🏆 Vie sportive</div>
<div class="grid">
<button class="menuBtn" onclick="competitionMap()">🗺️<br>Concours</button>
<button class="menuBtn" onclick="championshipPage()">🇫🇷<br>Championnats</button>
<button class="menuBtn" onclick="breedingPage()">❤️‍🔥<br>Reproduction</button>
<button class="menuBtn" onclick="transportPage()">🚚<br>Transport</button>
</div>

<div class="sectionTitle">🏡 Domaine</div>
<div class="grid">
<button class="menuBtn" onclick="domainPage()">🏡<br>Domaine</button>
<button class="menuBtn" onclick="stablePage()">🏚️<br>Boxes</button>
<button class="menuBtn" onclick="pasturePage()">🌳<br>Pâtures</button>
<button class="menuBtn" onclick="stocksPage()">📦<br>Stocks</button>
</div>
</main>

<nav class="bottom">
<button onclick="horsesPage()">🐴<br>Chevaux</button>
<button onclick="marketPage()">🏪<br>Marché</button>
<button onclick="competitionMap()">🏆<br>Concours</button>
<button onclick="farrierPage()">🧲<br>Pro</button>
<button onclick="domainPage()">🏡<br>Domaine</button>
</nav>
</div>

<div id="modal" class="modal">
<div class="modalBox">
<div class="modalHead">
<div style="display:flex;align-items:center;gap:6px">
<button id="backBtn" class="back" onclick="goBack()">←</button>
<h2 id="modalTitle">Mon Écurie</h2>
</div>
<button class="close" onclick="closeModal()">✕</button>
</div>
<div id="modalContent"></div>
</div>
</div>

<script>

const STORAGE="monEcurieV13_2";

const BREEDS=[
"Selle Français","KWPN","Anglo-Arabe","Connemara",
"Poney Français de Selle","Hanovrien","Oldenbourg",
"Quarter Horse","Lusitanien","Frison"
];

const NAMES=[
"Luna","Caramel","Jasper","Étoile","Silver Moon","Golden Dream",
"Belle Romance","Royal Star","Évidence","Mystère","Opale","Nébuleuse",
"Rivière","Saphir","Toscane","Violette","Orage","Galaxie","Éclipse",
"Tempête","Vanille","Praline","Câline","Nikita","Sultan","Atlas","Jazz",
"Jade","Ambre","Rubis","Topaze","Perle","Safran","Mistral","Phoenix",
"Volcan","Aria","Bella","Cassandre","Diva","Émeraude","Fleur",
"Harmonie","Isis","Karma","Légende","Mélodie","Nova","Ondine","Pacha",
"Quartz","Rêve","Soleil","Tango","Ulysse","Vega","Whisky","Xena",
"Yoko","Zéphyr","Aube","Bambou","Cobalt","Dune","Flamme","Gatsby",
"Hélios","Icare","Joy","Kenza","Lilas","Maestro","Nacre","Olympe",
"Pistache","Roméo","Salsa","Trésor","Utopia","Victoire","Willow",
"Zara","Altesse","Bounty","César","Darling","Elixir","Fidji","Ginger",
"Horizon","Jupiter","Kiss","Lancelot","Moka","Nirvana","Oscar",
"Pépite","Roxane","Titan","Vénus","Wendy","Yasmine"
];

const RACE={
"Selle Français":{CSO:15,CCE:8,Dressage:2},
"KWPN":{CSO:10,CCE:5,Dressage:15},
"Anglo-Arabe":{CSO:7,CCE:17,Dressage:4},
"Connemara":{CSO:12,CCE:11,Dressage:2},
"Poney Français de Selle":{CSO:13,CCE:11,Dressage:5},
"Hanovrien":{CSO:6,CCE:3,Dressage:18},
"Oldenbourg":{CSO:9,CCE:2,Dressage:15},
"Quarter Horse":{CSO:2,CCE:5,Dressage:1},
"Lusitanien":{CSO:2,CCE:5,Dressage:18},
"Frison":{CSO:1,CCE:3,Dressage:15}
};

const $=x=>document.getElementById(x);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>Math.round(n).toLocaleString("fr-FR")+" €";

let nav=[];
let currentPage=null;

function dateDay(){
return((game.day-1)%365)+1;
}

function dateText(){
let d=new Date(2026,8,1);
d.setDate(d.getDate()+dateDay()-1);
return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}

function season(){
let d=dateDay();
return d<=91?"🍂 Automne":d<=182?"❄️ Hiver":d<=274?"🌸 Printemps":"☀️ Été";
}

function clone(x){return JSON.parse(JSON.stringify(x));}

function potentials(r){
let b=RACE[r]||{CSO:0,CCE:0,Dressage:0};
let base=55+Math.floor(Math.random()*25);
return{
CSO:clamp(base+b.CSO+Math.floor(Math.random()*11-5),35,98),
CCE:clamp(base+b.CCE+Math.floor(Math.random()*11-5),35,98),
Dressage:clamp(base+b.Dressage+Math.floor(Math.random()*11-5),35,98)
};
}

function horse(id,name,race,age,sex,place,p){
p=p||potentials(race);
return{
id,name,race,age,sex,place:place||"pasture",
retired:false,
potential:p,
current:{
CSO:Math.min(p.CSO,30+Math.floor(Math.random()*40)),
CCE:Math.min(p.CCE,30+Math.floor(Math.random()*40)),
Dressage:Math.min(p.Dressage,30+Math.floor(Math.random()*40))
},
experience:{CSO:0,CCE:0,Dressage:0},
regularity:{CSO:50,CCE:50,Dressage:50},
health:94,form:80,fatigue:15,mental:75,
ration:{hay:10,grain:3},
hoof:{type:"ferrure",lastDay:1},
vet:{lastDay:1,nextDay:91},
dentist:{lastDay:1,nextDay:181},
osteo:{lastDay:1,nextDay:121},
father:{name:"Père d'origine",results:["Origines enregistrées"]},
mother:{name:"Mère d'origine",results:["Origines enregistrées"]},
results:[],
qualPoints:{CSO:0,CCE:0,Dressage:0},
courses:{CSO:0,CCE:0,Dressage:0},
lastCompetitionDay:-999,
away:false
};
}

const initial={
money:18450,reputation:0,day:1,year:1,
boxes:6,pastures:1,land:1,
truckCapacity:2,
hay:1200,grain:800,straw:600,
maxHay:2000,maxGrain:1500,maxStraw:1500,
horses:[
horse(1,"Luna","Selle Français",8,"Jument","box",
{CSO:86,CCE:74,Dressage:62}),
horse(2,"Caramel","Anglo-Arabe",12,"Hongre","box",
{CSO:74,CCE:86,Dressage:61}),
horse(3,"Jasper","Quarter Horse",6,"Hongre","pasture",
{CSO:61,CCE:63,Dressage:55}),
horse(4,"Étoile","Connemara",4,"Jument","pasture",
{CSO:78,CCE:75,Dressage:61})
]
};

function normalize(g){
g=Object.assign(clone(initial),g);
g.horses=(g.horses||[]).map(h=>{
if(!h.potential||typeof h.potential!=="object"){
let p=Number(h.realPotential)||65;
h.potential={CSO:p,CCE:p,Dressage:p};
}
if(!h.current||typeof h.current!=="object")
h.current={CSO:45,CCE:45,Dressage:45};
if(!h.experience)h.experience={CSO:0,CCE:0,Dressage:0};
if(!h.regularity)h.regularity={CSO:50,CCE:50,Dressage:50};
if(!h.qualPoints)h.qualPoints={CSO:0,CCE:0,Dressage:0};
if(!h.courses)h.courses={CSO:0,CCE:0,Dressage:0};
if(!h.ration)h.ration={hay:10,grain:3};
if(!h.hoof)h.hoof={type:"ferrure",lastDay:1};
if(!h.vet)h.vet={lastDay:1,nextDay:g.day+90};
if(!h.dentist)h.dentist={lastDay:1,nextDay:g.day+180};
if(!h.osteo)h.osteo={lastDay:1,nextDay:g.day+120};
if(!h.results)h.results=[];
if(h.lastCompetitionDay==null)h.lastCompetitionDay=-999;
if(h.away==null)h.away=false;
return h;
});
return g;
}

function load(){
try{
let s=localStorage.getItem(STORAGE);
if(s)return normalize(JSON.parse(s));
}catch(e){}
return normalize(clone(initial));
}

let game=load();

function save(){
localStorage.setItem(STORAGE,JSON.stringify(game));
render();
}

function render(){
$("dateLabel").textContent=dateText();
$("dayLabel").textContent="J"+dateDay()+"/365 · Année "+game.year;
$("season").textContent=season();
$("money").textContent=money(game.money);
$("rep").textContent="⭐ "+game.reputation;
$("horseCount").textContent=game.horses.length;
$("boxCount").textContent=
game.horses.filter(h=>h.place==="box"&&!h.away).length+"/"+game.boxes+" boxes";

let a=[];
game.horses.forEach(h=>{
if(game.day>=h.hoof.lastDay+60)
a.push("🚨 <b>"+h.name+"</b> : maréchal à prévoir.");
if(game.day>=h.vet.nextDay)
a.push("🩺 <b>"+h.name+"</b> : vétérinaire à prévoir.");
});
$("alerts").innerHTML=a.slice(0,5).map(x=>`<div class="notice alert">${x}</div>`).join("");
}

function open(title,html,back=true){
$("modalTitle").textContent=title;
$("modalContent").innerHTML=html;
$("modal").classList.add("show");
$("backBtn").style.display=back&&nav.length?"block":"none";
}

function closeModal(){
nav=[];
currentPage=null;
$("modal").classList.remove("show");
}

$("modal").onclick=e=>{
if(e.target===$("modal"))closeModal();
};

function page(fn){
if(currentPage)nav.push(currentPage);
currentPage=fn;
fn();
}

function goBack(){
let f=nav.pop();
if(f){currentPage=f;f();}
else closeModal();
}

function stat(n,v){
return`<div class="choice"><div class="statLine"><span>${n}</span><b>${Math.round(v)}/100</b></div><div class="progress"><span style="width:${clamp(v,0,100)}%"></span></div></div>`;
}

function value(h){
let p=(h.potential.CSO+h.potential.CCE+h.potential.Dressage)/3;
let c=(h.current.CSO+h.current.CCE+h.current.Dressage)/3;
let v=2500+Math.pow(clamp(p*.55+c*.35+h.mental*.1,0,100)/100,2.5)*65000;
if(h.race==="OC")v*=.82;
if(h.age>=18)v*=.55;
if(h.health<70)v*=.85;
return Math.round(v);
}

/* CHEVAUX */

function horseCard(h){
return`
<div class="card">
<div class="horsePic">🐎</div>
<span class="badge">${h.race}</span>
<span class="badge">${h.age} ans</span>
<span class="badge">${h.sex}</span>
${h.away?'<span class="badge">🏆 En concours</span>':''}
<h3>${h.name}</h3>
${h.place==="box"?"🏠 Box":"🌳 Pré"} · 💰 ${money(value(h))}
${stat("🏇 CSO",h.current.CSO)}
${stat("🌳 CCE",h.current.CCE)}
${stat("💃 Dressage",h.current.Dressage)}
<button class="primary" onclick="horseBook('${h.id}')">📖 Carnet</button>
</div>`;
}

function horsesPage(){
page(()=>open("🐎 Mes chevaux",
game.horses.map(horseCard).join("")||
"<div class='notice'>Aucun cheval.</div>"));
}

function horseBook(id){
let h=game.horses.find(x=>String(x.id)===String(id));
if(!h)return;

open("📖 Carnet de "+h.name,`
<div class="horsePic">🐎</div>
<div class="notice">
<b>${h.race}</b> · ${h.age} ans · <b>${h.sex}</b><br>
${h.away?"🏆 En déplacement":"🏠 "+(h.place==="box"?"Box":"Pré")}
· ${money(value(h))}
</div>

<div class="sectionTitle">🏆 Disciplines</div>
${stat("🏇 CSO",h.current.CSO)}
${stat("🌳 CCE",h.current.CCE)}
${stat("💃 Dressage",h.current.Dressage)}

<div class="choice">
<b>Potentiel</b><br>
🏇 ${h.potential.CSO}/100 · 🌳 ${h.potential.CCE}/100 · 💃 ${h.potential.Dressage}/100
</div>

${stat("❤️ Santé",h.health)}
${stat("💪 Forme",h.form)}
${stat("😴 Fatigue",h.fatigue)}

<div class="sectionTitle">🇫🇷 Qualification</div>
<div class="choice">
🏇 CSO : <b>${h.qualPoints.CSO}</b> pts<br>
🌳 CCE : <b>${h.qualPoints.CCE}</b> pts<br>
💃 Dressage : <b>${h.qualPoints.Dressage}</b> pts
</div>

<div class="sectionTitle">🧬 Origines</div>
<div class="choice">
<b>Père :</b> ${h.father.name}<br>${h.father.results.join("<br>")}
<br><br>
<b>Mère :</b> ${h.mother.name}<br>${h.mother.results.join("<br>")}
</div>

<div class="sectionTitle">📜 Résultats</div>
${h.results.length?h.results.slice().reverse().map(x=>`<div class="choice">${x}</div>`).join(""):"<div class='notice'>Aucun résultat.</div>"}

<div class="two">
<button class="primary" onclick="setRation('${h.id}')">🥕 Ration</button>
<button class="primary" onclick="trainingFor('${h.id}')">🏋️ Travail</button>
</div>
<button class="secondary" onclick="togglePlace('${h.id}')">
${h.place==="box"?"🌳 Mettre au pré":"🏠 Mettre au box"}
</button>
`);
}

/* ENTRAINEMENT */

function trainingPage(){
page(()=>open("🏋️ Entraînement",
game.horses.filter(h=>!h.away).map(h=>`
<div class="card">
<b>${h.name}</b><br>
🏇 CSO ${h.current.CSO} · 🌳 CCE ${h.current.CCE} · 💃 Dressage ${h.current.Dressage}
<button class="primary" onclick="trainingFor('${h.id}')">Choisir une discipline</button>
</div>`).join("")));
}

function trainingFor(id){
let h=game.horses.find(x=>String(x.id)===String(id));
open("🏋️ Travail de "+h.name,`
<div class="choice">🏇 CSO — ${h.current.CSO}/${h.potential.CSO}
<button class="primary" onclick="train('${h.id}','CSO')">Entraîner</button></div>
<div class="choice">🌳 CCE — ${h.current.CCE}/${h.potential.CCE}
<button class="primary" onclick="train('${h.id}','CCE')">Entraîner</button></div>
<div class="choice">💃 Dressage — ${h.current.Dressage}/${h.potential.Dressage}
<button class="primary" onclick="train('${h.id}','Dressage')">Entraîner</button></div>`);
}

function train(id,d){
let h=game.horses.find(x=>String(x.id)===String(id));
if(h.fatigue>=75){open("😴","Cheval trop fatigué.");return;}
let gain=Math.max(1,Math.round(1+h.experience[d]/45));
h.current[d]=clamp(h.current[d]+gain,0,h.potential[d]);

h.form=clamp(h.form+3,0,100);
h.fatigue=clamp(h.fatigue+14,0,100);
save();
horseBook(id);
}

function palefrenierCost(n,d){
return 80*d+25*n*d;
}

function hirePalefrenier(){

trip.stableHorses.length,

);

return;
}

game.money-=cost;
trip.palefrenier=true;

save();

prepareTrip();
}

function startTrip(){

if(trip.event.days>1&&trip.stableHorses.length&&!trip.palefrenier){
open("👨‍🌾","Tu dois engager un palefrenier avant de partir.");
return;
}

trip.travelHorses.forEach(id=>{
let h=game.horses.find(x=>String(x.id)===String(id));
if(h)h.away=true;
});

runCompetitionDay();
}

function competitionScore(h,d,level){

let diff=level==="Club"?0:level==="Amateur"?10:20;

return(
h.current[d]*.50+
h.potential[d]*.15+
h.experience[d]*.12+
h.mental*.08+
h.regularity[d]*.10+
h.form*.05-
h.fatigue*.10+
Math.random()*18-9-
diff
);
}

function runCompetitionDay(){

let e=trip.event;

trip.day++;
trip.remaining--;

let results=[];

game.horses
.filter(h=>trip.travelHorses.includes(String(h.id)))
.forEach(h=>{

let score=competitionScore(h,e.discipline,e.level);

let competitors=[];

for(let i=0;i<e.places-1;i++)
competitors.push(Math.random()*100);

let rank=1+competitors.filter(x=>x>score).length;

rank=clamp(rank,1,e.places);

let penalties=0;
let summary="";

if(e.discipline==="CSO"){
let bars=Math.random()<.25?1+Math.floor(Math.random()*2):0;
let refus=Math.random()<.10?1:0;
let time=Math.random()<.18?1:0;
penalties=bars*4+refus*4+time;
summary=`${bars} barre(s), ${refus} refus, ${time?"temps dépassé":"temps correct"}`;
}

if(e.discipline==="Dressage"){
let percent=clamp(50+h.current.Dressage*.38+h.mental*.08+Math.random()*8,45,85);
penalties=Math.round((100-percent)*10)/10;
summary=`Moyenne ${percent.toFixed(3)} %`;
}

if(e.discipline==="CCE"){
let dress=clamp(50+h.current.CCE*.35+Math.random()*10,45,82);
let cross=Math.floor(Math.random()*12);
let cso=Math.random()<.3?4:0;
penalties=Math.round((100-dress)*1.5+cross+cso);
summary=`Dressage ${dress.toFixed(2)} %, cross +${cross}, CSO +${cso}`;
}

let points=qualificationPoints(rank,e.places,penalties,e.discipline);

h.qualPoints[e.discipline]+=points;
h.courses[e.discipline]++;
h.lastCompetitionDay=game.day;
h.experience[e.discipline]=clamp(h.experience[e.discipline]+3,0,100);

let fatigue=e.days===1?25:18;
h.fatigue=clamp(h.fatigue+fatigue,0,100);

let result=`${dateDay()} · ${e.city} · ${e.discipline} ${e.level} · ${rank}e/${e.places} · ${summary} · +${points} pts`;

h.results.push(result);

results.push({
name:h.name,
rank,
places:e.places,
penalties,
points,
summary
});
});

save();

showDayResults(results);
}

function qualificationPoints(rank,total,penalties,d){

let firstQuarter=Math.ceil(total*.25);
let secondQuarter=Math.ceil(total*.50);
let thirdQuarter=Math.ceil(total*.75);

if(rank<=firstQuarter){
if(penalties===0)return 10;
return 5;
}

if(rank<=secondQuarter)return 3;
if(rank<=thirdQuarter)return 1;

return 0;
}

"pasture",
p
);

let h=game.horses.find(x=>String(x.id)===String(id));
if(game.money<80){open("💸","Pas assez d'argent.");return;}
game.money-=80;
h.health=clamp(h.health+5,0,100);
h.form=clamp(h.form+4,0,100);
h.fatigue=clamp(h.fatigue-10,0,100);
save();
carePage();
}

function feedPage(){
page(()=>open("🥕 Rations",
game.horses.filter(h=>!h.away).map(h=>`
<div class="card">
<b>${h.name}</b><br>
🌾 ${h.ration.hay} kg · 🌽 ${h.ration.grain} kg
<button class="primary" onclick="setRation('${h.id}')">Modifier</button>
</div>`).join("")));
}

function setRation(id){
let h=game.horses.find(x=>String(x.id)===String(id));
open("🥕 Ration de "+h.name,`
<label>🌾 Foin kg/j</label>
<input id="hayI" class="input" type="number" value="${h.ration.hay}" step=".5">
<br><br>
<label>🌽 Grain kg/j</label>
<input id="grainI" class="input" type="number" value="${h.ration.grain}" step=".5">
<button class="primary" onclick="saveRation('${h.id}')">💾 Enregistrer</button>`);
}

function saveRation(id){
let h=game.horses.find(x=>String(x.id)===String(id));
h.ration.hay=clamp(parseFloat($("hayI").value)||0,0,25);
h.ration.grain=clamp(parseFloat($("grainI").value)||0,0,10);
save();
horseBook(id);
}

/* DOMAINE */

function domainPage(){
page(()=>open("🏡 Domaine",`
<div class="choice">
💰 ${money(game.money)}<br>
🏠 ${game.horses.filter(h=>h.place==="box"&&!h.away).length}/${game.boxes} boxes<br>
🌳 ${game.pastures} pâture(s)<br>
🌾 ${game.land} hectare(s)<br>
🚚 Camion : ${game.truckCapacity} places
</div>
<button class="primary" onclick="buyBox()">🏠 Box — 3 500 €</button>
<button class="primary" onclick="buyPasture()">🌳 Pâture — 5 000 €</button>
<button class="primary" onclick="buyLand()">🌾 Hectare — 8 000 €</button>`));
}

function buyBox(){
if(game.money<3500){open("💸","Pas assez d'argent.");return;}
game.money-=3500;game.boxes++;save();domainPage();
}

function buyPasture(){
if(game.money<5000){open("💸","Pas assez d'argent.");return;}
game.money-=5000;game.pastures++;save();domainPage();
}

function buyLand(){
if(game.money<8000){open("💸","Pas assez d'argent.");return;}
game.money-=8000;game.land++;save();domainPage();
}

function transportPage(){
page(()=>open("🚚 Transport",`
<div class="choice">
🚚 Capacité actuelle : <b>${game.truckCapacity} chevaux</b>
</div>
<button class="primary" onclick="upgradeTruck()">🚚 +2 places — 6 000 €</button>
`));
}

function upgradeTruck(){
if(game.truckCapacity>=12){open("🚚","Capacité maximale atteinte.");return;}
if(game.money<6000){open("💸","Pas assez d'argent.");return;}
game.money-=6000;
game.truckCapacity=Math.min(12,game.truckCapacity+2);
save();
transportPage();
}

function stablePage(){
page(()=>open("🏚️ Boxes",
game.horses.filter(h=>h.place==="box").map(horseCard).join("")||
"<div class='notice'>Aucun cheval.</div>"));
}

function pasturePage(){
page(()=>open("🌳 Pâtures",
game.horses.filter(h=>!h.away).map(h=>`
<div class="choice">
<b>${h.name}</b> · ${h.sex}<br>
${h.place==="pasture"?"🌳 Pré":"🏠 Box"}
<button class="primary" onclick="togglePlace('${h.id}')">
${h.place==="pasture"?"🏠 Mettre au box":"🌳 Mettre au pré"}
</button>
</div>`).join("")));
}

function togglePlace(id){
let h=game.horses.find(x=>String(x.id)===String(id));
if(h.place==="pasture"){
if(game.horses.filter(x=>x.place==="box"&&!x.away).length>=game.boxes){
open("🏠","Plus de box disponible.");
return;
}
h.place="box";
}else h.place="pasture";
save();
pasturePage();
}

function stocksPage(){
page(()=>open("📦 Stocks",`
<div class="choice">🌾 Foin : ${game.hay}/${game.maxHay} kg</div>
<div class="choice">🌽 Grain : ${game.grain}/${game.maxGrain} kg</div>
<div class="choice">🪵 Paille : ${game.straw}/${game.maxStraw} kg</div>
<button class="primary" onclick="buyStock('hay')">🌾 500 kg — 250 €</button>
<button class="primary" onclick="buyStock('grain')">🌽 300 kg — 180 €</button>
<button class="primary" onclick="buyStock('straw')">🪵 500 kg — 160 €</button>
`));
}

function buyStock(t){
let c=t==="hay"?250:t==="grain"?180:160;
let a=t==="hay"?500:t==="grain"?300:500;
let m=t==="hay"?game.maxHay:t==="grain"?game.maxGrain:game.maxStraw;
if(game.money<c){open("💸","Pas assez d'argent.");return;}
game.money-=c;
game[t]=Math.min(m,game[t]+a);
save();
stocksPage();
}

function financesPage(){
page(()=>open("💰 Finances",`
<div class="notice">💰 Trésorerie : <b>${money(game.money)}</b></div>
<div class="choice">🩺 Vétérinaire : 100 €</div>
<div class="choice">🦷 Dentiste : 70 €</div>
<div class="choice">👐 Ostéo : 90 €</div>
<div class="choice">🧲 Ferrure : 110 € · Parage : 50 €</div>
<div class="choice">📅 Frais quotidiens : 350 €</div>
`));
}

function calendarPage(){
page(()=>open("📆 Calendrier",`
<div class="notice">
<b>${dateText()}</b><br>
J${dateDay()}/365 · ${season()}<br><br>
🏆 Saison de concours : automne → fin juillet<br>
🇫🇷 Championnats : août
</div>
`));
}

function saveManual(){
save();
open("💾 Sauvegarde","La V13.2 est sauvegardée sur cet appareil.",false);
}

function nextDay(){

game.money-=350;
game.day++;

if(dateDay()===1)game.year++;

game.horses.forEach(h=>{

if(h.away)return;

h.fatigue=clamp(h.fatigue-(h.place==="pasture"?10:7),0,100);
h.form=clamp(h.form+1,0,100);

if(h.place==="pasture")
h.health=clamp(h.health+1,0,100);

game.hay=Math.max(0,game.hay-h.ration.hay);
game.grain=Math.max(0,game.grain-h.ration.grain);
game.straw=Math.max(0,game.straw-.5);

if(game.hay===0||game.grain===0){
h.health=clamp(h.health-1,0,100);
h.form=clamp(h.form-2,0,100);
}

});

save();
}

render();

</script>
</body>
</html>
