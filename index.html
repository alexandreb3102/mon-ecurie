<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Écurie V6</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;
 width:100%;
 min-height:100%;
 background:#07170d;
 font-family:Arial,sans-serif;
}
body{
 display:flex;
 justify-content:center;
}
#app{
 position:relative;
 width:100%;
 max-width:430px;
 min-height:100vh;
 overflow:hidden;
 background:#111;
}
#screen{
 position:relative;
 width:100%;
 aspect-ratio:853/1844;
 background:url("v6-maquette.jpg") center/100% 100% no-repeat;
}
.hit{
 position:absolute;
 border:0;
 background:transparent;
 border-radius:18px;
 cursor:pointer;
}
.hit:active{background:#ffffff20}

/* ACTIONS */
#weekBtn{left:2.5%;top:43%;width:18%;height:11%}
#hayBtn{left:21%;top:43%;width:18%;height:11%}
#grainBtn{left:40%;top:43%;width:18%;height:11%}
#careBtn{left:59%;top:43%;width:18%;height:11%}
#showBtn{left:78%;top:43%;width:19%;height:11%}

/* CHEVAUX */
#horse1{left:3%;top:57%;width:23%;height:12%}
#horse2{left:27%;top:57%;width:23%;height:12%}
#horse3{left:51%;top:57%;width:23%;height:12%}
#horse4{left:75%;top:57%;width:22%;height:12%}

/* MENU */
#domain{left:2%;bottom:0;width:18%;height:8%}
#stable{left:21%;bottom:0;width:18%;height:8%}
#horses{left:40%;bottom:0;width:18%;height:8%}
#shows{left:59%;bottom:0;width:18%;height:8%}
#care{left:78%;bottom:0;width:19%;height:8%}

/* MODAL */
#modal{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 padding:15px;
 background:#000b;
 z-index:1000;
}
#modal.show{display:flex}
.modalBox{
 width:min(400px,94vw);
 max-height:90vh;
 overflow:auto;
 padding:18px;
 border-radius:22px;
 background:linear-gradient(145deg,#f8f1df,#dfe8d7);
 color:#294b38;
 box-shadow:0 20px 60px #000;
 border:2px solid #b99d5b;
}
.modalHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.modalHead h2{
 margin:0;
 font:700 24px Georgia,serif;
}
.close{
 border:0;
 border-radius:10px;
 padding:8px 11px;
 background:#d5d1c5;
 font-size:18px;
}
.money{
 font-size:18px;
 font-weight:900;
 color:#8a6a19;
}
.choice{
 display:flex;
 gap:10px;
 align-items:center;
 padding:11px;
 margin:7px 0;
 border-radius:12px;
 background:#eef2e8;
 border:1px solid #d4ddcf;
}
.choice button{
 margin-left:auto;
}
.primary{
 width:100%;
 padding:12px;
 border:0;
 border-radius:12px;
 background:#315f3c;
 color:white;
 font-weight:900;
}
.statLine{
 display:flex;
 justify-content:space-between;
 margin:7px 0;
}
.progress{
 height:8px;
 background:#d5dbd0;
 border-radius:10px;
 overflow:hidden;
}
.progress span{
 display:block;
 height:100%;
 background:#5d8b5e;
}
.notice{
 padding:10px;
 margin:8px 0;
 border-radius:10px;
 background:#fff9e8;
 border:1px solid #dfd0a8;
}
</style>
</head>

<body>

<div id="app">
<div id="screen">

<!-- ACTIONS -->
<button class="hit" id="weekBtn"></button>
<button class="hit" id="hayBtn"></button>
<button class="hit" id="grainBtn"></button>
<button class="hit" id="careBtn"></button>
<button class="hit" id="showBtn"></button>

<!-- CHEVAUX -->
<button class="hit" id="horse1"></button>
<button class="hit" id="horse2"></button>
<button class="hit" id="horse3"></button>
<button class="hit" id="horse4"></button>

<!-- MENU -->
<button class="hit" id="domain"></button>
<button class="hit" id="stable"></button>
<button class="hit" id="horses"></button>
<button class="hit" id="shows"></button>
<button class="hit" id="care"></button>

</div>
</div>

<div id="modal">
<div class="modalBox">

<div class="modalHead">
<h2 id="modalTitle">Mon Écurie</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<div id="modalContent"></div>

</div>
</div>

<script>

/* =====================================================
   DONNÉES DE LA PARTIE
===================================================== */

const initialGame={
 money:18450,
 reputation:0,
 year:1,
 week:12,

 hay:1200,
 grain:800,
 straw:600,

 maxHay:2000,
 maxGrain:1500,
 maxStraw:1500,

 boxes:6,

 staff:[],

 horses:[
  {
   id:1,
   name:"Luna",
   race:"Selle Français",
   age:8,
   sex:"Jument",
   form:82,
   health:95,
   fatigue:18,
   place:"box"
  },
  {
   id:2,
   name:"Caramel",
   race:"Anglo-Arabe",
   age:12,
   sex:"Hongre",
   form:76,
   health:92,
   fatigue:12,
   place:"box"
  },
  {
   id:3,
   name:"Jasper",
   race:"Quarter Horse",
   age:6,
   sex:"Hongre",
   form:85,
   health:94,
   fatigue:9,
   place:"pasture"
  },
  {
   id:4,
   name:"Étoile",
   race:"Connemara",
   age:4,
   sex:"Jument",
   form:79,
   health:91,
   fatigue:20,
   place:"pasture"
  }
 ]
};

let game=loadGame();


/* =====================================================
   SAUVEGARDE
===================================================== */

function loadGame(){

 try{
  const save=localStorage.getItem("monEcurieV6");

  if(save){
   return JSON.parse(save);
  }

 }catch(e){}

 return JSON.parse(JSON.stringify(initialGame));
}


function saveGame(){

 localStorage.setItem(
  "monEcurieV6",
  JSON.stringify(game)
 );

}


/* =====================================================
   UTILITAIRES
===================================================== */

function money(n){

 return Math.round(n).toLocaleString("fr-FR")+" €";

}


function season(){

 if(game.week<=13)return"🌸 Printemps";
 if(game.week<=26)return"☀️ Été";
 if(game.week<=39)return"🍂 Automne";

 return"❄️ Hiver";

}


function openModal(title,content){

 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalContent").innerHTML=content;
 document.getElementById("modal").classList.add("show");

}


function closeModal(){

 document.getElementById("modal").classList.remove("show");

}


document.getElementById("modal").addEventListener(
 "click",
 e=>{
  if(e.target.id==="modal")closeModal();
 }
);


/* =====================================================
   FICHE CHEVAL
===================================================== */

function horseCard(h){

 return`
 <div class="choice" style="display:block">

  <div style="display:flex;gap:10px;align-items:center">

   <div style="font-size:38px">🐎</div>

   <div>
    <b style="font-size:18px">${h.name}</b><br>
    ${h.race} · ${h.age} ans<br>
    ${h.sex} · ${h.place==="box"?"🏠 Box":"🌳 Pré"}
   </div>

  </div>

  <div class="statLine">
   <span>💪 Forme</span>
   <b>${h.form}%</b>
  </div>

  <div class="progress">
   <span style="width:${h.form}%"></span>
  </div>

  <div class="statLine">
   <span>❤️ Santé</span>
   <b>${h.health}%</b>
  </div>

  <div class="progress">
   <span style="width:${h.health}%"></span>
  </div>

  <div class="statLine">
   <span>😴 Fatigue</span>
   <b>${h.fatigue}%</b>
  </div>

  <div class="progress">
   <span style="width:${h.fatigue}%"></span>
  </div>

  <div style="display:flex;gap:6px;margin-top:10px">

   <button
    class="primary"
    onclick="careHorse(${h.id})">
    ❤️ Soigner
   </button>

   <button
    class="primary"
    onclick="trainHorse(${h.id})">
    🏇 Entraîner
   </button>

  </div>

  <button
   class="primary"
   style="margin-top:6px"
   onclick="togglePlace(${h.id})">

   ${h.place==="box"
    ?"🌳 Mettre au pré"
    :"🏠 Rentrer au box"}

  </button>

 </div>
 `;

}


/* =====================================================
   CHEVAUX
===================================================== */

function horsesPage(){

 openModal(
  "🐎 Mes chevaux",
  game.horses.map(horseCard).join("")
 );

}


/* =====================================================
   SOINS
===================================================== */

function carePage(){

 openModal(
  "❤️ Soins",
  `
   <div class="notice">
   Prends soin de tes chevaux pour améliorer leur santé,
   leur forme et réduire leur fatigue.
   </div>

   ${game.horses.map(horseCard).join("")}
  `
 );

}


function careHorse(id){

 const h=game.horses.find(x=>x.id===id);

 if(!h)return;

 h.form=Math.min(100,h.form+4);
 h.health=Math.min(100,h.health+3);
 h.fatigue=Math.max(0,h.fatigue-7);

 game.reputation++;

 saveGame();

 openModal(
  "❤️ Soin terminé",
  `
  <div class="notice">
  <b>${h.name}</b> a été parfaitement soigné.
  </div>

  Forme : <b>${h.form}%</b><br>
  Santé : <b>${h.health}%</b><br>
  Fatigue : <b>${h.fatigue}%</b>

  <br><br>

  <button class="primary" onclick="closeModal()">
  Continuer
  </button>
  `
 );

}


/* =====================================================
   ENTRAINEMENT
===================================================== */

function trainHorse(id){

 const h=game.horses.find(x=>x.id===id);

 if(!h)return;

 if(h.fatigue>=75){

  openModal(
   "😴 Cheval fatigué",
   `<div class="notice">
   ${h.name} est trop fatigué pour un nouvel entraînement.
   Il faut lui laisser du repos.
   </div>`
  );

  return;
 }

 h.form=Math.min(100,h.form+6);
 h.fatigue=Math.min(100,h.fatigue+14);

 game.reputation++;

 saveGame();

 openModal(
  "🏇 Entraînement terminé",
  `
  <div class="notice">
  ${h.name} progresse !
  </div>

  Forme : <b>${h.form}%</b><br>
  Fatigue : <b>${h.fatigue}%</b>
  `
 );

}


/* =====================================================
   BOX / PRÉ
===================================================== */

function togglePlace(id){

 const h=game.horses.find(x=>x.id===id);

 if(!h)return;

 if(h.place==="box"){

  h.place="pasture";

 }else{

  const occupied=
   game.horses.filter(x=>x.place==="box").length;

  if(occupied>=game.boxes){

   openModal(
    "🏠 Écurie complète",
    `
    <div class="notice">
    Tous les boxes sont actuellement occupés.
    </div>
    `
   );

   return;
  }

  h.place="box";

 }

 saveGame();

 horsesPage();

}


/* =====================================================
   DOMAINE
===================================================== */

function domainPage(){

 openModal(
  "🏡 Domaine",
  `
  <div class="notice">
  <b>Mon Écurie</b><br>
  ${season()} · Semaine ${game.week}/52 · Année ${game.year}
  </div>

  <div class="choice">
  💰 Trésorerie : <b>${money(game.money)}</b>
  </div>

  <div class="choice">
  ⭐ Réputation : <b>${game.reputation}</b>
  </div>

  <div class="choice">
  🏠 Boxes :
  <b>${game.horses.filter(h=>h.place==="box").length}/${game.boxes}</b>
  </div>

  <button class="primary" onclick="nextWeek()">
  📅 Passer une semaine · 350 €
  </button>
  `
 );

}


/* =====================================================
   SEMAINE
===================================================== */

function nextWeek(){

 if(game.money<350){

  openModal(
   "💸 Trésorerie insuffisante",
   "Tu n'as pas assez d'argent pour passer la semaine."
  );

  return;
 }

 game.money-=350;

 game.week++;

 if(game.week>52){

  game.week=1;
  game.year++;

 }

 game.horses.forEach(h=>{

  h.fatigue=Math.max(0,h.fatigue-12);

  if(h.place==="pasture"){
   h.health=Math.min(100,h.health+2);
  }

 });

 saveGame();

 domainPage();

}


/* =====================================================
   RESSOURCES
===================================================== */

function hayPage(){

 if(game.money<250){

  openModal(
   "🌾 Foin",
   "Tu n'as pas assez d'argent."
  );

  return;
 }

 if(game.hay>=game.maxHay){

  openModal(
   "🌾 Stock plein",
   "Ton stock de foin est déjà au maximum."
  );

  return;
 }

 game.money-=250;
 game.hay=Math.min(game.maxHay,game.hay+500);

 saveGame();

 openModal(
  "🌾 Foin acheté",
  `
  <div class="notice">
  +500 kg de foin.
  </div>

  Stock :
  <b>${game.hay} kg</b>
  `
 );

}


function grainPage(){

 if(game.money<180){

  openModal(
   "🌽 Grain",
   "Tu n'as pas assez d'argent."
  );

  return;
 }

 game.money-=180;
 game.grain=Math.min(game.maxGrain,game.grain+300);

 saveGame();

 openModal(
  "🌽 Grain acheté",
  `
  <div class="notice">
  +300 kg de grain.
  </div>

  Stock :
  <b>${game.grain} kg</b>
  `
 );

}


/* =====================================================
   CONCOURS
===================================================== */

function showsPage(){

 const best=
  [...game.horses]
  .sort((a,b)=>b.form-a.form)[0];

 openModal(
  "🏆 Concours",
  `
  <div class="notice">
  Meilleur cheval actuel :
  <b>${best.name}</b><br>
  Forme : ${best.form}%
  </div>

  <div class="choice">
  🥉 <b>Club</b>
  <span style="margin-left:auto">250 €</span>
  <button onclick="competition('Club',250,2)">Participer</button>
  </div>

  <div class="choice">
  🥈 <b>Amateur</b>
  <span style="margin-left:auto">600 €</span>
  <button onclick="competition('Amateur',600,5)">Participer</button>
  </div>

  <div class="choice">
  🥇 <b>France</b>
  <span style="margin-left:auto">1 500 €</span>
  <button onclick="competition('France',1500,10)">Participer</button>
  </div>
  `
 );

}


function competition(level,cost,rep){

 const h=
  [...game.horses]
  .sort((a,b)=>b.form-a.form)[0];

 if(game.money<cost){

  openModal(
   "💸 Concours impossible",
   "Tu n'as pas assez d'argent pour engager le cheval."
  );

  return;
 }

 game.money-=cost;

 h.fatigue=Math.min(100,h.fatigue+20);

 let chance=h.form;

 if(level==="Amateur")chance-=10;
 if(level==="France")chance-=20;

 const success=Math.random()*100<chance;

 if(success){

  const gain=cost*2;

  game.money+=gain;
  game.reputation+=rep;

  saveGame();

  openModal(
   "🏆 Victoire !",
   `
   <div class="notice">
   <b>${h.name}</b> réalise une belle performance en ${level}.
   </div>

   💰 Gain : <b>${money(gain)}</b><br>
   ⭐ Réputation : <b>+${rep}</b>
   `
  );

 }else{

  saveGame();

  openModal(
   "🏇 Concours terminé",
   `
   ${h.name} a participé au concours ${level}.<br><br>
   Cette fois, la performance n'a pas permis de gagner.
   `
  );

 }

}


/* =====================================================
   PROFESSIONNELS
===================================================== */

function professionalsPage(){

 openModal(
  "🩺 Professionnels",
  `
  <div class="choice">
  🩺 Vétérinaire
  <span style="margin-left:auto">1 000 €</span>
  <button onclick="professional('vet',1000)">Choisir</button>
  </div>

  <div class="choice">
  🦷 Dentiste
  <span style="margin-left:auto">350 €</span>
  <button onclick="professional('dent',350)">Choisir</button>
  </div>

  <div class="choice">
  🧲 Maréchal
  <span style="margin-left:auto">180 €</span>
  <button onclick="professional('farrier',180)">Choisir</button>
  </div>

  <div class="choice">
  👐 Ostéopathe
  <span style="margin-left:auto">250 €</span>
  <button onclick="professional('osteo',250)">Choisir</button>
  </div>
  `
 );

}


function professional(type,cost){

 if(game.money<cost){

  openModal(
   "💸 Argent insuffisant",
   "Tu n'as pas assez d'argent."
  );

  return;
 }

 game.money-=cost;

 const h=game.horses[0];

 if(type==="vet"){
  h.health=Math.min(100,h.health+10);
 }

 if(type==="dent"){
  h.health=Math.min(100,h.health+5);
 }

 if(type==="farrier"){
  h.health=Math.min(100,h.health+4);
 }

 if(type==="osteo"){
  h.fatigue=Math.max(0,h.fatigue-20);
 }

 saveGame();

 openModal(
  "🩺 Intervention terminée",
  `
  Le professionnel est intervenu sur <b>${h.name}</b>.<br><br>
  Santé : ${h.health}%<br>
  Fatigue : ${h.fatigue}%
  `
 );

}


/* =====================================================
   MARCHÉ
===================================================== */

function marketPage(){

 const horses=[
  ["Belle","Selle Français",12000,4],
  ["Royal","KWPN",18000,6],
  ["Dusty","Quarter Horse",9000,5],
  ["Silver","Frison",15000,7]
 ];

 openModal(
  "🐴 Marché",
  horses.map((h,i)=>`

   <div class="choice">

    <div>
     <b>${h[0]}</b><br>
     ${h[1]} · ${h[3]} ans<br>
     💰 ${money(h[2])}
    </div>

    <button onclick="buyHorse(${i})">
    Acheter
    </button>

   </div>

  `).join("")
 );

}


function buyHorse(index){

 const horses=[
  ["Belle","Selle Français",12000,4],
  ["Royal","KWPN",18000,6],
  ["Dusty","Quarter Horse",9000,5],
  ["Silver","Frison",15000,7]
 ];

 const h=horses[index];

 if(!h)return;

 if(game.money<h[2]){

  openModal(
   "💸 Achat impossible",
   "Tu n'as pas assez d'argent."
  );

  return;
 }

 const occupied=
  game.horses.filter(x=>x.place==="box").length;

 if(occupied>=game.boxes){

  openModal(
   "🏠 Plus de place",
   "Tous les boxes sont occupés."
  );

  return;
 }

 game.money-=h[2];

 game.horses.push({
  id:Date.now(),
  name:h[0],
  race:h[1],
  age:h[3],
  sex:"Hongre",
  form:75,
  health:92,
  fatigue:5,
  place:"box"
 });

 saveGame();

 openModal(
  "🐎 Nouveau cheval",
  `
  <div class="notice">
  <b>${h[0]}</b> rejoint ton écurie !
  </div>
  `
 );

}


/* =====================================================
   BOUTONS DE LA MAQUETTE
===================================================== */

document.getElementById("weekBtn")
.onclick=nextWeek;

document.getElementById("hayBtn")
.onclick=hayPage;

document.getElementById("grainBtn")
.onclick=grainPage;

document.getElementById("careBtn")
.onclick=carePage;

document.getElementById("showBtn")
.onclick=showsPage;

document.getElementById("horse1")
.onclick=()=>openModal(
 "🐎 Luna",
 horseCard(game.horses.find(h=>h.id===1))
);

document.getElementById("horse2")
.onclick=()=>openModal(
 "🐎 Caramel",
 horseCard(game.horses.find(h=>h.id===2))
);

document.getElementById("horse3")
.onclick=()=>openModal(
 "🐴 Jasper",
 horseCard(game.horses.find(h=>h.id===3))
);

document.getElementById("horse4")
.onclick=()=>openModal(
 "🐴 Étoile",
 horseCard(game.horses.find(h=>h.id===4))
);

document.getElementById("domain")
.onclick=domainPage;

document.getElementById("stable")
.onclick=()=>{

 const box=
  game.horses.filter(h=>h.place==="box");

 openModal(
  "🏚️ Écurie",
  `
  <div class="notice">
  Boxes occupés :
  <b>${box.length}/${game.boxes}</b>
  </div>

  ${box.map(horseCard).join("")}
  `
 );

};

document.getElementById("horses")
.onclick=horsesPage;

document.getElementById("shows")
.onclick=showsPage;

document.getElementById("care")
.onclick=carePage;


/* =====================================================
   DEMARRAGE
===================================================== */

saveGame();

</script>

</body>
</html>
