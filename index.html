<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}

.hero{height:145px;margin:-10px -10px 10px;position:relative;overflow:hidden;background:linear-gradient(#8bb5c7 0 48%,#6f995e 48% 74%,#8a6943 74%);border-bottom:5px solid #584029}
.hero:before{content:"";position:absolute;left:-10%;bottom:20px;width:120%;height:75px;background:radial-gradient(ellipse at 15% 80%,#355c38 0 35px,transparent 36px),radial-gradient(ellipse at 50% 85%,#426b3e 0 45px,transparent 46px),radial-gradient(ellipse at 85% 80%,#355c38 0 40px,transparent 41px)}
.stable{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:180px;height:70px;background:#875737;border:5px solid #54331f}
.door{position:absolute;left:64px;bottom:0;width:50px;height:46px;background:#35261f;border:3px solid #d0a66d}
.hero .horse{position:absolute;right:18px;bottom:18px;font-size:68px}
.hero h2{position:absolute;left:12px;top:8px;color:#fff;text-shadow:0 2px 4px #000;font:700 21px Georgia,serif}
.horsePic,.marketPic{height:95px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7b997,#607b54 55%,#b59a6b);font-size:62px;margin-bottom:8px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#000b;z-index:100}
.modal.show{display:flex}

.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modalHead h2{margin:0;font:700 21px Georgia,serif}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#173b25;padding:5px;z-index:60}
.bottom button{border:0;background:#315f3c;color:#fff;border-radius:9px;padding:8px 2px;font-size:10px;font-weight:800}
.rank{text-align:center;font-size:25px;font-weight:900;padding:10px}
.map{position:relative;height:330px;border-radius:18px;background:linear-gradient(#b8d6df,#dfe8d7);border:2px solid #8ca68b;overflow:hidden}
.pin{position:absolute;border:0;border-radius:50%;width:42px;height:42px;background:#315f3c;color:#fff;font-size:19px;box-shadow:0 3px 7px #0006}
.pin span{position:absolute;top:40px;left:50%;transform:translateX(-50%);background:#fff;color:#294b38;padding:3px 6px;border-radius:7px;font-size:9px;white-space:nowrap;font-weight:900}
.obstacle{padding:7px 9px;border-bottom:1px solid #e4e7df;font-size:12px}
.ok{background:#edf7ea}.fault{background:#fff0e8}.small{font-size:12px}.center{text-align:center}.quality{font-weight:900}

<script>
"use strict";

const STORAGE="monEcurieV14";
const BACKUP="monEcurieV14_backup";

const BREEDS=["Selle Français","KWPN","Anglo-Arabe","Connemara","Poney Français de Selle","Hanovrien","Oldenbourg","Quarter Horse","Lusitanien","Frison"];

const NAMES=["Luna","Caramel","Jasper","Étoile","Silver Moon","Golden Dream","Belle Romance","Royal Star","Évidence","Mystère","Opale","Nébuleuse","Rivière","Saphir","Toscane","Violette","Orage","Galaxie","Éclipse","Tempête","Vanille","Praline","Câline","Nikita","Sultan","Atlas","Jazz","Jade","Ambre","Rubis","Topaze","Perle","Safran","Mistral","Phoenix","Volcan","Aria","Bella","Cassandre","Diva","Émeraude","Fleur","Harmonie","Isis","Karma","Légende","Mélodie","Nova","Ondine","Pacha","Quartz","Rêve","Soleil","Tango","Ulysse","Vega","Whisky","Xena","Yoko","Zéphyr","Aube","Bambou","Cobalt","Dune","Flamme","Gatsby","Hélios","Icare","Joy","Kenza","Lilas","Maestro","Nacre","Olympe","Pistache","Roméo","Salsa","Trésor","Utopia","Victoire","Willow","Zara","Altesse","Bounty","César","Darling","Elixir","Fidji","Ginger","Horizon","Jupiter","Kiss","Lancelot","Moka","Nirvana","Oscar","Pépite","Roxane","Titan","Vénus","Wendy","Yasmine"];

const RACE={
"Selle Français":{CSO:15,CCE:8,Dressage:2},
"KWPN":{CSO:10,CCE:5,Dressage:15},
"Anglo-Arabe":{CSO:7,CCE:17,Dressage:4},
"Connemara":{CSO:12,CCE:11,Dressage:2},
"Poney Français de Selle":{CSO:13,CCE:11,Dressage:5},
"Hanovrien":{CSO:6,CCE:3,Dressage:18},
"Oldenbourg":{CSO:9,CCE:2,Dressage:15},
"Quarter Horse":{CSO:2,CCE:5,Dressage:1},
"Lusitanien":{CSO:2,CCE:5,Dressage:18},
"Frison":{CSO:1,CCE:3,Dressage:15}
};

const QUALITY=[
["Crack",10],
["Très bon cheval",20],
["Bon cheval",30],
["Cheval moyen",50]
];

const $=x=>document.getElementById(x);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>Math.round(Number(n)||0).toLocaleString("fr-FR")+" €";
const clone=x=>JSON.parse(JSON.stringify(x));

let nav=[];
let currentPage=null;

function rand(a,b){return a+Math.random()*(b-a)}

function weightedQuality(){
let total=QUALITY.reduce((s,q)=>s+q[1],0);
let r=Math.random()*total,s=0;
for(const q of QUALITY){s+=q[1];if(r<s)return q[0]}
return "Cheval moyen";
}

function qualityPercent(q){
let total=QUALITY.reduce((s,x)=>s+x[1],0);
let x=QUALITY.find(v=>v[0]===q);
return x?Math.round(x[1]/total*1000)/10:0;
}

function qualityMultiplier(q){
if(q==="Crack")return 1.45;
if(q==="Très bon cheval")return 1.22;
if(q==="Bon cheval")return 1.08;
return .90;
}

function dateDay(){return((game.day-1)%365)+1}

function dateText(){
let d=new Date(2026,8,1);
d.setDate(d.getDate()+dateDay()-1);
return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
}

function season(){
let d=dateDay();
return d<=91?"🍂 Automne":d<=182?"❄️ Hiver":d<=274?"🌸 Printemps":"☀️ Été";
}

function agePrecision(age){
if(age<=3)return 25;
if(age<=5)return 20;
if(age<=7)return 15;
if(age<=10)return 10;
if(age<=13)return 6;
return 3;
}

function basePotential(race){
let b=RACE[race]||{CSO:0,CCE:0,Dressage:0};
let base=55+Math.floor(Math.random()*26);
return{
CSO:clamp(base+b.CSO+Math.floor(rand(-5,6)),35,99),
CCE:clamp(base+b.CCE+Math.floor(rand(-5,6)),35,99),
Dressage:clamp(base+b.Dressage+Math.floor(rand(-5,6)),35,99)
};
}

function makeRanges(h){
h.potentialRanges={};
["CSO","CCE","Dressage"].forEach(d=>{
let p=h.truePotential?.[d]??65;
let w=agePrecision(h.age);
h.potentialRanges[d]=[clamp(Math.round(p-w),1,99),clamp(Math.round(p+w),1,99)];
});
}

function horse(id,name,race,age,sex,place,potential,quality){
potential=potential||basePotential(race);
quality=quality||weightedQuality();

let h={
id,name,race,age,sex,place:place||"pasture",
retired:false,
quality,
qualityChance:qualityPercent(quality),
truePotential:clone(potential),
potential:clone(potential),
potentialRanges:{},
current:{
CSO:Math.min(potential.CSO,30+Math.floor(Math.random()*40)),
CCE:Math.min(potential.CCE,30+Math.floor(Math.random()*40)),
Dressage:Math.min(potential.Dressage,30+Math.floor(Math.random()*40))
},
experience:{CSO:0,CCE:0,Dressage:0},
regularity:{CSO:50,CCE:50,Dressage:50},
health:94,
form:80,
fatigue:15,
mental:75,
ration:{hay:10,grain:3},
hoof:{type:"ferrure",lastDay:1},
vet:{lastDay:1,nextDay:91},
dentist:{lastDay:1,nextDay:181},
osteo:{lastDay:1,nextDay:121},
father:{name:"Père d'origine",results:["Origines enregistrées"]},
mother:{name:"Mère d'origine",results:["Origines enregistrées"]},
results:[],
qualPoints:{CSO:0,CCE:0,Dressage:0},
courses:{CSO:0,CCE:0,Dressage:0},
lastCompetitionDay:-999,
away:false
};

makeRanges(h);
return h;
}

const PENSION_TYPES={
box:{name:"Pension box",price:500,cost:250,care:3},
pony:{name:"Pension poney",price:400,cost:200,care:3},
pasture:{name:"Pension pré",price:300,cost:100,care:2},
training:{name:"Pension travail",price:1000,cost:420,care:5}
};

const OWNER_NAMES=["Claire Martin","Thomas Leroy","Julie Bernard","Antoine Moreau","Sophie Robert","Lucas Petit","Camille Girard","Maxime Roux","Élodie Fontaine","Nicolas Faure","Manon Giraud","Alexandre Perrin"];
const OWNER_HORSES=["Nox","Praline","Fidji","Saphir","Tornado","Romance","Vegas","Cookie","Calypso","Majesty","Tango","Éclipse","Vega","Pépite"];
const OWNER_TRAITS=["calme","sensible","énergique","délicat","facile","têtu","généreux","régulier"];
const OWNER_REQUESTS=["un changement de ration","une sortie au marcheur","un compte-rendu de santé","une séance de travail légère","une tonte avant le prochain concours","une sortie supplémentaire"];

function ownerHorse(){
let race=BREEDS[Math.floor(Math.random()*BREEDS.length)];
let h=horse("oh"+Date.now()+Math.random(),OWNER_HORSES[Math.floor(Math.random()*OWNER_HORSES.length)],race,4+Math.floor(Math.random()*13),["Jument","Hongre","Entier"][Math.floor(Math.random()*3)],"owner",basePotential(race));
h.ownerTrait=OWNER_TRAITS[Math.floor(Math.random()*OWNER_TRAITS.length)];
h.ownerMood=65+Math.floor(Math.random()*31);
return h;
}

function makeOwner(){
let typeKeys=Object.keys(PENSION_TYPES);
return{
id:"o"+Date.now()+Math.random(),
name:OWNER_NAMES[Math.floor(Math.random()*OWNER_NAMES.length)],
horse:ownerHorse(),
type:typeKeys[Math.floor(Math.random()*typeKeys.length)],
daysLeft:0,
loyalty:50+Math.floor(Math.random()*41),
pending:true,
active:false,
request:OWNER_REQUESTS[Math.floor(Math.random()*OWNER_REQUESTS.length)]
};
}

function newOwnerOffer(){
let o=makeOwner();
game.owners.push(o);
save();
open("📬 Nouvelle demande",`<div class="notice good"><b>${o.name}</b> cherche une écurie pour <b>${o.horse.name}</b>.</div><div class="card">🐎 <b>${o.horse.name}</b><br>${o.horse.race} · ${o.horse.age} ans · ${o.horse.sex}<br>🧠 Tempérament : ${o.horse.ownerTrait}<br>🏠 ${PENSION_TYPES[o.type].name}<br>💰 ${money(PENSION_TYPES[o.type].price)}/mois<br>💬 Demande : ${o.request}</div><button class="primary" onclick="ownerAccept('${o.id}')">🤝 Accepter la pension</button>`);
}

const initial={
money:18450,
reputation:0,
day:1,
year:1,
boxes:6,
pastures:1,
land:1,
truckCapacity:2,
hay:1200,
grain:800,
straw:600,
maxHay:2000,
maxGrain:1500,
maxStraw:1500,
horses:[
horse(1,"Luna","Selle Français",8,"Jument","box",{CSO:86,CCE:74,Dressage:62},"Très bon cheval"),
horse(2,"Caramel","Anglo-Arabe",12,"Hongre","box",{CSO:74,CCE:86,Dressage:61},"Bon cheval"),
horse(3,"Jasper","Quarter Horse",6,"Hongre","pasture",{CSO:61,CCE:63,Dressage:55},"Cheval moyen"),
horse(4,"Étoile","Connemara",4,"Jument","pasture",{CSO:78,CCE:75,Dressage:61},"Crack")
],
owners:[],
staff:{palefrenier:0,soigneur:0,coach:0},
staffMorale:75,
events:[],
stats:{competitions:0,victories:0,falls:0,pensionRevenue:0,expenses:0}
};

function repairHorse(h){
if(!h||typeof h!=="object")return horse("repair"+Math.random(),uniqueName(),"Selle Français",4,"Jument","pasture");
if(!h.truePotential)h.truePotential=clone(h.potential||{CSO:65,CCE:65,Dressage:65});
if(!h.potential)h.potential=clone(h.truePotential);
if(!h.quality)h.quality=weightedQuality();
h.qualityChance=qualityPercent(h.quality);
if(!h.current)h.current={CSO:45,CCE:45,Dressage:45};
if(!h.experience)h.experience={CSO:0,CCE:0,Dressage:0};
if(!h.regularity)h.regularity={CSO:50,CCE:50,Dressage:50};
if(!h.qualPoints)h.qualPoints={CSO:0,CCE:0,Dressage:0};
if(!h.courses)h.courses={CSO:0,CCE:0,Dressage:0};
if(!h.ration)h.ration={hay:10,grain:3};
if(!h.hoof)h.hoof={type:"ferrure",lastDay:1};
if(!h.vet)h.vet={lastDay:1,nextDay:game?.day?game.day+90:91};
if(!h.dentist)h.dentist={lastDay:1,nextDay:game?.day?game.day+180:181};
if(!h.osteo)h.osteo={lastDay:1,nextDay:game?.day?game.day+120:121};
if(!h.results)h.results=[];
if(h.lastCompetitionDay==null)h.lastCompetitionDay=-999;
if(h.away==null)h.away=false;
if(h.health==null)h.health=94;
if(h.form==null)h.form=80;
if(h.fatigue==null)h.fatigue=15;
if(h.mental==null)h.mental=75;
makeRanges(h);
return h;
}

function repairGame(){
if(!game||typeof game!=="object")game=clone(initial);
game.money=Number.isFinite(Number(game.money))?Number(game.money):18450;
game.reputation=clamp(Number(game.reputation)||0,0,100);
game.day=Math.max(1,Math.floor(Number(game.day)||1));
game.year=Math.max(1,Math.floor(Number(game.year)||1));
game.boxes=Math.max(1,Math.floor(Number(game.boxes)||6));
game.pastures=Math.max(1,Math.floor(Number(game.pastures)||1));
game.land=Math.max(1,Math.floor(Number(game.land)||1));
game.truckCapacity=Math.max(2,Math.min(12,Math.floor(Number(game.truckCapacity)||2)));
game.hay=Math.max(0,Number(game.hay)||0);
game.grain=Math.max(0,Number(game.grain)||0);
game.straw=Math.max(0,Number(game.straw)||0);
game.maxHay=Number(game.maxHay)||2000;
game.maxGrain=Number(game.maxGrain)||1500;
game.maxStraw=Number(game.maxStraw)||1500;
if(!Array.isArray(game.horses))game.horses=[];
if(!Array.isArray(game.owners))game.owners=[];
if(!game.staff)game.staff={palefrenier:0,soigneur:0,coach:0};
Object.keys(STAFF_TYPES||{}).forEach(k=>game.staff[k]=Math.max(0,Math.floor(Number(game.staff[k])||0)));
if(!Array.isArray(game.events))game.events=[];
if(!game.stats)game.stats={};
game.stats.competitions=Number(game.stats.competitions)||0;
game.stats.victories=Number(game.stats.victories)||0;
game.stats.pensionRevenue=Number(game.stats.pensionRevenue)||0;
game.stats.expenses=Number(game.stats.expenses)||0;
game.horses=game.horses.map(repairHorse);
game.owners=game.owners.filter(Boolean).map(o=>{
if(!o.horse)o.horse=ownerHorse();
if(!o.type||!PENSION_TYPES[o.type])o.type="box";
if(o.daysLeft==null)o.daysLeft=0;
if(o.loyalty==null)o.loyalty=50;
if(o.pending==null)o.pending=true;
if(o.active==null)o.active=false;
if(o.horse.ownerMood==null)o.horse.ownerMood=75;
return o;
});
return game;
}

function stat(name,value){
return`<div class="choice"><div class="statLine"><span>${name}</span><b>${Math.round(value)}/100</b></div><div class="progress"><span style="width:${clamp(value,0,100)}%"></span></div></div>`;
}

function qualityBox(h){
return`<div class="choice"><div class="quality">⭐ Qualité générale : <b>${h.quality}</b></div><div class="small">Chance statistique de cette catégorie : <b>${h.qualityChance}%</b></div><div class="small">Cette qualité est propre à ce cheval.</div></div>`;
}

function potentialBox(h){
return`<div class="choice"><b>🔮 Fourchette de potentiel</b><br>🏇 CSO : <b>${h.potentialRanges.CSO[0]}–${h.potentialRanges.CSO[1]}</b><br>🌳 CCE : <b>${h.potentialRanges.CCE[0]}–${h.potentialRanges.CCE[1]}</b><br>💃 Dressage : <b>${h.potentialRanges.Dressage[0]}–${h.potentialRanges.Dressage[1]}</b><hr><div class="small">À 3 ans environ ±25 points.<br>La fourchette se resserre progressivement avec l'âge.</div></div>`;
}

function value(h){
let p=(h.truePotential.CSO+h.truePotential.CCE+h.truePotential.Dressage)/3;
let c=(h.current.CSO+h.current.CCE+h.current.Dressage)/3;
let v=(2500+Math.pow(clamp(p*.55+c*.35+h.mental*.1,0,100)/100,2.5)*65000)*qualityMultiplier(h.quality);
if(h.race==="OC")v*=.82;
if(h.age>=18)v*=.55;
if(h.health<70)v*=.85;
return Math.round(v);
}

function train(id,d){
let h=game.horses.find(x=>String(x.id)===String(id));
if(!h)return;
if(h.fatigue>=75){open("😴","Cheval trop fatigué pour travailler.");return}
let gain=Math.max(1,Math.round(1+h.experience[d]/45));
h.current[d]=clamp(h.current[d]+gain,0,h.truePotential[d]);
h.experience[d]=clamp(h.experience[d]+2,0,100);
h.form=clamp(h.form+3,0,100);
h.fatigue=clamp(h.fatigue+14,0,100);
save();
horseBook(id);
}

function palefrenierCost(n,d){return 80*d+25*n*d}

function prepareTrip(){
let e=selectedEvent,ids=selectedHorses;
if(!ids.length){open("🐴","Sélectionne au moins un cheval.");return}
if(ids.length>game.truckCapacity){open("🚚","Le camion n'a pas assez de places.");return}
let horses=ids.map(id=>game.horses.find(h=>String(h.id)===String(id))).filter(Boolean);
if(horses.length!==ids.length||horses.some(h=>!canCompete(h,e))){open("❌","Un cheval sélectionné est indisponible.");return}
let stable=game.horses.filter(h=>!h.away&&!ids.includes(String(h.id)));
trip={event:e,day:0,remaining:e.days,stableHorses:stable.map(h=>h.id),travelHorses:horses.map(h=>h.id),palefrenier:false};
child(()=>open("🚚 Préparation du départ",`<div class="notice">🏆 ${e.city}<br>📅 ${e.days} jour${e.days>1?"s":""}<br>🐴 ${horses.length} cheval${horses.length>1?"ux":""}</div><div class="choice">🏠 Restent à l'écurie : <b>${stable.length}</b></div>${e.days>1&&stable.length?`<div class="notice alert">👨‍🌾 Palefrenier obligatoire pendant l'absence.<br>Coût : <b>${money(palefrenierCost(stable.length,e.days))}</b></div><button class="primary" onclick="hirePalefrenier()">👨‍🌾 Engager le palefrenier</button>`:`<div class="notice good">Aucun palefrenier nécessaire.</div>`}<button class="primary" onclick="startTrip()">🚚 Partir</button>`));
}

function hirePalefrenier(){
let cost=palefrenierCost(trip.stableHorses.length,trip.event.days);
if(game.money<cost){open("💸","Pas assez d'argent.");return}
game.money-=cost;
trip.palefrenier=true;
save();
prepareTrip();
}

function startTrip(){
if(trip.event.days>1&&trip.stableHorses.length&&!trip.palefrenier){open("👨‍🌾","Tu dois engager un palefrenier.");return}
trip.travelHorses.forEach(id=>{let h=game.horses.find(x=>String(x.id)===String(id));if(h)h.away=true});
runCompetitionDay();
}

function competitionScore(h,d,level){
let diff=level==="Club"?0:level==="Amateur"?8:16;
return h.current[d]*.52+h.truePotential[d]*.15+h.experience[d]*.10+h.mental*.08+h.regularity[d]*.10+h.form*.05-h.fatigue*.10+Math.random()*14-7-diff;
}

function csoDetails(){
let details=[],penalties=0,bars=0,refus=0;
for(let i=1;i<=12;i++){
let roll=Math.random(),fault=roll<.08?"refus":roll<.25?"barre":"sans faute",p=fault==="sans faute"?0:4;
if(fault==="barre")bars++;
if(fault==="refus")refus++;
penalties+=p;
details.push({fault:fault!=="sans faute",text:`Obstacle ${i} : ${fault}${p?` · +${p} pts`:""}`});
}
let time=Math.round(62+Math.random()*18);
if(Math.random()<.20){penalties++;details.push({fault:true,text:`Chronomètre : ${time}s · temps dépassé · +1 pt`})}
else details.push({fault:false,text:`Chronomètre : ${time}s · temps correct`});
details.push({fault:penalties>8,text:`Bilan CSO : ${bars} barre(s) · ${refus} refus · ${penalties} pénalité(s)`});
return{penalties,details};
}

function dressageDetails(h){
let pct=clamp(50+h.current.Dressage*.38+h.mental*.08+Math.random()*8,45,85);
let penalties=Math.round((100-pct)*10)/10;
return{penalties,details:[{fault:false,text:`Reprise : ${pct.toFixed(2)} %`},{fault:false,text:`Technique : ${clamp(pct+rand(-4,4),40,90).toFixed(2)} %`},{fault:false,text:`Artistique : ${clamp(pct+rand(-4,4),40,90).toFixed(2)} %`},{fault:penalties>40,text:`Pénalité finale : ${penalties}`} ]};
}

function cceDetails(h){
let dress=clamp(50+h.current.CCE*.35+Math.random()*10,45,82),cross=0,cso=0;
let details=[{fault:false,text:`Dressage CCE : ${dress.toFixed(2)} %`}];
for(let i=1;i<=8;i++){let fault=Math.random()<.12,p=fault?20:0;cross+=p;details.push({fault,text:`Obstacle cross ${i} : ${fault?"faute · +20 pts":"sans faute"}`})}
if(Math.random()<.30)cso=4;
details.push({fault:cso>0,text:`CSO du CCE : ${cso?"barre · +4 pts":"sans faute"}`});
return{penalties:Math.round((100-dress)*1.5+cross+cso),details};
}

function qualificationPoints(rank,total,penalties){
let a=Math.ceil(total*.25),b=Math.ceil(total*.50),c=Math.ceil(total*.75);
if(rank<=a)return penalties===0?10:5;
if(rank<=b)return 3;
if(rank<=c)return 1;
return 0;
}

function runCompetitionDay(){
let e=trip.event;
trip.day++;
trip.remaining--;
let results=[];
game.horses.filter(h=>trip.travelHorses.includes(String(h.id))).forEach(h=>{
let score=competitionScore(h,e.discipline,e.level),competitors=[];
for(let i=0;i<Math.max(20,e.places-1);i++)competitors.push(Math.random()*100);
let rank=clamp(1+competitors.filter(x=>x>score).length,1,e.places);
let detail=e.discipline==="CSO"?csoDetails():e.discipline==="CCE"?cceDetails(h):dressageDetails(h);
let points=qualificationPoints(rank,e.places,detail.penalties);
h.qualPoints[e.discipline]+=points;
h.courses[e.discipline]++;
h.lastCompetitionDay=game.day;
h.experience[e.discipline]=clamp(h.experience[e.discipline]+3,0,100);
h.fatigue=clamp(h.fatigue+(e.days===1?25:18),0,100);
let result={date:dateText(),city:e.city,region:e.region,level:e.level,discipline:e.discipline,day:trip.day,days:e.days,rank,total:e.places,penalties:detail.penalties,points,details:detail.details};
h.results.push(result);
results.push({name:h.name,rank,total:e.places,pen:detail.penalties,points,details:detail.details});
game.stats.competitions++;
if(rank===1)game.stats.victories++;
});
save();
showDayResults(results);
}

function showDayResults(results){

let html=`<div class="notice">📍 ${e.city}<br>🏆 ${e.discipline} · ${e.level}<br>📅 Épreuve ${trip.day}/${e.days}</div>`;
results.forEach(r=>{html+=`<div class="card"><div class="rank">${r.rank===1?"🥇":r.rank===2?"🥈":r.rank===3?"🥉":"🏅"}<br>${r.rank}e / ${r.total}</div><b>${r.name}</b><br>🎯 ${r.pen} pénalité(s)<br>🇫🇷 <b>+${r.points} point(s) qualification</b><details open><summary>📋 Détail de l'épreuve</summary>${r.details.map(x=>`<div class="obstacle ${x.fault?"fault":"ok"}">${x.text}</div>`).join("")}</details></div>`});
html+=trip.remaining>0?`<button class="primary" onclick="nextCompetitionDay()">📅 Passer à l'épreuve suivante</button>`:`<button class="primary" onclick="finishTrip()">🏠 Terminer le concours et rentrer</button>`;
open("🏆 Résultats détaillés",html,false);
}

function runChampionships(){
let eligible=game.horses.filter(h=>h.qualPoints.CSO>=20||h.qualPoints.CCE>=20||h.qualPoints.Dressage>=20);
if(!eligible.length){open("🇫🇷","Aucun cheval qualifié.");return}
let h=eligible[Math.floor(Math.random()*eligible.length)];
let d=h.qualPoints.CSO>=Math.max(h.qualPoints.CCE,h.qualPoints.Dressage)?"CSO":h.qualPoints.CCE>=h.qualPoints.Dressage?"CCE":"Dressage";
let total=50+Math.floor(Math.random()*51);

function createFoal(mid,fid){
let m=game.horses.find(h=>String(h.id)===String(mid)),f=game.horses.find(h=>String(h.id)===String(fid));
if(!m||!f)return;
if(game.money<1000){open("💸","Il faut 1 000 €.");return}
game.money-=1000;
let p={
CSO:clamp(Math.round((m.truePotential.CSO+f.truePotential.CSO)/2+rand(-6,7)),35,99),
CCE:clamp(Math.round((m.truePotential.CCE+f.truePotential.CCE)/2+rand(-6,7)),35,99),
Dressage:clamp(Math.round((m.truePotential.Dressage+f.truePotential.Dressage)/2+rand(-6,7)),35,99)
};
let foal=horse("foal"+Date.now(),"",m.race===f.race?m.race:"OC",0,Math.random()<.5?"Jument":"Entier","pasture",p);
foal.current={CSO:20,CCE:20,Dressage:20};
foal.father={name:f.name,results:[f.race]};
foal.mother={name:m.name,results:[m.race]};
game.horses.push(foal);
save();
open("🐴 Naissance",`<div class="notice good">🎉 Un poulain est né !<br>Race : <b>${foal.race}</b><br>Sexe : <b>${foal.sex}</b><br>⭐ Qualité : <b>${foal.quality}</b></div><input id="foalName" class="input" placeholder="Prénom du poulain" maxlength="24"><button class="primary" onclick="nameFoal('${foal.id}')">🐴 Donner ce prénom</button>`,false);

function marketSource(src){
child(()=>open("🏪 "+src,BREEDS.map(r=>`<div class="card"><b>${r}</b><br><small>${src==="Éleveur"?"Jeunes chevaux et origines sélectionnées.":src==="Marchand"?"Chevaux de profils très variés.":"Lots avec prix de départ et opportunités."}</small><button class="primary" onclick="marketRace('${r}','${src}')">Voir les chevaux</button></div>`).join("")));

function marketRace(r,src){
let hs=[];
for(let i=0;i<6;i++){
let p=basePotential(r);
let age=src==="Éleveur"?3+Math.floor(Math.random()*5):3+Math.floor(Math.random()*12);
let h=horse("m"+Math.random(),uniqueName(),r,age,["Jument","Hongre","Entier"][Math.floor(Math.random()*3)],"market",p);
h.source=src;
h.marketPrice=Math.max(1000,Math.round(value(h)*(src==="Éleveur"?1.08:src==="Marchand"?0.95:0.82+Math.random()*.35)));
h.auctionStart=src==="Enchères"?Math.round(h.marketPrice*.65):0;
hs.push(h);
}
child(()=>open("🐎 "+r+" · "+src,hs.map(h=>`<div class="marketCard"><div class="marketPic">🐎</div><span class="badge">${h.quality}</span><span class="badge">${h.age} ans</span><span class="badge">${h.sex}</span><h3>${h.name}</h3>${qualityBox(h)}${potentialBox(h)}<br>🏇 ${h.current.CSO} · 🌳 ${h.current.CCE} · 💃 ${h.current.Dressage}<br><br>${src==="Enchères"?"🔨 Départ : "+money(h.auctionStart):"💰 Prix : "+money(h.marketPrice)}<button class="primary" onclick="buyMarket('${encodeURIComponent(JSON.stringify(h))}')">${src==="Enchères"?"🔨 Acheter":"💰 Acheter"}</button></div>`).join("")));
}

function buyMarket(encoded){
let h;
try{h=JSON.parse(decodeURIComponent(encoded))}catch(e){open("❌","Cheval invalide.");return}
let p=h.auctionStart||h.marketPrice||value(h);
if(game.money<p){open("💸","Pas assez d'argent.");return}
if(game.horses.filter(x=>x.place==="box"&&!x.away).length>=game.boxes){open("🏠","Plus de box disponible.");return}
game.money-=p;
h.id="h"+Date.now()+Math.random();
h.place="box";
delete h.marketPrice;
delete h.auctionStart;
game.horses.push(h);
save();
horseBook(h.id);
}

function nextDay(){
try{
repairGame();
game.money-=350;
game.day++;

if(dateDay()===1){
game.year++;
game.horses.forEach(h=>{
h.age++;
makeRanges(h);
});
}

game.horses.forEach(h=>{
if(h.away)return;

h.fatigue=clamp(h.fatigue-(h.place==="pasture"?10:7),0,100);
h.form=clamp(h.form+1,0,100);

if(h.place==="pasture")
h.health=clamp(h.health+1,0,100);

game.hay=Math.max(0,game.hay-(Number(h.ration?.hay)||0));
game.grain=Math.max(0,game.grain-(Number(h.ration?.grain)||0));
game.straw=Math.max(0,game.straw-.5);

if(game.hay===0||game.grain===0){
h.health=clamp(h.health-1,0,100);
h.form=clamp(h.form-2,0,100);
}
});

game.owners.forEach(o=>{
if(!o||!o.active)return;

o.daysLeft--;

if(o.daysLeft<=0){
let t=PENSION_TYPES[o.type]||PENSION_TYPES.box;

if(o.loyalty>=65||Math.random()<.45){
o.daysLeft=30;
game.money+=t.price-t.cost;
game.stats.pensionRevenue+=t.price;
o.loyalty=clamp(o.loyalty+2,0,100);
game.reputation=clamp(game.reputation+1,0,100);
}else{
o.active=false;
o.horse.isBoarder=false;
o.request="le propriétaire récupère son cheval";
game.reputation=clamp(game.reputation-1,0,100);
}
}

if(!o.request&&Math.random()<.08)
o.request=OWNER_REQUESTS[Math.floor(Math.random()*OWNER_REQUESTS.length)];

if(o.request&&Math.random()<.05)
o.horse.ownerMood=clamp((o.horse.ownerMood||70)-3,0,100);
});

let payroll=Object.entries(STAFF_TYPES).reduce((s,[k,t])=>s+(game.staff[k]||0)*t.salary,0);
game.money-=payroll;

if(Math.random()<.18){
let es=[
"Un propriétaire félicite ton équipe pour la qualité des soins.",
"Un cavalier local vient visiter ton écurie.",
"Une propriétaire te recommande à une amie.",
"Un cheval de pension montre une excellente forme.",
"Une petite réparation dans la sellerie coûte 120 €.",
"Un propriétaire demande à visiter les installations.",
"Un cavalier cherche une pension pour la saison.",
"Une journée particulièrement calme permet à l'équipe de souffler."
];

let ev=es[Math.floor(Math.random()*es.length)];

if(ev.includes("coûte"))
game.money-=120;
else if(ev.includes("recommande"))
game.reputation=clamp(game.reputation+2,0,100);
else
game.reputation=clamp(game.reputation+1,0,100);

game.events.unshift({day:game.day,text:ev});
game.events=game.events.slice(0,30);
}

if(game.reputation>=50&&Math.random()<.06){
let o=makeOwner();
o.type=Math.random()<.5?"training":"box";
o.request="pension premium demandée";
game.owners.push(o);
game.events.unshift({day:game.day,text:"🌟 Une demande premium arrive grâce à ta réputation."});
}

save();

}catch(e){
console.error("Erreur Passer 1 jour V14.1",e);
open("⚠️ Journée non enregistrée","Une erreur a été détectée. Ta sauvegarde précédente est conservée.");
}
}

function render(){
repairGame();

$("dateLabel").textContent=dateText();
$("dayLabel").textContent="J"+dateDay()+"/365 · Année "+game.year;
$("season").textContent=season();
$("money").textContent=money(game.money);
$("rep").textContent="⭐ "+game.reputation;
$("horseCount").textContent=game.horses.length;
$("boxCount").textContent=game.horses.filter(h=>h.place==="box"&&!h.away).length+"/"+game.boxes+" boxes";

let alerts=[];

game.horses.forEach(h=>{
if(game.day-h.hoof.lastDay>=60)
alerts.push("🚨 <b>"+h.name+"</b> : maréchal à prévoir.");

if(game.day>=h.vet.nextDay)
alerts.push("🩺 <b>"+h.name+"</b> : vétérinaire à prévoir.");
});

game.owners.forEach(o=>{
if(o.pending)
alerts.push("📬 <b>"+o.name+"</b> propose une pension.");

if(o.active&&o.daysLeft<=3)
alerts.push("⏳ <b>"+o.name+"</b> : renouvellement bientôt.");

if(o.active&&o.request)
alerts.push("💬 <b>"+o.name+"</b> : "+o.request+".");
});

$("alerts").innerHTML=alerts.slice(0,6).map(x=>`<div class="notice alert">${x}</div>`).join("");

let active=game.owners.filter(o=>o.active).length;
let pending=game.owners.filter(o=>o.pending).length;
let staff=Object.values(game.staff).reduce((a,b)=>a+(Number(b)||0),0);

$("dashboard").innerHTML=`
<div class="three">
<div class="choice center">
<b>🏠 Pensions</b><br>
<span style="font-size:22px">${active}</span><br>
<small>clients actifs</small>
</div>

<div class="choice center">
<b>📬 Demandes</b><br>
<span style="font-size:22px">${pending}</span><br>
<small>en attente</small>
</div>

<div class="choice center">
<b>👨‍🌾 Équipe</b><br>
<span style="font-size:22px">${staff}</span><br>
<small>employés</small>
</div>
</div>`;
}

try{
repairGame();
render();
}catch(e){
console.error(e);
document.body.insertAdjacentHTML("afterbegin",'<div style="position:fixed;z-index:9999;top:0;left:0;right:0;padding:14px;background:#7b1f1f;color:#fff;text-align:center;font-family:Arial">⚠️ Mon Écurie : erreur de démarrage. La sauvegarde précédente est conservée.</div>');
}
</script>
</body>
</html>
