/* =====================================================

===================================================== */

function normalizeGame(data){

if(!data.horses)
data.horses=[];

if(!data.staff)
data.staff=[];

data.horses.forEach(
normalizeHorse
);

return data;

}

function normalizeHorse(h){

if(h.potential===undefined)
h.potential=60;

if(h.realPotential===undefined)
h.realPotential=h.potential;

if(h.currentLevel===undefined)
h.currentLevel=h.form||50;

if(h.experience===undefined)
h.experience=20;

h.technique=60;

if(h.strength===undefined)
h.strength=60;

if(h.competitionUse===undefined)
h.competitionUse=60;

if(h.breedingUse===undefined)
h.breedingUse=60;

if(h.familyBonus===undefined)
h.familyBonus=0;

calculateHorseValue(h);

return h;

}

/* =====================================================
SYSTÈME DE VALEUR
45 SPORT
20 MENTAL
15 UTILITÉ
20 ÂGE/SANTÉ
===================================================== */

function calculateHorseValue(h){


/* SPORT 45 % */

const sport=

h.potential*0.40+

h.currentLevel*0.20+

h.experience*0.10+

h.technique*0.10+

h.strength*0.05+

h.endurance*0.05+

h.regularity*0.10;


/* MENTAL 20 % */

const mental=

h.mental*0.30+

h.gentleness*0.25+

h.calm*0.20+

h.courage*0.15+

h.concentration*0.10;


/* UTILITÉ 15 % */

const utility=

h.courseUse*0.40+

h.competitionUse*0.40+

h.breedingUse*0.20;


/* ÂGE + SANTÉ 20 % */

let ageScore=100;


if(h.age<=8)
ageScore=100;

else if(h.age<=12)
ageScore=92;

else if(h.age<=15)
ageScore=78;

else if(h.age<=18)
ageScore=60;

else
ageScore=38;


const ageHealth=

ageScore*0.55+

h.health*0.45;


/* SCORE FINAL */

const score=

sport*0.45+

mental*0.20+

utility*0.15+

ageHealth*0.20;


/* BASE */

let value=

2500+

Math.pow(
score/100,
2.7
)*65000;


/* BONUS CHEVAL DE CLUB */

if(
h.courseUse>=90 &&
h.gentleness>=90 &&
h.calm>=90
){

value+=5000;

}


/* BONUS ÉLEVAGE */

if(
h.breedingUse>=90
){

value+=7000;

}


/* VIEIL ÂGE */

if(h.age>=18){

value*=0.60;

}


/* SANTÉ */

if(h.health<70){

value*=0.85;

}

if(h.health<50){

value*=0.70;

}


/* LÉGÈRE VARIATION DU MARCHÉ */

value*=0.95+
Math.random()*0.10;


h.value=Math.round(value);


return h.value;

}


/* =====================================================
POTENTIEL ESTIMÉ
===================================================== */

function getPotentialRange(h){

let uncertainty;


if(h.age<=3){

uncertainty=18;

}

else if(h.age<=5){

uncertainty=14;

}

else if(h.age<=8){

uncertainty=8;

}

else{

uncertainty=4;

}


return{

min:clamp(
h.realPotential-uncertainty,
40,
99
),

max:clamp(
h.realPotential+uncertainty,
40,
99
)

};

}

function careHorse(id){

const h=
game.horses.find(
x=>x.id===id
);

if(!h)return;


h.form=
clamp(
h.form+4,
0,
100
);


h.health=
clamp(
h.health+3,
0,
100
);


h.fatigue=
clamp(
h.fatigue-7,
0,
100
);


game.reputation++;


calculateHorseValue(h);

saveGame();


openModal(

"❤️ Soin terminé",

`

a été correctement soigné.

/* =====================================================
CONCOURS
===================================================== */

function competition(
level,
cost,
rep
){

const h=
[...game.horses]
.sort(
(a,b)=>
b.currentLevel-
a.currentLevel
)[0];


if(game.money<cost){

openModal(
"💸 Concours impossible",
"Tu n'as pas assez d'argent."
);

return;

}


game.money-=cost;


h.fatigue=
clamp(
h.fatigue+20,
0,
100
);


h.experience=
clamp(
h.experience+3,
0,
100
);


let difficulty=0;


if(level==="Club")
difficulty=0;

if(level==="Amateur")
difficulty=10;

if(level==="National")
difficulty=20;


let chance=

h.currentLevel*0.55+

h.experience*0.15+

h.regularity*0.15+

h.mental*0.15-

difficulty;


chance=
clamp(
chance,
5,
95
);


const success=
Math.random()*100<chance;


if(success){

const gain=
cost*2;


game.money+=gain;

game.reputation+=rep;


calculateHorseValue(h);

saveGame();


openModal(

"🏆 Belle performance !",

`

<div class="notice">

<b>${h.name}</b>
réussit son concours ${level} !

</div>

💰 Gain :

<b>${money(gain)}</b>

<br>

⭐ Réputation :

<b>+${rep}</b>

`

);

}else{


calculateHorseValue(h);

saveGame();


openModal(

"🏇 Concours terminé",

`

${h.name}
a participé au concours ${level}.

<br><br>

Cette fois, la performance
n'a pas permis de gagner.

`

);

}

}
