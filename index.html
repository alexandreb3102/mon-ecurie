/* =====================================================

===================================================== */

let game=loadGame();


function loadGame(){

 try{

  const saved=
   localStorage.getItem("monEcurieV6");

  if(saved){

   const data=JSON.parse(saved);

   return normalizeGame(data);

  }

 }catch(e){

  console.log(e);

 }

 return normalizeGame(
  JSON.parse(
   JSON.stringify(initialGame)
  )
 );

}


function saveGame(){

 localStorage.setItem(
  "monEcurieV6",
  JSON.stringify(game)
 );

}


/* =====================================================
 NORMALISATION
===================================================== */

function normalizeGame(data){

 if(!data.horses)
  data.horses=[];

 data.horses.forEach(normalizeHorse);

 if(!data.marketCycle)
  data.marketCycle=1;

 return data;

}


function normalizeHorse(h){

 const defaults={

  potential:60,
  realPotential:65,
  currentLevel:45,
  experience:10,

  technique:60,
  strength:60,
  endurance:60,
  regularity:60,

  mental:60,
  gentleness:60,
  calm:60,
  courage:60,
  concentration:60,
  willpower:60,
  reactivity:60,

  courseUse:60,
  competitionUse:60,
  breedingUse:60,

  winsClub:0,
  winsAmateur:0,
  winsNational:0,

  secondClub:0,
  secondAmateur:0,
  secondNational:0,

  thirdClub:0,
  thirdAmateur:0,
  thirdNational:0,

  totalCourses:0,

  championships:[]

 };

 Object.keys(defaults).forEach(key=>{

  if(h[key]===undefined)
   h[key]=defaults[key];

 });

 if(!h.father){

  h.father={
   name:"Origine inconnue",
   results:[]
  };

 }

 if(!h.mother){

  h.mother={
   name:"Origine inconnue",
   results:[]
  };

 }

 /* RÈGLE IMPORTANTE :
    LE NIVEAU NE PEUT JAMAIS DÉPASSER LE POTENTIEL */

 h.currentLevel=
  Math.min(
   h.currentLevel,
   h.realPotential,
   h.potential
  );

 calculateHorseValue(h);

 return h;

}

function clamp(n,min,max){

 return Math.max(

 );

}

}

/* =====================================================

===================================================== */

function getPodiums(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational+

  h.secondClub+
  h.secondAmateur+
  h.secondNational+

  h.thirdClub+
  h.thirdAmateur+
  h.thirdNational

 );

}


function getWins(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational

 );

}


function getRegularity(h){

 if(h.totalCourses<=0)
  return 20;

 const podiumRate=
  getPodiums(h)/
  h.totalCourses;

 const winRate=
  getWins(h)/
  h.totalCourses;

 const experienceBonus=
  Math.min(
   15,
   h.experience/8
  );

 return clamp(
  Math.round(
   podiumRate*70+
   winRate*20+
   experienceBonus
  ),
  5,
  99
 );

}


/* =====================================================
 VALEUR DU CHEVAL
===================================================== */

function calculateHorseValue(h){

 const regularity=
  getRegularity(h);

 /*
 SPORT = 45 %
 */

 const sport=

  h.potential*0.30+
  h.currentLevel*0.18+
  h.experience*0.08+
  regularity*0.18+
  h.technique*0.08+
  h.strength*0.06+
  h.endurance*0.05+
  h.regularity*0.07;


 /*
 MENTAL = 20 %
 */

 const mental=

  h.mental*0.20+
  h.gentleness*0.20+
  h.calm*0.16+
  h.courage*0.14+
  h.concentration*0.14+
  h.willpower*0.10+
  (100-h.reactivity)*0.06;


 /*
 UTILITÉ = 15 %
 */

 const utility=

  h.courseUse*0.40+
  h.competitionUse*0.40+
  h.breedingUse*0.20;


 /*
 ÂGE + SANTÉ = 20 %
 */

 let ageScore=100;

 if(h.age<=8)
  ageScore=100;
 else if(h.age<=12)
  ageScore=92;
 else if(h.age<=15)
  ageScore=78;
 else if(h.age<=18)
  ageScore=60;
 else
  ageScore=38;

 const ageHealth=
  ageScore*0.55+
  h.health*0.45;


 const score=

  sport*0.45+
  mental*0.20+
  utility*0.15+
  ageHealth*0.20;


 let value=
  2500+
  Math.pow(score/100,2.7)*65000;


 /*
 BON CHEVAL DE CLUB
 */

 if(
  h.courseUse>=90 &&
  h.gentleness>=90 &&
  h.calm>=90
 ){

  value+=5000;

 }


 /*
 TRÈS BON REPRODUCTEUR
 */

 if(h.breedingUse>=90)
  value+=5000;


 /*
 VIEUX CHEVAL
 */

 if(h.age>=18)
  value*=0.60;


 /*
 SANTÉ
 */

 if(h.health<70)
  value*=0.85;

 if(h.health<50)
  value*=0.70;


 h.value=Math.round(value);

 return h.value;

}


/* =====================================================
 POTENTIEL VISIBLE
===================================================== */

function potentialRange(h){

 let uncertainty=4;

 if(h.age<=3)
  uncertainty=18;
 else if(h.age<=5)
  uncertainty=14;
 else if(h.age<=8)
  uncertainty=8;

 return{

  min:clamp(
   h.realPotential-uncertainty,
   40,
   99
  ),

  max:clamp(
   h.realPotential+uncertainty,
   40,
   99
  )

 };

}

function generateMarket(){

 const races=[
  "Selle Français",
  "KWPN",
  "Anglo-Arabe",
  "Connemara",
  "Poney Français de Selle",
  "Hanovrien",
  "Oldenbourg"
 ];

 const names=[
  "Jolie Étoile",
  "Silver Moon",
  "Golden Dream",
  "Belle Romance",
  "Royal Star",
  "Évidence",
  "Mystère"
 ];

 const market=[];

 for(let i=0;i<7;i++){

  const potential=
   55+
   Math.floor(
    Math.random()*42
   );

  const age=
   3+
   Math.floor(
    Math.random()*13
   );

  let profile;

  const type=i%4;

  if(type===0){

   profile={
    mental:90,
    gentleness:94,
    calm:92,
    courseUse:96
   };

  }
  else if(type===1){

   profile={
    mental:72,
    gentleness:58,
    calm:55,
    courseUse:62
   };

  }
  else if(type===2){

   profile={
    mental:84,
    gentleness:78,
    calm:76,
    courseUse:76
   };

  }
  else{

   profile={
    mental:61,
    gentleness:48,
    calm:44,
    courseUse:52
   };

  }

  const realPotential=
   clamp(
    potential+
    Math.floor(
     Math.random()*15-7
    ),
    40,
    99
   );

  const current=
   Math.min(
    Math.floor(
     35+
     Math.random()*30
    ),
    realPotential
   );

  const h={

   id:
    "market_"+game.marketCycle+"_"+i,

   name:names[i],

   race:races[i],

   age:age,

   sex:
    i%2===0
    ?"Jument"
    :"Hongre",

   form:
    70+
    Math.floor(
     Math.random()*20
    ),

   health:
    82+
    Math.floor(
     Math.random()*18
    ),

   fatigue:
    5+
    Math.floor(
     Math.random()*25
    ),

   place:"market",

   potential:potential,

   realPotential:realPotential,

   currentLevel:current,

   experience:
    age>8
    ?40+Math.floor(Math.random()*40)
    :5+Math.floor(Math.random()*25),

   technique:
    clamp(
     current+
     Math.floor(Math.random()*20-10),
     40,
     realPotential
    ),

   strength:
    50+
    Math.floor(Math.random()*45),

   endurance:
    50+
    Math.floor(Math.random()*45),

   regularity:
    45+
    Math.floor(Math.random()*50),

   mental:profile.mental,

   gentleness:profile.gentleness,

   calm:profile.calm,

   courage:
    50+
    Math.floor(Math.random()*45),

   concentration:
    50+
    Math.floor(Math.random()*45),

   willpower:
    50+
    Math.floor(Math.random()*45),

   reactivity:
    35+
    Math.floor(Math.random()*55),

   courseUse:
    profile.courseUse,

   competitionUse:
    potential,

   breedingUse:
    potential,

   winsClub:
    Math.floor(Math.random()*8),

   winsAmateur:
    potential>75
    ?Math.floor(Math.random()*6)
    :Math.floor(Math.random()*3),

   winsNational:
    potential>85
    ?Math.floor(Math.random()*4)
    :0,

   secondClub:
    Math.floor(Math.random()*7),

   secondAmateur:
    Math.floor(Math.random()*5),

   secondNational:
    potential>82
    ?Math.floor(Math.random()*3)
    :0,

   thirdClub:
    Math.floor(Math.random()*6),

   thirdAmateur:
    Math.floor(Math.random()*5),

   thirdNational:
    potential>82
    ?Math.floor(Math.random()*3)
    :0,

   totalCourses:
    10+
    Math.floor(Math.random()*50),

   championships:[],

   father:{
    name:"Père de "+names[i],
    results:[
     "Résultats disponibles dans le dossier d'origine"
    ]
   },

   mother:{
    name:"Mère de "+names[i],
    results:[
     "Résultats disponibles dans le dossier d'origine"
    ]
   }

  };

  normalizeHorse(h);

  market.push(h);

 }

 return market;

}

/* =====================================================

===================================================== */

function trainHorse(id){

 const h=
  game.horses.find(
   x=>x.id===id
  );

 if(!h)return;


 if(h.fatigue>=75){

  openModal(

   "😴 Cheval fatigué",

   `

   <div class="notice">

   ${h.name}
   est trop fatigué.

   </div>

   `

  );

  return;

 }


 /*
 Le niveau monte progressivement
 mais ne dépasse JAMAIS le potentiel.
 */

 const progression=
  Math.max(
   1,
   Math.round(
    1+
    h.experience/35
   )
  );


 h.currentLevel=
  clamp(
   h.currentLevel+progression,
   0,
   h.realPotential
  );


 h.experience=
  clamp(
   h.experience+2,
   0,
   100
  );


 h.form=
  clamp(
   h.form+5,
   0,
   100
  );


 h.fatigue=
  clamp(
   h.fatigue+14,
   0,
   100
  );


 h.technique=
  clamp(
   h.technique+1,
   0,
   h.realPotential
  );


 h.regularity=
  clamp(
   h.regularity+1,
   0,
   100
  );


 calculateHorseValue(h);

 saveGame();


 openModal(

  "🏇 Entraînement terminé",

  `

  progresse.

  </b>

  `

 );

}

/* =====================================================

function competition(
 level,
 cost,
 reputation
){

 const h=
  [...game.horses]
  .sort(
   (a,b)=>
    b.currentLevel-
    a.currentLevel
  )[0];


 if(game.money<cost){

  openModal(
   "💸 Concours impossible",
   "Tu n'as pas assez d'argent."
  );

  return;

 }


 game.money-=cost;


 let difficulty=0;

 if(level==="Amateur")
  difficulty=12;

 if(level==="National")
  difficulty=25;


 let chance=

  h.currentLevel*0.42+

  h.experience*0.12+

  getRegularity(h)*0.24+

  h.mental*0.12+

  h.concentration*0.10-

  difficulty;


 chance=
  clamp(
   chance,
   3,
   95
  );


 const success=
  Math.random()*100<
  chance;


 h.totalCourses++;


 if(success){

  if(level==="Club")
   h.winsClub++;

  if(level==="Amateur")
   h.winsAmateur++;

  if(level==="National")
   h.winsNational++;


  game.money+=cost*2;

  game.reputation+=reputation;


  openModal(

   "🏆 Victoire !",

   `

   <div class="notice">

   <b>${h.name}</b>
   gagne son concours
   <b>${level}</b> !

   </div>

   ${getWins(h)}
   victoires sur
   ${h.totalCourses}
   parcours.

   `

  );

 }

 else{

  if(Math.random()<0.5){

   if(level==="Club")
    h.thirdClub++;

   if(level==="Amateur")
    h.thirdAmateur++;

   if(level==="National")
    h.thirdNational++;

  }


  openModal(

   "🏇 Concours terminé",

   `

   ${h.name}
   a participé au concours
   ${level}.

   <br><br>

   La performance n'a pas permis
   de gagner cette fois.

   `

  );

 }


 h.fatigue=
  clamp(
   h.fatigue+20,
   0,
   100
  );


 h.experience=
  clamp(
   h.experience+3,
   0,
   100
  );


 calculateHorseValue(h);

 saveGame();

}

 );

}
