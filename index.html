<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Écurie V10</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07170d;font-family:Arial,sans-serif;color:#294b38}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#edf0e8}
header{position:sticky;top:0;z-index:50;padding:14px;background:linear-gradient(145deg,#173b25,#315f3c);color:white;box-shadow:0 3px 12px #0006}
h1{font:700 25px Georgia,serif;margin:0 0 8px}
.headerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.headerStat{background:#ffffff18;border-radius:10px;padding:7px;text-align:center;font-size:12px}
main{padding:10px 10px 88px}
.sectionTitle{font:700 18px Georgia,serif;color:white;background:linear-gradient(90deg,#315f3c,#6d8c59);padding:8px 10px;border-radius:12px;margin:13px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuBtn{border:1px solid #c9d3c4;border-radius:14px;min-height:68px;padding:10px;background:linear-gradient(145deg,#fffaf0,#dce8d4);color:#294b38;font-weight:900;box-shadow:0 3px 8px #0002}
.menuBtn:active,.primary:active{transform:scale(.98)}
.primary{width:100%;border:0;border-radius:12px;padding:11px;background:#315f3c;color:white;font-weight:900;margin-top:7px}
.secondary{width:100%;border:0;border-radius:12px;padding:10px;background:#d9e3d4;color:#294b38;font-weight:900;margin-top:6px}
.choice,.card,.marketCard{padding:11px;margin:7px 0;border-radius:14px;background:#fff;border:1px solid #d2dbce;box-shadow:0 2px 6px #0001}
.notice{padding:11px;margin:7px 0;border-radius:12px;background:#fff9e8;border:1px solid #dfd0a8}
.alert{background:#fff0e8;border-color:#d98d65}
.good{background:#edf7ea;border-color:#a9c79f}
.small{font-size:12px;color:#687668}
.statLine{display:flex;justify-content:space-between;margin:7px 0}
.progress{height:8px;background:#d5dbd0;border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#5d8b5e}
.value{font-size:20px;font-weight:900;color:#80621b}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#dfe8d7;font-size:11px;font-weight:800;margin:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.input{width:100%;padding:10px;border:1px solid #c7d1c1;border-radius:10px;background:white}
label{font-size:13px;font-weight:800}
.marketTabs,.breedTabs{display:flex;gap:5px;overflow:auto;margin:8px 0}
.marketTabs button,.breedTabs button{white-space:nowrap;border:0;border-radius:10px;padding:9px;background:#d8e1d3;color:#294b38;font-weight:800}
.marketTabs button.active,.breedTabs button.active{background:#315f3c;color:white}
.hero{height:145px;margin:-10px -10px 10px;position:relative;overflow:hidden;background:linear-gradient(#8bb5c7 0 48%,#6f995e 48% 74%,#8a6943 74%);border-bottom:5px solid #584029}
.hero:before{content:"";position:absolute;left:-10%;bottom:20px;width:120%;height:75px;background:radial-gradient(ellipse at 15% 80%,#355c38 0 35px,transparent 36px),radial-gradient(ellipse at 50% 85%,#426b3e 0 45px,transparent 46px),radial-gradient(ellipse at 85% 80%,#355c38 0 40px,transparent 41px)}
.hero .stable{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:180px;height:70px;background:#875737;border:5px solid #54331f;box-shadow:0 8px 12px #0005}
.hero .stable:before{content:"";position:absolute;left:-12px;top:-34px;width:194px;height:42px;background:#5a3824;clip-path:polygon(50% 0,100% 100%,0 100%)}
.hero .door{position:absolute;left:64px;bottom:0;width:50px;height:46px;background:#35261f;border:3px solid #d0a66d}
.hero .horse{position:absolute;right:18px;bottom:18px;font-size:68px;filter:drop-shadow(0 5px 3px #0006)}
.hero h2{position:absolute;left:12px;top:8px;color:white;text-shadow:0 2px 4px #000;font:700 21px Georgia,serif}
.horsePic,.marketPic{height:105px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7b997,#607b54 55%,#b59a6b);font-size:68px;filter:drop-shadow(0 4px 2px #0003);margin-bottom:8px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#000b;z-index:100}
.modal.show{display:flex}
.modalBox{width:min(410px,95vw);max-height:92vh;overflow:auto;padding:16px;border-radius:22px;background:linear-gradient(145deg,#f8f1df,#dfe8d7);border:2px solid #b99d5b;box-shadow:0 20px 60px #000}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modalHead h2{margin:0;font:700 22px Georgia,serif}
.close{border:0;border-radius:10px;padding:8px 11px;background:#d5d1c5;font-size:18px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#173b25;padding:5px;z-index:60}
.bottom button{border:0;background:#315f3c;color:white;border-radius:9px;padding:8px 2px;font-size:10px;font-weight:800}
hr{border:0;border-top:1px solid #cdd6c8;margin:12px 0}
</style>
</head>

<script>

const STORAGE="monEcurieV10";

const BREEDS=[
"Selle Français",
"KWPN",
"Anglo-Arabe",
"Connemara",
"Poney Français de Selle",
"Hanovrien",
"Oldenbourg",
"Quarter Horse",
"Lusitanien",
"Frison"
];

const NAMES=[
"Luna",
"Caramel",
"Jasper",
"Étoile",
"Silver Moon",
"Golden Dream",
"Belle Romance",
"Royal Star",
"Évidence",
"Mystère",
"Opale",
"Nébuleuse",
"Rivière",
"Saphir",
"Toscane"
];

let selectedBreed=BREEDS[0];
let markets={};


function clamp(n,a,b){
return Math.max(a,Math.min(b,n))
}


function money(n){
return Math.round(n).toLocaleString("fr-FR")+" €"
}


function clone(x){
return JSON.parse(JSON.stringify(x))
}


function dayOfYear(){
return ((game.day-1)%365)+1
}


function gameDate(){

const start=new Date(2026,8,1);

const d=new Date(start);

d.setDate(
d.getDate()+dayOfYear()-1
);

return d.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}


function season(){

let d=dayOfYear();

return d<=79
?"🌸 Printemps"
:d<=171
?"☀️ Été"
:d<=264
?"🍂 Automne"
:"❄️ Hiver";

}


function dayLabel(){
return "J"+dayOfYear()+"/365 · Année "+game.year
}


function fullGameDate(){
return gameDate()+" · Année "+game.year
}


function openModal(t,c){

modalTitle.textContent=t;

modalContent.innerHTML=c;

modal.classList.add("show");

}


function closeModal(){
modal.classList.remove("show")
}


modal.onclick=e=>{
if(e.target===modal)
closeModal()
}


function makeHorse(
id,
name,
race,
age,
sex,
potential,
current,
experience,
place
){

return {

id,
name,
race,
age,
sex,

potential,

realPotential:
clamp(potential+3,40,99),

currentLevel:current,

experience,

place,

form:80,
health:94,
fatigue:15,

technique:
clamp(current+7,40,99),

strength:70,
endurance:75,
regularity:70,

mental:80,
gentleness:75,
calm:70,
courage:80,
concentration:80,
willpower:78,
reactivity:55,

courseUse:75,
competitionUse:potential,
breedingUse:potential,

winsClub:2,
winsAmateur:1,
winsNational:0,

secondClub:1,
secondAmateur:1,
secondNational:0,

thirdClub:1,
thirdAmateur:1,
thirdNational:0,

totalCourses:10,

championshipHistory:[],

father:{
name:"Père d'origine",
results:[
"Origines enregistrées"
]
},

mother:{
name:"Mère d'origine",
results:[
"Origines enregistrées"
]
},

ration:{
hay:10,
grain:3
},

hoof:{
type:"ferrure",
lastDay:1
},

vet:{
lastDay:1,
nextDay:91
},

dentist:{
lastDay:1,
nextDay:181
},

osteo:{
lastDay:1,
nextDay:121
},

retired:false

}

}


const initial={

money:18450,

reputation:0,

day:1,

year:1,

boxes:6,

pastures:1,

land:1,

truckCapacity:2,

hay:1200,

grain:800,

straw:600,

maxHay:2000,

maxGrain:1500,

maxStraw:1500,

horses:[

makeHorse(
1,
"Luna",
"Selle Français",
8,
"Jument",
86,
76,
67,
"box"
),

makeHorse(
2,
"Caramel",
"Anglo-Arabe",
12,
"Hongre",
74,
69,
82,
"box"
),

makeHorse(
3,
"Jasper",
"Quarter Horse",
6,
"Hongre",
81,
72,
42,
"pasture"
),

makeHorse(
4,
"Étoile",
"Connemara",
4,
"Jument",
73,
48,
15,
"pasture"
)

]

};


let game=load();


function normalize(g){

if(!g.horses)
g.horses=[];

if(!g.boxes)
g.boxes=6;

if(!g.pastures)
g.pastures=1;

if(!g.land)
g.land=1;

if(!g.truckCapacity)
g.truckCapacity=2;


g.horses.forEach(h=>{

if(!h.ration)
h.ration={
hay:10,
grain:3
};

if(!h.hoof)
h.hoof={
type:"ferrure",
lastDay:1
};

if(!h.vet)
h.vet={
lastDay:1,
nextDay:g.day+90
};

if(!h.dentist)
h.dentist={
lastDay:1,
nextDay:g.day+180
};

if(!h.osteo)
h.osteo={
lastDay:1,
nextDay:g.day+120
};

if(!h.championshipHistory)
h.championshipHistory=[];

h.currentLevel=
clamp(
h.currentLevel||45,
0,
Math.min(
h.realPotential||65,
h.potential||60
)
);

});

return g;

}


function load(){

try{

let s=
localStorage.getItem(STORAGE);

if(s)
return normalize(
JSON.parse(s)
);

}catch(e){}

return normalize(
clone(initial)
);

}


function save(){

localStorage.setItem(
STORAGE,
JSON.stringify(game)
);

render();

}


function saveManual(){

save();

openModal(
"💾 Sauvegarde",
"La partie V10 a été sauvegardée sur cet appareil."
);

}


function render(){

dateLabelEl.textContent=
gameDate();

dayLabelEl.textContent=
dayLabel();

seasonEl.textContent=
season();

moneyEl.textContent=
money(game.money);

repEl.textContent=
"⭐ "+game.reputation;

horseCountEl.textContent=
game.horses.length;

boxCountEl.textContent=
game.horses.filter(
h=>h.place==="box"
).length
+"/"+game.boxes+" boxes";


let a=[];


game.horses.forEach(h=>{

let due=
h.hoof.lastDay+60;

if(game.day>=due)

a.push(
`🚨 <b>${h.name}</b> : maréchal en retard de ${game.day-due} jour(s).`
);

else if(game.day>=due-40)

a.push(
`⚠️ <b>${h.name}</b> : ${h.hoof.type==="ferrure"?"ferrure":"parage"} dans ${due-game.day} jour(s).`
);


if(game.day>=h.vet.nextDay)

a.push(
`🚨 <b>${h.name}</b> : vétérinaire en retard.`
);

else if(game.day>=h.vet.nextDay-15)

a.push(
`🩺 <b>${h.name}</b> : vétérinaire dans ${h.vet.nextDay-game.day} jour(s).`
);

});


alerts.innerHTML=
a.slice(0,5)
.map(
x=>`<div class="notice alert">${x}</div>`
)
.join("");

}


const dateLabelEl=
document.getElementById("dateLabel");

const dayLabelEl=
document.getElementById("dayLabel");

const seasonEl=
document.getElementById("season");

const moneyEl=
document.getElementById("money");

const repEl=
document.getElementById("rep");

const horseCountEl=
document.getElementById("horseCount");

const boxCountEl=
document.getElementById("boxCount");


function wins(h){

return h.winsClub+
h.winsAmateur+
h.winsNational

}


function podiums(h){

return wins(h)+
h.secondClub+
h.secondAmateur+
h.secondNational+
h.thirdClub+
h.thirdAmateur+
h.thirdNational

}


function regularity(h){

return h.totalCourses
?
clamp(
Math.round(
podiums(h)/
h.totalCourses*
80+
h.experience/8
),
5,
99
)
:20;

}


function value(h){

let score=

h.potential*.25+
h.currentLevel*.22+
h.experience*.08+
h.mental*.1+
h.technique*.08+
h.strength*.05+
h.endurance*.05+
regularity(h)*.07+
h.breedingUse*.05+
h.health*.05;

let v=
2500+
Math.pow(
clamp(score,0,100)/100,
2.6
)*65000;

if(h.age>=18)
v*=.55;

if(h.health<70)
v*=.85;

if(h.breedingUse>=90)
v+=5000;

return Math.round(v);

}


function potentialRange(h){

let u=
h.age<=3
?18
:h.age<=5
?14
:h.age<=8
?8
:4;

return [

clamp(
h.realPotential-u,
40,
99
),

clamp(
h.realPotential+u,
40,
99
)

];

}


function stat(n,v){

return `

<div class="choice">

<div class="statLine">

<span>${n}</span>

<b>${Math.round(v)}/100</b>

</div>

<div class="progress">

<span style="width:${clamp(v,0,100)}%"></span>

</div>

</div>

`;

}


function horseCard(h){

let r=
potentialRange(h);

return `

<div class="card">

<div class="horsePic">🐎</div>

<span class="badge">${h.race}</span>

<span class="badge">${h.age} ans</span>

<span class="badge">${h.sex}</span>

<h3>${h.name}</h3>

${h.place==="box"?"🏠 Box":"🌳 Pré"}

· 💰 ${money(value(h))}

<br>

🔎 Potentiel :

<b>${r[0]}–${r[1]}</b>

· 🏆 Niveau :

<b>${h.currentLevel}</b>

${stat("Forme",h.form)}

${stat("Santé",h.health)}

${stat("Fatigue",h.fatigue)}

<button
class="primary"
onclick="horseBook(${JSON.stringify(h.id)})">

📖 Carnet

</button>

</div>

`;

}


function horsesPage(){

openModal(

"🐎 Mes chevaux",

game.horses
.map(horseCard)
.join("")

||

"<div class='notice'>Aucun cheval.</div>"

);

}


function horseBook(id){

let h=
game.horses.find(
x=>x.id==id
);

if(!h)
return;

let r=
potentialRange(h);

let due=
h.hoof.lastDay+60;


openModal(

"📖 Carnet de "+h.name,

`

<div class="horsePic">🐎</div>

<div class="notice">

<b>${h.race}</b>
· ${h.age} ans
· ${h.sex}

<br>

${h.place==="box"?"🏠 Box":"🌳 Pré"}

· Valeur

<b>${money(value(h))}</b>

</div>


<div class="sectionTitle">
🏆 Profil sportif
</div>

<div class="choice">

Potentiel estimé :

<b>${r[0]}–${r[1]}</b>

<br>

<span class="small">
Le potentiel réel reste caché.
</span>

</div>

${stat("Niveau actuel",h.currentLevel)}

${stat("Expérience",h.experience)}

${stat("Régularité",regularity(h))}


<div class="sectionTitle">
📊 Capacités
</div>

${stat("Technique",h.technique)}

${stat("Force",h.strength)}

${stat("Endurance",h.endurance)}

${stat("Régularité naturelle",h.regularity)}


<div class="sectionTitle">
🧠 Mental
</div>

${stat("Mental",h.mental)}

${stat("Gentillesse",h.gentleness)}

${stat("Calme",h.calm)}

${stat("Courage",h.courage)}

${stat("Concentration",h.concentration)}

${stat("Volonté",h.willpower)}

${stat("Réactivité",h.reactivity)}


<div class="sectionTitle">
🎯 Utilité
</div>

${stat("Cours",h.courseUse)}

${stat("Compétition",h.competitionUse)}

${stat("Élevage",h.breedingUse)}


<div class="sectionTitle">
🏆 Palmarès
</div>

<div class="choice">

🥇 ${h.winsNational} National
· ${h.winsAmateur} Amateur
· ${h.winsClub} Club

<br>

🥈 ${h.secondNational} National
· ${h.secondAmateur} Amateur
· ${h.secondClub} Club

<br>

🥉 ${h.thirdNational} National
· ${h.thirdAmateur} Amateur
· ${h.thirdClub} Club

<br>

<b>${wins(h)} victoires</b>
/
${h.totalCourses} parcours

</div>


<div class="sectionTitle">
🧬 Origines
</div>

<div class="choice">

<b>Père :</b>
${h.father.name}

<br>

${h.father.results.join("<br>")}

</div>

<div class="choice">

<b>Mère :</b>
${h.mother.name}

<br>

${h.mother.results.join("<br>")}

</div>


<div class="sectionTitle">
🩺 Suivi professionnel
</div>

<div class="choice">

🧲 ${h.hoof.type==="ferrure"?"Ferrure":"Parage"}

· dernier J${h.hoof.lastDay}

· échéance J${due}

</div>

function generateMarket(race,count){

let arr=[];

for(let i=0;i<count;i++){

let pot=
55+
Math.floor(
Math.random()*43
);

let age=
3+
Math.floor(
Math.random()*13
);

let cur=
Math.min(
30+
Math.floor(
Math.random()*42
),
pot
);

let r=
race||
BREEDS[
Math.floor(
Math.random()*BREEDS.length
)
];

let h=
makeHorse(

"m"+Math.random(),

NAMES[
Math.floor(
Math.random()*NAMES.length
)
]
+" "+(i+1),

r,

age,

i%2
?"Hongre"
:"Jument",

pot,

cur,

age>8
?
40+
Math.floor(
Math.random()*45
)
:
5+
Math.floor(
Math.random()*30
),

"market"

);

h.realPotential=
clamp(
pot+
Math.floor(
Math.random()*15-7
),
40,
99
);

h.currentLevel=
Math.min(
h.currentLevel,
h.realPotential
);

h.winsClub=
Math.floor(
Math.random()*8
);

h.winsAmateur=
pot>75
?
Math.floor(
Math.random()*6
)
:
Math.floor(
Math.random()*3
);

h.winsNational=
pot>87
?
Math.floor(
Math.random()*4
)
:0;

h.totalCourses=
10+
Math.floor(
Math.random()*45
);

arr.push(h);

}

return arr;

}

){

markets[type]={
year:game.year,
month
};

markets[type].breeds={};

BREEDS.forEach(

r=>
markets[type]

generateMarket(r,7)

);

}

else{

markets[type].horses=

null,
14
);

}

}

}

function compete(
id,
level,
cost
){

let h=
game.horses.find(
x=>x.id==id
);

if(game.money<cost){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

if(h.fatigue>=80){

openModal(
"😴",
"Cheval trop fatigué."
);

return;

}

game.money-=cost;

h.totalCourses++;

h.fatigue=
clamp(
h.fatigue+20,
0,
100
);

h.experience=
clamp(
h.experience+3,
0,
100
);

let diff=
level==="Club"
?0
:
level==="Amateur"
?12
:25;

let chance=
clamp(

h.currentLevel*.42+
h.experience*.12+
regularity(h)*.24+
h.mental*.12+
h.concentration*.1-
diff,

3,
95

);


if(
Math.random()*100<
chance
){

if(level==="Club")
h.winsClub++;

if(level==="Amateur")
h.winsAmateur++;

if(level==="National")
h.winsNational++;

game.money+=cost*2;

game.reputation+=
level==="Club"
?2
:
level==="Amateur"
?5
:10;

openModal(
"🏆 Victoire !",
`<b>${h.name}</b> gagne en ${level} !`
);

}

else{

if(Math.random()<.5){

if(level==="Club")
h.thirdClub++;

if(level==="Amateur")
h.thirdAmateur++;

if(level==="National")
h.thirdNational++;

}

openModal(
"🏇 Concours terminé",
`${h.name} termine son concours ${level}.`
);

}

save();

}

function createFoal(
motherId,
fatherId
){

let m=
game.horses.find(
h=>h.id==motherId
);

let f=
game.horses.find(
h=>h.id==fatherId
);

if(!m||!f)
return;

if(game.money<1000){

openModal(
"💸",
"Il faut 1 000 € pour lancer la reproduction."
);

return;

}

game.money-=1000;

let pot=
clamp(
Math.round(
(m.potential+f.potential)/2+
(Math.random()*12-6)
),
40,
99
);

let foal=
makeHorse(
"h"+Date.now(),
"Poulinou",
""+m.race,
0,
Math.random()<.5
?"Jument"
:"Étalon",
pot,
20,
0,
"pasture"
);

foal.father={
name:f.name,
results:[
`Potentiel ${f.potential}`
]
};

foal.mother={
name:m.name,
results:[
`Potentiel ${m.potential}`
]
};

foal.realPotential=pot;

game.horses.push(foal);

save();

openModal(

"🐴 Nouveau poulain",

`

<b>${foal.name}</b>
est né !

<br>

Race :
${foal.race}

<br>

Potentiel génétique estimé :
${potentialRange(foal)[0]}–${potentialRange(foal)[1]}

`

);

}


function transportPage(){

openModal(

"🚚 Transport",

`

<div class="choice">

Capacité actuelle :

<b>
${game.truckCapacity} chevaux
</b>

</div>

<div class="choice">

Un camion permet d'emmener
les chevaux aux concours
et au marché.

</div>

<button
class="primary"
onclick="upgradeTruck()">

🚚 Augmenter la capacité — 6 000 €

</button>

`

);

}


function upgradeTruck(){

if(game.truckCapacity>=12){

openModal(
"🚚",
"Capacité maximale atteinte."
);

return;

}

if(game.money<6000){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

game.money-=6000;

game.truckCapacity=
Math.min(
12,
game.truckCapacity+2
);

save();

transportPage();

}


function domainPage(){

openModal(

"🏡 Domaine",

`

<div class="notice">

<b>Mon Écurie V10</b>

<br>

📅 ${gameDate()}

<br>

${dayLabel()}
· ${season()}

</div>

<div class="choice">

💰 ${money(game.money)}

· ⭐ ${game.reputation}

</div>

<div class="choice">

🏠 Boxes :

${game.horses.filter(
h=>h.place==="box"
).length}

/${game.boxes}

</div>

<div class="choice">

🌳 Pâtures :
${game.pastures}

<br>

🌾 Terrain :
${game.land} hectare(s)

</div>

<button
class="primary"
onclick="buyBox()">

🏠 Construire un box — 3 500 €

</button>

<button
class="primary"
onclick="buyPasture()">

🌳 Acheter une pâture — 5 000 €

</button>

<button
class="primary"
onclick="buyLand()">

🌾 Acheter 1 hectare — 8 000 €

</button>

`

);

}


function buyBox(){

if(game.money<3500){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

game.money-=3500;

game.boxes++;

save();

domainPage();

}


function buyPasture(){

if(game.money<5000){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

game.money-=5000;

game.pastures++;

save();

domainPage();

}


function buyLand(){

if(game.money<8000){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

game.money-=8000;

game.land++;

save();

domainPage();

}


function stablePage(){

openModal(

"🏚️ Boxes",

game.horses
.filter(
h=>h.place==="box"
)
.map(
horseCard
)
.join("")

||

"<div class='notice'>Aucun cheval au box.</div>"

);

}


function pasturePage(){

openModal(

"🌳 Pâtures",

`

<div class="notice">

Pâtures disponibles :

<b>${game.pastures}</b>

<br>

Les chevaux au pré récupèrent
plus facilement leur fatigue,
mais le travail intensif reste possible.

</div>

${

game.horses.map(

h=>

`<div class="choice">

<b>${h.name}</b>

—

${h.place==="pasture"
?"🌳 au pré"
:"🏠 au box"}

<button
class="primary"
onclick="togglePlace(${JSON.stringify(h.id)})">

${h.place==="pasture"
?"🏠 Mettre au box"
:"🌳 Mettre au pré"}

</button>

</div>`

).join("")

}

`

);

}


function togglePlace(id){

let h=
game.horses.find(
x=>x.id==id
);

if(h.place==="pasture"){

if(
game.horses.filter(
x=>x.place==="box"
).length
>=
game.boxes
){

openModal(
"🏠",
"Plus de box disponible."
);

return;

}

h.place="box";

}

else{

h.place="pasture";

}

save();

pasturePage();

}


function stocksPage(){

openModal(

"📦 Stocks",

`

<div class="choice">

🌾 Foin :

<b>${game.hay} kg</b>

/ ${game.maxHay}

</div>

<div class="choice">

🌽 Grain :

<b>${game.grain} kg</b>

/ ${game.maxGrain}

</div>

<div class="choice">

🪵 Paille :

<b>${game.straw} kg</b>

/ ${game.maxStraw}

</div>

<button
class="primary"
onclick="buyStock('hay')">

🌾 500 kg foin — 250 €

</button>

<button
class="primary"
onclick="buyStock('grain')">

🌽 300 kg grain — 180 €

</button>

<button
class="primary"
onclick="buyStock('straw')">

🪵 500 kg paille — 160 €

</button>

`

);

}


function buyStock(t){

let c=
t==="hay"
?250
:
t==="grain"
?180
:160;

let a=
t==="hay"
?500
:
t==="grain"
?300
:500;

let max=
t==="hay"
?
game.maxHay
:
t==="grain"
?
game.maxGrain
:
game.maxStraw;

if(game.money<c){

openModal(
"💸",
"Pas assez d'argent."
);

return;

}

game.money-=c;

game[t]=
Math.min(
max,
game[t]+a
);

save();

stocksPage();

}


function financesPage(){

let daily=
game.horses.reduce(
(s,h)=>s+feedCost(h),
0
);

openModal(

"💰 Finances",

`

<div class="notice">

Trésorerie :

<span class="value">

${money(game.money)}

</span>

</div>

<div class="choice">

🥕 Alimentation estimée :

<b>
${daily.toFixed(2)} €/jour
</b>

</div>

<div class="choice">

🧲 Ferrure :
110 €

· Parage :
50 €

</div>

<div class="choice">

🩺 Vétérinaire :
100 €

· 🦷 Dentiste :
70 €

· 👐 Ostéo :
90 €

</div>

<div class="choice">

📅 Coût administratif quotidien :
350 €

</div>

`

);

}


function calendarPage(){

let d=[];

game.horses.forEach(

h=>{

d.push(
`🧲 ${h.name} : J${h.hoof.lastDay+60}`
);

d.push(
`🩺 ${h.name} : J${h.vet.nextDay}`
);

d.push(
`🦷 ${h.name} : J${h.dentist.nextDay}`
);

d.push(
`👐 ${h.name} : J${h.osteo.nextDay}`
);

}

);

openModal(

"📆 Calendrier",

`

<div class="notice">

<b>
📅 ${gameDate()}
</b>

<br>

${dayLabel()}

<br>

${season()}

<br>

Le jeu avance désormais
jour par jour.

</div>

${d.map(
x=>`<div class="choice">${x}</div>`
).join("")}

`

);

}


function nextDay(){

let dailyBase=350;

game.money-=dailyBase;

game.day++;

if(dayOfYear()===1)
game.year++;

game.horses.forEach(

h=>{

h.fatigue=
clamp(
h.fatigue-
(
h.place==="pasture"
?10
:7
),
0,
100
);

if(h.place==="pasture"){

h.health=
clamp(
h.health+1,
0,
100
);

}

h.form=
clamp(
h.form+1,
0,
100
);

let due=
h.hoof.lastDay+60;

let over=
game.day-due;

if(over>0){

h.health=
clamp(
h.health-
Math.min(
12,
Math.ceil(over/5)
),
0,
100
);

h.form=
clamp(
h.form-
Math.min(
12,
Math.ceil(over/6)
),
0,
100
);

if(over>=10)

h.currentLevel=
clamp(
h.currentLevel-1,
0,
h.realPotential
);

}

h.currentLevel=
Math.min(
h.currentLevel,
h.realPotential
);


// consommation

game.hay=
Math.max(
0,
game.hay-h.ration.hay
);

game.grain=
Math.max(
0,
game.grain-h.ration.grain
);

game.straw=
Math.max(
0,
game.straw-.5
);

if(
game.hay===0||
game.grain===0
){

h.health=
clamp(
h.health-1,
0,
100
);

h.form=
clamp(
h.form-2,
0,
100
);

}

}

);

save();

}


render();

</script>

</html>
