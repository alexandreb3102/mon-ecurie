/* =====================================================
   JEU
===================================================== */

let game = load();

function defaultGame(){

 return {
  money:18450,
  reputation:0,
  week:12,
  year:1,
  boxes:6,
  horses:JSON.parse(JSON.stringify(baseHorses)),
  marketCycle:1
 };

}

function load(){

 try{

  const saved=localStorage.getItem("monEcurieV7");

  if(saved){

   const g=JSON.parse(saved);

   if(g.horses){

    g.horses.forEach(normalizeHorse);

    return g;

   }

  }

 }catch(e){}

 return defaultGame();

}

function save(){

 localStorage.setItem(
  "monEcurieV7",
  JSON.stringify(game)
 );

}

function normalizeHorse(h){

 if(!h.potential)
  h.potential=60;

 if(!h.current)
  h.current=40;

 /* RÈGLE ESSENTIELLE */

 h.current=Math.min(
  h.current,
  h.potential
 );

 h.courses=h.courses||0;

 h.winsClub=h.winsClub||0;
 h.winsAmateur=h.winsAmateur||0;
 h.winsNational=h.winsNational||0;

 h.secondClub=h.secondClub||0;
 h.secondAmateur=h.secondAmateur||0;
 h.secondNational=h.secondNational||0;

 h.thirdClub=h.thirdClub||0;
 h.thirdAmateur=h.thirdAmateur||0;
 h.thirdNational=h.thirdNational||0;

 h.championships=h.championships||[];

}


/* =====================================================
   CALCULS
===================================================== */

function wins(h){

 return h.winsClub+
 h.winsAmateur+
 h.winsNational;

}

function podiums(h){

 return wins(h)+
 h.secondClub+
 h.secondAmateur+
 h.secondNational+
 h.thirdClub+
 h.thirdAmateur+
 h.thirdNational;

}

function regularity(h){

 if(!h.courses)
  return 20;

 const p=podiums(h)/h.courses;
 const w=wins(h)/h.courses;

 return Math.round(
  Math.max(
   5,
   Math.min(
    99,
    p*65+w*25+(h.experience||0)*.10
   )
  )
 );

}


/*
 45 % SPORT
 20 % MENTAL
 15 % UTILITÉ
 20 % ÂGE + SANTÉ
*/

function horseValue(h){

 const sport=
   h.potential*.30+
   h.current*.20+
   h.experience*.10+
   regularity(h)*.20+
   h.technique*.08+
   h.force*.06+
   h.endurance*.06;

 const mental=
   h.mental*.20+
   h.gentillesse*.20+
   h.calme*.17+
   h.courage*.14+
   h.concentration*.16+
   h.volonte*.13;

 const utility=
   h.utilityCourse*.40+
   h.utilityCompetition*.40+
   h.utilityBreeding*.20;

 let ageScore;

 if(h.age<=7)
  ageScore=100;
 else if(h.age<=10)
  ageScore=94;
 else if(h.age<=13)
  ageScore=84;
 else if(h.age<=16)
  ageScore=68;
 else
  ageScore=45;

 const ageHealth=
   ageScore*.55+
   h.health*.45;

 let value=
   2500+
   Math.pow(
    (
     sport*.45+
     mental*.20+
     utility*.15+
     ageHealth*.20
    )/100,
    2.65
   )*65000;

 /* très bon cheval de cours */

 if(
  h.utilityCourse>=90 &&
  h.gentillesse>=90 &&
  h.calme>=90
 )
  value+=5000;

 /* vieux cheval sans résultat */

 if(
  h.age>=16 &&
  wins(h)<3
 )
  value*=.72;

 /* mauvaise santé */

 if(h.health<70)
  value*=.82;

 if(h.health<50)
  value*=.65;

 return Math.round(value);

}

function potentialRange(h){

 let margin=4;

 if(h.age<=3)
  margin=18;
 else if(h.age<=5)
  margin=14;
 else if(h.age<=8)
  margin=9;

 return {
  min:Math.max(40,h.potential-margin),
  max:Math.min(99,h.potential+margin)
 };

}

function euro(n){

 return Math.round(n)
 .toLocaleString("fr-FR")+" €";

}

  </button>

 </div>

 `;

}

function stat(name,value){

 return `

 <div class="stat">

  <div class="statLine">
   <span>${name}</span>

  </div>

  <div class="bar">
   <i style="width:${Math.max(0,Math.min(100,value))}%"></i>
  </div>

 </div>

 `;

}


/* =====================================================

===================================================== */

function book(id){

 const h=game.horses.find(x=>x.id===id);

 openModal(

  ${stat("Santé",h.health)}

  ${stat("Fatigue",100-h.fatigue)}

  <div class="sectionTitle">

  <div class="result">

   <span class="muted">À planifier dans le calendrier sanitaire</span>

function generateMarket(){

 const breeds=[
  "Selle Français",
  "KWPN",
  "Anglo-Arabe",
  "Connemara",
  "Poney Français de Selle",
  "Hanovrien",
  "Oldenbourg"
 ];

 const names=[
  "Jolie Étoile",
  "Silver Moon",
  "Golden Dream",
  "Belle Romance",
  "Royal Star",
  "Évidence",
  "Mystère"
 ];

 return names.map((name,i)=>{

  const potential=
   55+Math.floor(Math.random()*42);

  const age=
   3+Math.floor(Math.random()*13);

  const current=
   Math.min(
    potential,
    35+Math.floor(Math.random()*35)
   );

  const courseHorse=i===0 || i===4;

  const h={

   id:"market-"+game.marketCycle+"-"+i,

   name:name,
   breed:breeds[i],
   age:age,
   sex:i%2?"Hongre":"Jument",

   potential:potential,
   current:current,
   experience:
    age<6
     ?5+Math.floor(Math.random()*25)
     :40+Math.floor(Math.random()*40),

   technique:
    Math.min(
     potential,
     45+Math.floor(Math.random()*40)
    ),

   force:50+Math.floor(Math.random()*45),
   endurance:50+Math.floor(Math.random()*45),

   mental:
    50+Math.floor(Math.random()*50),

   gentillesse:
    courseHorse
     ?90+Math.floor(Math.random()*10)
     :45+Math.floor(Math.random()*50),

   calme:
    courseHorse
     ?88+Math.floor(Math.random()*12)
     :45+Math.floor(Math.random()*50),

   courage:50+Math.floor(Math.random()*50),
   concentration:50+Math.floor(Math.random()*50),
   volonte:50+Math.floor(Math.random()*50),

   utilityCourse:
    courseHorse
     ?95
     :45+Math.floor(Math.random()*45),

   utilityCompetition:
    potential,

   utilityBreeding:
    50+Math.floor(Math.random()*45),

   health:85+Math.floor(Math.random()*16),
   form:70+Math.floor(Math.random()*30),
   fatigue:5+Math.floor(Math.random()*30),

   winsClub:Math.floor(Math.random()*9),
   winsAmateur:
    potential>75
     ?Math.floor(Math.random()*6)
     :Math.floor(Math.random()*3),

   winsNational:
    potential>86
     ?Math.floor(Math.random()*4)
     :0,

   secondClub:Math.floor(Math.random()*7),
   secondAmateur:Math.floor(Math.random()*5),
   secondNational:
    potential>84
     ?Math.floor(Math.random()*3)
     :0,

   thirdClub:Math.floor(Math.random()*6),
   thirdAmateur:Math.floor(Math.random()*5),
   thirdNational:
    potential>84
     ?Math.floor(Math.random()*3)
     :0,

   courses:
    8+Math.floor(Math.random()*45),

   championships:[],

   father:{
    name:"Père de "+name,
    results:[
     "3 victoires en Amateur",
     "Origine sportive reconnue"
    ]
   },

   mother:{
    name:"Mère de "+name,
    results:[
     "5 victoires en Club",
     "Bonne réputation d'élevage"
    ]
   }

  };

  normalizeHorse(h);

  return h;

 });

}

===================================================== */

function train(id){

 const h=game.horses.find(x=>x.id===id);

 if(!h)return;

 if(h.fatigue>=75){

  openModal(
   "😴 Fatigue",
   "Ce cheval est trop fatigué pour un nouvel entraînement."
  );

  return;

 }

 const before=h.current;

 const gain=
  Math.max(
   1,
   Math.round(
    1+h.experience/35
   )
  );

 h.current=Math.min(
  h.potential,
  h.current+gain
 );

 h.experience=Math.min(
  100,
  h.experience+2
 );

 h.technique=Math.min(
  h.potential,
  h.technique+1
 );

 h.form=Math.min(
  100,
  h.form+4
 );

 h.fatigue=Math.min(
  100,
  h.fatigue+15
 );

 save();

 openModal(
  "🏇 Entraînement",
  `

   <div class="notice">

    <b>${h.name}</b> a travaillé.

    <br><br>

    Niveau :
    <b>${before} → ${h.current}</b>

    <br>

    <b>${h.potential}</b>

    <br>

    <b>${h.experience}/100</b>

  `
 );

}

function competitionCard(level,cost){

 return `

 <div class="horseCard">

  <b>${level}</b>

  <div class="muted">
   Frais d'engagement :
   ${euro(cost)}
  </div>

  ${game.horses.map(h=>`

   <button
    class="btn secondary"
    onclick="runCompetition(${h.id},'${level}',${cost})">

    · niveau ${h.current}

   </button>

  `).join("")}

 </div>

 `;

}

function runCompetition(id,level,cost){

 const h=game.horses.find(x=>x.id===id);

 if(game.money<cost){

  openModal(
   "💸 Concours impossible",
   "Tu n'as pas assez d'argent."
  );

  return;

 }

 game.money-=cost;

 let difficulty=0;

 if(level==="Amateur")
  difficulty=12;

 if(level==="National")
  difficulty=25;

 /*
 Le résultat combine :
 cheval + expérience + régularité
 + mental.
 */

 let chance=
   h.current*.43+
   h.experience*.12+
   regularity(h)*.23+
   h.mental*.12+
   h.concentration*.10-
   difficulty;

 chance=Math.max(
  3,
  Math.min(95,chance)
 );

 const roll=Math.random()*100;

 h.courses++;

 h.fatigue=Math.min(
  100,
  h.fatigue+20
 );

 h.experience=Math.min(
  100,
  h.experience+3
 );

 let message="";

 if(roll<chance*.55){

  if(level==="Club")
   h.winsClub++;

  if(level==="Amateur")
   h.winsAmateur++;

  if(level==="National")
   h.winsNational++;

  game.reputation+=
   level==="National"
    ?10
    :level==="Amateur"
     ?5
     :2;

  game.money+=cost*2;

  message=`
   🥇 <b>Victoire !</b>
   <br><br>
   ${h.name} remporte
   l'épreuve ${level}.
  `;

 }
 else if(roll<chance){

  if(level==="Club")
   h.secondClub++;

  if(level==="Amateur")
   h.secondAmateur++;

  if(level==="National")
   h.secondNational++;

  game.reputation++;

  message=`
   🥈 <b>Deuxième place</b>
   <br><br>
   ${h.name} réalise un très bon résultat.
  `;

 }
 else{

  if(Math.random()<.5){

   if(level==="Club")
    h.thirdClub++;

   if(level==="Amateur")
    h.thirdAmateur++;

   if(level==="National")
    h.thirdNational++;

  }

  message=`
   🏇 <b>Concours terminé</b>
   <br><br>
   ${h.name} n'a pas réussi à se placer
   cette fois.
  `;

 }

 save();

 openModal(
  "🏆 Résultat",
  `

   <div class="notice">
    ${message}
   </div>

   <div class="result">

    Niveau :
    <b>${h.current}/100</b>

    <br>

    Régularité :
    <b>${regularity(h)}/100</b>

    <br>

    Parcours :
    <b>${h.courses}</b>

   </div>

   <button class="btn" onclick="book(${h.id})">
    📖 Voir le carnet
   </button>

  `
 );

}
