<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Écurie V13.1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07170d;font-family:Arial,sans-serif;color:#294b38}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#edf0e8}
header{position:sticky;top:0;z-index:50;padding:14px;background:linear-gradient(145deg,#173b25,#315f3c);color:#fff;box-shadow:0 3px 12px #0006}
h1{font:700 25px Georgia,serif;margin:0 0 8px}
.headerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.headerStat{background:#ffffff18;border-radius:10px;padding:7px;text-align:center;font-size:11px}
main{padding:10px 10px 88px}
.sectionTitle{font:700 18px Georgia,serif;color:#fff;background:linear-gradient(90deg,#315f3c,#6d8c59);padding:8px 10px;border-radius:12px;margin:13px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuBtn{border:1px solid #c9d3c4;border-radius:14px;min-height:68px;padding:10px;background:linear-gradient(145deg,#fffaf0,#dce8d4);color:#294b38;font-weight:900;box-shadow:0 3px 8px #0002}
.menuBtn:active,.primary:active{transform:scale(.98)}
.primary,.secondary{width:100%;border:0;border-radius:12px;padding:11px;background:#315f3c;color:#fff;font-weight:900;margin-top:7px}
.secondary{background:#d9e3d4;color:#294b38}
.choice,.card,.marketCard{padding:11px;margin:7px 0;border-radius:14px;background:#fff;border:1px solid #d2dbce;box-shadow:0 2px 6px #0001}
.notice{padding:11px;margin:7px 0;border-radius:12px;background:#fff9e8;border:1px solid #dfd0a8}
.alert{background:#fff0e8;border-color:#d98d65}
.good{background:#edf7ea;border-color:#a9c79f}
.small{font-size:12px;color:#687668}
.statLine{display:flex;justify-content:space-between;margin:7px 0}
.progress{height:8px;background:#d5dbd0;border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#5d8b5e}
.value{font-size:20px;font-weight:900;color:#80621b}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#dfe8d7;font-size:11px;font-weight:800;margin:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.input{width:100%;padding:10px;border:1px solid #c7d1c1;border-radius:10px;background:#fff}
label{font-size:13px;font-weight:800}
.tabs{display:flex;gap:5px;overflow:auto;margin:8px 0}
.tabs button{white-space:nowrap;border:0;border-radius:10px;padding:9px;background:#d8e1d3;color:#294b38;font-weight:800}
.tabs button.active{background:#315f3c;color:#fff}
.hero{height:145px;margin:-10px -10px 10px;position:relative;overflow:hidden;background:linear-gradient(#8bb5c7 0 48%,#6f995e 48% 74%,#8a6943 74%);border-bottom:5px solid #584029}
.hero:before{content:"";position:absolute;left:-10%;bottom:20px;width:120%;height:75px;background:radial-gradient(ellipse at 15% 80%,#355c38 0 35px,transparent 36px),radial-gradient(ellipse at 50% 85%,#426b3e 0 45px,transparent 46px),radial-gradient(ellipse at 85% 80%,#355c38 0 40px,transparent 41px)}
.stable{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:180px;height:70px;background:#875737;border:5px solid #54331f;box-shadow:0 8px 12px #0005}
.stable:before{content:"";position:absolute;left:-12px;top:-34px;width:194px;height:42px;background:#5a3824;clip-path:polygon(50% 0,100% 100%,0 100%)}
.door{position:absolute;left:64px;bottom:0;width:50px;height:46px;background:#35261f;border:3px solid #d0a66d}
.hero .horse{position:absolute;right:18px;bottom:18px;font-size:68px;filter:drop-shadow(0 5px 3px #0006)}
.hero h2{position:absolute;left:12px;top:8px;color:#fff;text-shadow:0 2px 4px #000;font:700 21px Georgia,serif}
.horsePic,.marketPic{height:105px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7b997,#607b54 55%,#b59a6b);font-size:68px;margin-bottom:8px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#000b;z-index:100}
.modal.show{display:flex}
.modalBox{width:min(410px,95vw);max-height:92vh;overflow:auto;padding:16px;border-radius:22px;background:linear-gradient(145deg,#f8f1df,#dfe8d7);border:2px solid #b99d5b;box-shadow:0 20px 60px #000}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modalHead h2{margin:0;font:700 22px Georgia,serif}
.close,.back{border:0;border-radius:10px;padding:8px 11px;background:#d5d1c5;font-size:18px}
.back{background:#d9e3d4;color:#294b38;font-weight:900}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#173b25;padding:5px;z-index:60}
.bottom button{border:0;background:#315f3c;color:#fff;border-radius:9px;padding:8px 2px;font-size:10px;font-weight:800}
.rank{font-size:25px;font-weight:900;text-align:center;padding:10px}
</style>
</head>

<body>
<div id="app">

<header>
<h1>🐴 Mon Écurie <span style="font-size:12px">V13.1</span></h1>
<div class="headerGrid">
<div class="headerStat">📅 <b id="dateLabel"></b><br><span id="dayLabel"></span><br><span id="season"></span></div>
<div class="headerStat">💰 <b id="money"></b><br><span id="rep"></span></div>
<div class="headerStat">🐴 <b id="horseCount"></b><br><span id="boxCount"></span></div>
</div>
</header>

<main>

<div class="hero">
<h2>🌿 La vie à l'écurie</h2>
<div class="stable"><div class="door"></div></div>
<div class="horse">🐎</div>
</div>

<div id="alerts"></div>

<div class="sectionTitle">📅 Gestion quotidienne</div>
<div class="grid">
<button class="menuBtn" onclick="nextDay()">⏩<br>Passer 1 jour</button>
<button class="menuBtn" onclick="calendarPage()">📆<br>Calendrier</button>
<button class="menuBtn" onclick="financesPage()">💰<br>Finances</button>
<button class="menuBtn" onclick="saveManual()">💾<br>Sauvegarder</button>
</div>

<div class="sectionTitle">🐴 Mes chevaux</div>
<div class="grid">
<button class="menuBtn" onclick="horsesPage()">🐎<br>Mes chevaux</button>
<button class="menuBtn" onclick="feedPage()">🥕<br>Rations</button>
<button class="menuBtn" onclick="trainingPage()">🏋️<br>Entraînement</button>
<button class="menuBtn" onclick="carePage()">❤️<br>Soins</button>
</div>

<div class="sectionTitle">🏪 Marché</div>
<div class="grid">
<button class="menuBtn" onclick="marketPage('breeding')">🧬<br>Élevages</button>
<button class="menuBtn" onclick="marketPage('merchant')">🐎<br>Marchands</button>
<button class="menuBtn" onclick="marketPage('auction')">🔨<br>Enchères</button>
<button class="menuBtn" onclick="salesPage()">💶<br>Vendre</button>
</div>

<div class="sectionTitle">👨‍⚕️ Professionnels</div>
<div class="grid">
<button class="menuBtn" onclick="vetPage()">🩺<br>Vétérinaire</button>
<button class="menuBtn" onclick="farrierPage()">🧲<br>Maréchal</button>
<button class="menuBtn" onclick="dentistPage()">🦷<br>Dentiste</button>
<button class="menuBtn" onclick="osteoPage()">👐<br>Ostéopathe</button>
</div>

<div class="sectionTitle">🏆 Vie sportive</div>
<div class="grid">
<button class="menuBtn" onclick="showsPage()">🏆<br>Concours</button>
<button class="menuBtn" onclick="championshipPage()">🇫🇷<br>Championnats</button>
<button class="menuBtn" onclick="breedingPage()">❤️‍🔥<br>Reproduction</button>
<button class="menuBtn" onclick="transportPage()">🚚<br>Transport</button>
</div>

<div class="sectionTitle">🏡 Domaine</div>
<div class="grid">
<button class="menuBtn" onclick="domainPage()">🏡<br>Domaine</button>
<button class="menuBtn" onclick="stablePage()">🏚️<br>Boxes</button>
<button class="menuBtn" onclick="pasturePage()">🌳<br>Pâtures</button>
<button class="menuBtn" onclick="stocksPage()">📦<br>Stocks</button>
</div>

</main>

<nav class="bottom">
<button onclick="horsesPage()">🐴<br>Chevaux</button>
<button onclick="marketPage('breeding')">🏪<br>Marché</button>
<button onclick="showsPage()">🏆<br>Concours</button>
<button onclick="farrierPage()">🧲<br>Pro</button>
<button onclick="domainPage()">🏡<br>Domaine</button>
</nav>

</div>

<div id="modal" class="modal">
<div class="modalBox">
<div class="modalHead">
<div style="display:flex;align-items:center;gap:6px">
<button id="backBtn" class="back" onclick="goBack()">←</button>
<h2 id="modalTitle">Mon Écurie</h2>
</div>
<button class="close" onclick="closeModal()">✕</button>
</div>
<div id="modalContent"></div>
</div>
</div>

<script>

const STORAGE="monEcurieV13_1";

const BREEDS=[
"Selle Français","KWPN","Anglo-Arabe","Connemara",
"Poney Français de Selle","Hanovrien","Oldenbourg",
"Quarter Horse","Lusitanien","Frison"
];

const NAMES=[
"Luna","Caramel","Jasper","Étoile","Silver Moon","Golden Dream",
"Belle Romance","Royal Star","Évidence","Mystère","Opale","Nébuleuse",
"Rivière","Saphir","Toscane","Violette","Orage","Galaxie","Éclipse",
"Tempête","Vanille","Praline","Câline","Nikita","Sultan","Atlas","Jazz",
"Jade","Ambre","Rubis","Topaze","Perle","Safran","Mistral","Phoenix",
"Volcan","Aria","Bella","Cassandre","Diva","Émeraude","Fleur",
"Harmonie","Isis","Karma","Légende","Mélodie","Nova","Ondine","Pacha",
"Quartz","Rêve","Soleil","Tango","Ulysse","Vega","Whisky","Xena",
"Yoko","Zéphyr","Aube","Bambou","Cobalt","Dune","Flamme","Gatsby",
"Hélios","Icare","Joy","Kenza","Lilas","Maestro","Nacre","Olympe",
"Pistache","Roméo","Salsa","Trésor","Utopia","Victoire","Willow",
"Zara","Altesse","Bounty","César","Darling","Elixir","Fidji","Ginger",
"Horizon","Jupiter","Kiss","Lancelot","Moka","Nirvana","Oscar",
"Pépite","Roxane","Titan","Vénus","Wendy","Yasmine"
];

const RACE_BONUS={
"Selle Français":{CSO:15,CCE:8,Dressage:2},
"KWPN":{CSO:10,CCE:5,Dressage:15},
"Anglo-Arabe":{CSO:7,CCE:17,Dressage:4},
"Connemara":{CSO:12,CCE:11,Dressage:2},
"Poney Français de Selle":{CSO:13,CCE:11,Dressage:5},
"Hanovrien":{CSO:6,CCE:3,Dressage:18},
"Oldenbourg":{CSO:9,CCE:2,Dressage:15},
"Quarter Horse":{CSO:2,CCE:5,Dressage:1},
"Lusitanien":{CSO:2,CCE:5,Dressage:18},
"Frison":{CSO:1,CCE:3,Dressage:15}
};

let game;
let selectedBreed=BREEDS[0];
let markets={};
let navigation=[];

const $=id=>document.getElementById(id);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>Math.round(n).toLocaleString("fr-FR")+" €";

function dayOfYear(){
return ((game.day-1)%365)+1;
}

function gameDate(){
let d=new Date(2026,8,1);
d.setDate(d.getDate()+dayOfYear()-1);
return d.toLocaleDateString("fr-FR",{
weekday:"long",
day:"numeric",
month:"long"
});
}

function season(){
let d=dayOfYear();
if(d<=91)return"🍂 Automne";
if(d<=182)return"❄️ Hiver";
if(d<=274)return"🌸 Printemps";
return"☀️ Été";
}

function dayLabel(){
return"J"+dayOfYear()+"/365 · Année "+game.year;
}

function save(){
localStorage.setItem(STORAGE,JSON.stringify(game));
render();
}

function clone(x){
return JSON.parse(JSON.stringify(x));
}

function breedPotential(race){
let b=RACE_BONUS[race]||{CSO:0,CCE:0,Dressage:0};
let base=55+Math.floor(Math.random()*25);
return{
CSO:clamp(base+b.CSO+Math.floor(Math.random()*11-5),35,98),
CCE:clamp(base+b.CCE+Math.floor(Math.random()*11-5),35,98),
Dressage:clamp(base+b.Dressage+Math.floor(Math.random()*11-5),35,98)
};
}

function makeHorse(id,name,race,age,sex,place,pot){
let p=pot||breedPotential(race);
return{
id:id,
name:name,
race:race,
age:age,
sex:sex,
place:place||"pasture",
retired:false,

potential:p,

current:{
CSO:Math.min(p.CSO,30+Math.floor(Math.random()*40)),
CCE:Math.min(p.CCE,30+Math.floor(Math.random()*40)),
Dressage:Math.min(p.Dressage,30+Math.floor(Math.random()*40))
},

experience:{
CSO:Math.floor(Math.random()*30),
CCE:Math.floor(Math.random()*30),
Dressage:Math.floor(Math.random()*30)
},

regularity:{
CSO:50,
CCE:50,
Dressage:50
},

health:94,
form:80,
fatigue:15,
mental:70+Math.floor(Math.random()*25),
strength:70,
endurance:75,
calm:70,
courage:80,
concentration:80,
willpower:78,

ration:{hay:10,grain:3},

hoof:{type:"ferrure",lastDay:1},
vet:{lastDay:1,nextDay:91},
dentist:{lastDay:1,nextDay:181},
osteo:{lastDay:1,nextDay:121},

father:{name:"Père d'origine",results:["Origines enregistrées"]},
mother:{name:"Mère d'origine",results:["Origines enregistrées"]},

results:[],
qualPoints:{CSO:0,CCE:0,Dressage:0},
courses:{CSO:0,CCE:0,Dressage:0}
};
}

const initial={
money:18450,
reputation:0,
day:1,
year:1,
boxes:6,
pastures:1,
land:1,
truckCapacity:2,
hay:1200,
grain:800,
straw:600,
maxHay:2000,
maxGrain:1500,
maxStraw:1500,

horses:[
makeHorse(1,"Luna","Selle Français",8,"Jument","box",
{CSO:86,CCE:74,Dressage:62}),
makeHorse(2,"Caramel","Anglo-Arabe",12,"Hongre","box",
{CSO:74,CCE:86,Dressage:61}),
makeHorse(3,"Jasper","Quarter Horse",6,"Hongre","pasture",
{CSO:61,CCE:63,Dressage:55}),
makeHorse(4,"Étoile","Connemara",4,"Jument","pasture",
{CSO:78,CCE:75,Dressage:61})
]
};

function normalize(g){

g=Object.assign(clone(initial),g);

g.horses=(g.horses||[]).map(h=>{

if(!h.potential||typeof h.potential!=="object"){
let p=h.realPotential||h.potential||65;
h.potential={CSO:p,CCE:p,Dressage:p};
}

if(!h.current||typeof h.current!=="object")
h.current={CSO:45,CCE:45,Dressage:45};

if(!h.experience||typeof h.experience!=="object")
h.experience={CSO:0,CCE:0,Dressage:0};

if(!h.regularity||typeof h.regularity!=="object")
h.regularity={CSO:50,CCE:50,Dressage:50};

if(!h.qualPoints)
h.qualPoints={CSO:0,CCE:0,Dressage:0};

if(!h.courses)
h.courses={CSO:0,CCE:0,Dressage:0};

if(!h.ration)
h.ration={hay:10,grain:3};

if(!h.hoof)
h.hoof={type:"ferrure",lastDay:1};

if(!h.vet)
h.vet={lastDay:1,nextDay:g.day+90};

if(!h.dentist)
h.dentist={lastDay:1,nextDay:g.day+180};

if(!h.osteo)
h.osteo={lastDay:1,nextDay:g.day+120};

if(!h.results)
h.results=[];

if(!h.father)
h.father={name:"Inconnu",results:[]};

if(!h.mother)
h.mother={name:"Inconnue",results:[]};

return h;
});

return g;
}

function load(){

try{
let s=localStorage.getItem(STORAGE);
if(s)return normalize(JSON.parse(s));
}catch(e){}

return normalize(clone(initial));
}

game=load();

function value(h){

let pot=
(h.potential.CSO+
h.potential.CCE+
h.potential.Dressage)/3;

let level=
(h.current.CSO+
h.current.CCE+
h.current.Dressage)/3;

let v=
2500+
Math.pow(clamp(
pot*.55+
level*.35+
h.experience.CSO*.03+
h.experience.CCE*.03+
h.experience.Dressage*.03,
0,100)/100,2.5)*65000;

if(h.race==="OC")v*=.82;
if(h.age>=18)v*=.55;
if(h.health<70)v*=.85;

return Math.round(v);
}

function potentialRange(h,d){

let u=
h.age<=3?18:
h.age<=5?14:
h.age<=8?8:4;

return[
clamp(h.potential[d]-u,30,99),
clamp(h.potential[d]+u,30,99)
];
}

function stat(n,v){

return`
<div class="choice">
<div class="statLine">
<span>${n}</span>
<b>${Math.round(v)}/100</b>
</div>
<div class="progress">
<span style="width:${clamp(v,0,100)}%"></span>
</div>
</div>`;
}

function render(){

$("dateLabel").textContent=gameDate();
$("dayLabel").textContent=dayLabel();
$("season").textContent=season();
$("money").textContent=money(game.money);
$("rep").textContent="⭐ "+game.reputation;
$("horseCount").textContent=game.horses.length;

$("boxCount").textContent=
game.horses.filter(h=>h.place==="box").length+
"/"+game.boxes+" boxes";

let alerts=[];

game.horses.forEach(h=>{

let d=h.hoof.lastDay+60;

if(game.day>=d)
alerts.push(
`🚨 <b>${h.name}</b> : maréchal en retard.`
);

if(game.day>=h.vet.nextDay)
alerts.push(
`🚨 <b>${h.name}</b> : vétérinaire à faire.`
);

});

$("alerts").innerHTML=
alerts.slice(0,5)
.map(x=>`<div class="notice alert">${x}</div>`)
.join("");
}

function openModal(title,content,showBack=true){

$("modalTitle").textContent=title;
$("modalContent").innerHTML=content;
$("modal").classList.add("show");

$("backBtn").style.display=
showBack&&navigation.length?"block":"none";
}

function closeModal(){

navigation=[];
$("modal").classList.remove("show");
}

$("modal").onclick=e=>{
if(e.target===$("modal"))closeModal();
};

function page(fn){

if(window.currentPage)
navigation.push(window.currentPage);

window.currentPage=fn;
fn();
}

function goBack(){

let f=navigation.pop();

if(f){
window.currentPage=f;
f();
}else{
closeModal();
}
}

function saveManual(){

save();

openModal(
"💾 Sauvegarde",
"La partie V13.1 a été sauvegardée sur cet appareil.",
false
);
}

/* =========================
CHEVAUX
========================= */

function horseCard(h){

return`
<div class="card">

<div class="horsePic">🐎</div>

<span class="badge">${h.race}</span>
<span class="badge">${h.age} ans</span>
<span class="badge">${h.sex}</span>

<h3>${h.name}</h3>

${h.place==="box"?"🏠 Box":"🌳 Pré"}

· 💰 ${money(value(h))}

${stat("🏇 CSO",h.current.CSO)}
${stat("🌳 CCE",h.current.CCE)}
${stat("💃 Dressage",h.current.Dressage)}

<button class="primary"
onclick="horseBook(${JSON.stringify(h.id)})">
📖 Carnet
</button>

</div>`;
}

function horsesPage(){

page(()=>{

openModal(
"🐎 Mes chevaux",
game.horses.map(horseCard).join("")||
"<div class='notice'>Aucun cheval.</div>"
);

});
}

function horseBook(id){

let h=game.horses.find(x=>x.id==id);

if(!h)return;

openModal(
"📖 Carnet de "+h.name,
`

<div class="horsePic">🐎</div>

<div class="notice">
<b>${h.race}</b> · ${h.age} ans ·
<b>${h.sex}</b>
<br>
${h.place==="box"?"🏠 Box":"🌳 Pré"}
· Valeur <b>${money(value(h))}</b>
</div>

<div class="sectionTitle">
🏆 Disciplines
</div>

${stat("🏇 CSO",h.current.CSO)}
${stat("🌳 CCE",h.current.CCE)}
${stat("💃 Dressage",h.current.Dressage)}

<div class="choice">
<b>Potentiel génétique</b><br>
🏇 CSO : ${h.potential.CSO}/100<br>
🌳 CCE : ${h.potential.CCE}/100<br>
💃 Dressage : ${h.potential.Dressage}/100
</div>

${stat("❤️ Santé",h.health)}
${stat("💪 Forme",h.form)}
${stat("😴 Fatigue",h.fatigue)}
${stat("🧠 Mental",h.mental)}

<div class="sectionTitle">
🇫🇷 Points Championnat
</div>

<div class="choice">
🏇 CSO : <b>${h.qualPoints.CSO}</b> pts<br>
🌳 CCE : <b>${h.qualPoints.CCE}</b> pts<br>
💃 Dressage : <b>${h.qualPoints.Dressage}</b> pts
</div>

<div class="sectionTitle">
🧬 Origines
</div>

<div class="choice">
<b>Père :</b> ${h.father.name}<br>
${h.father.results.join("<br>")}
<br><br>
<b>Mère :</b> ${h.mother.name}<br>
${h.mother.results.join("<br>")}
</div>

<div class="sectionTitle">
📜 Carrière
</div>

${
h.results.length
?
h.results.slice().reverse().map(
r=>`<div class="choice">${r}</div>`
).join("")
:
"<div class='notice'>Aucun concours enregistré.</div>"
}

function train(id,d){

let h=game.horses.find(x=>x.id==id);

if(h.fatigue>=75){
openModal("😴","Cheval trop fatigué.");
return;
}

let gain=
Math.max(
1,
Math.round(1+h.experience[d]/45)
);

h.current[d]=
clamp(
h.current[d]+gain,
0,
h.potential[d]
);

h.experience[d]=
clamp(
h.experience[d]+2,
0,
100
);

h.form=clamp(h.form+3,0,100);
h.fatigue=clamp(h.fatigue+14,0,100);

save();
horseBook(id);
}

function uniqueMarketName(){

let used=
new Set(
game.horses.map(
h=>h.name.toLowerCase()
)
);

let shuffled=
NAMES.slice().sort(
()=>Math.random()-.5
);

for(let n of shuffled){
if(!used.has(n.toLowerCase()))
return n;
}

return "Étoile "+Date.now();
}

function generateMarket(race,count){

let arr=[];

for(let i=0;i<count;i++){

let r=
race||
BREEDS[
Math.floor(
Math.random()*BREEDS.length
)
];

let p=breedPotential(r);

let h=makeHorse(
"market"+Math.random(),
uniqueMarketName(),
r,
3+Math.floor(Math.random()*13),
["Jument","Hongre","Entier"][
Math.floor(Math.random()*3)
],
"market",
p
);

arr.push(h);
}

return arr;
}

function marketEnsure(type){

let month=
Math.floor(
(dayOfYear()-1)/30
);

if(
!markets[type]||
markets[type].year!==game.year||
markets[type].month!==month
){

markets[type]={
year:game.year,
month:month
};

if(type==="breeding"){

markets[type].breeds={};

BREEDS.forEach(
r=>{
markets[type].breeds[r]=
generateMarket(r,7);
}
);

}else{

markets[type].horses=
generateMarket(null,14);

}
}
}

game.horses.filter(
x=>x.place==="box"
).length>=game.boxes
){

game.money-=price;

h.id=

markets.breeding.breeds[selectedBreed].splice(i,1);

markets[type].horses.splice(i,1);

function createFoal(motherId,fatherId){

let mother=
game.horses.find(
h=>h.id==motherId
);

let father=
game.horses.find(
h=>h.id==fatherId
);

if(!mother||!father)return;

if(game.money<1000){

openModal(
"💸",
"Il faut 1 000 € pour lancer la reproduction."
);

return;
}

game.money-=1000;

let race=
mother.race===father.race
?
mother.race
:
"OC";

let p={

CSO:clamp(
Math.round(
(mother.potential.CSO+
father.potential.CSO)/2+
(Math.random()*12-6)
),
35,99
),

CCE:clamp(
Math.round(
(mother.potential.CCE+
father.potential.CCE)/2+
(Math.random()*12-6)
),
35,99
),

Dressage:clamp(
Math.round(
(mother.potential.Dressage+
father.potential.Dressage)/2+
(Math.random()*12-6)
),
35,99
)

};

let foal=
makeHorse(
"foal"+Date.now(),
"",
race,
0,
Math.random()<.5?"Jument":"Entier",
"pasture",
p
);

foal.current={
CSO:20,
CCE:20,
Dressage:20
};

foal.father={
name:father.name,
results:[
`Race : ${father.race}`
]
};

foal.mother={
name:mother.name,
results:[
`Race : ${mother.race}`
]
};

game.horses.push(foal);

save();

nameFoal(foal.id);
}

function startCompetition(id,d,level){

let h=
game.horses.find(
x=>x.id==id
);

let cost=
level==="Club"?250:
level==="Amateur"?600:
1500;

if(game.money<cost){
openModal("💸","Pas assez d'argent.");
return;
}

if(h.fatigue>=80){
openModal("😴","Cheval trop fatigué.");
return;
}

game.money-=cost;

let result;

if(d==="CSO")
result=runCSO(h,level);

if(d==="CCE")
result=runCCE(h,level);

if(d==="Dressage")
result=runDressage(h,level);

h.courses[d]++;

h.experience[d]=
clamp(
h.experience[d]+3,
0,100
);

h.fatigue=
clamp(
h.fatigue+20,
0,100
);

let points=
qualificationPoints(
d,
result
);

h.qualPoints[d]+=points;

let record=
`J${dayOfYear()} · ${d} ${level} · `+
`${result.rank}e/${result.partants} · `+
`${result.summary} · +${points} pts championnat`;

h.results.push(record);

if(h.results.length>100)
h.results.shift();

if(result.rank===1)
game.reputation+=10;
else if(
result.rank<=Math.ceil(result.partants*.25)
)
game.reputation+=5;
else if(
result.rank<=Math.ceil(result.partants*.5)
)
game.reputation+=2;

game.money+=
result.rank<=Math.ceil(result.partants*.1)
?
cost*2.5
:
result.rank<=Math.ceil(result.partants*.25)
?
cost*1.6
:
cost*.6;

save();

showCompetitionResult(
h,d,level,result,points
);
}

function competitorScore(h,d,level){

let difficulty=
level==="Club"?0:
level==="Amateur"?12:
25;

return(
h.current[d]*.50+
h.potential[d]*.15+
h.experience[d]*.10+
h.mental*.10+
h.regularity[d]*.10+
h.form*.05-
h.fatigue*.12+
(Math.random()*18-9)
-
difficulty
);
}

function runCSO(h,level){

let partants=
25+
Math.floor(Math.random()*76);

let score=
competitorScore(
h,"CSO",level
);

let bars=
Math.random()<
clamp(
.03+(70-score)/500,
.03,.35
)
?
1+Math.floor(Math.random()*2)
:
0;

let refus=
Math.random()<
clamp(
.02+(60-score)/500,
.02,.20
)
?
1:0;

let timePenalty=
Math.random()<.22
?2:0;

let penalties=
bars*4+
refus*4+
timePenalty;

let competitorScores=[];

for(let i=0;i<partants-1;i++)
competitorScores.push(
20+Math.random()*100
);

let rank=
1+
competitorScores.filter(
x=>x<score-penalties*1.5
).length;

rank=clamp(
rank,
1,
partants
);

return{

partants,
rank,

clean:
penalties===0,

penalties,

bars,
refus,
timePenalty,

eliminated:
refus>=3,

summary:
`${penalties} point(s) de pénalité`

};

}

function runDressage(h,level){

let partants=
25+
Math.floor(Math.random()*61);

let percent=
clamp(
45+
h.current.Dressage*.42+
h.mental*.08+
h.experience.Dressage*.10+
h.form*.05-
h.fatigue*.08+
(Math.random()*7-3.5),
35,
85
);

let others=[];

for(let i=0;i<partants-1;i++)
others.push(
45+Math.random()*38
);

let rank=
1+
others.filter(
x=>x>percent
).length;

return{

partants,
rank,
percent,

clean:true,
eliminated:false,

summary:
`${percent.toFixed(3)} %`

};

}

function runCCE(h,level){

let dressage=
runDressage(h,level);

let cso=
runCSO(h,level);

let cross=
Math.max(
0,
Math.round(
(55-h.current.CCE)*.35+
Math.random()*10
)
);

let total=
Math.round(
(
(100-dressage.percent)*1.5+
cross+
cso.penalties
)*10
)/10;

let partants=
35+
Math.floor(Math.random()*46);

let rank=
1+
Math.floor(
Math.random()*partants
);

rank=clamp(rank,1,partants);

return{

partants,
rank,

dressagePercent:
dressage.percent,

cross,
csoPenalties:cso.penalties,

penalties:total,

clean:
cross===0&&cso.penalties===0,

eliminated:
cso.eliminated,

summary:
`${total.toFixed(1)} points de pénalité`

};

}

function quart(rank,partants){

if(rank<=Math.ceil(partants*.25))
return 1;

if(rank<=Math.ceil(partants*.50))
return 2;

if(rank<=Math.ceil(partants*.75))
return 3;

return 4;
}

function qualificationPoints(d,r){

if(r.eliminated)
return 0;

let q=
quart(
r.rank,
r.partants
);

if(d==="CSO"){

/*
Points championnat séparés
des points de pénalité.

Sans-faute :
premier quart = 20
deuxième = 15
troisième = 12,5
quatrième = 10

Avec pénalité :
premier quart = 10
deuxième = 5
troisième = 2,5
quatrième = 0
*/

if(r.clean){

if(q===1)return 20;
if(q===2)return 15;
if(q===3)return 12.5;
return 10;

}else{

if(q===1)return 10;
if(q===2)return 5;
if(q===3)return 2.5;
return 0;

}

}

if(q===1)return 10;
if(q===2)return 5;
if(q===3)return 2.5;

return 0;
}

function runChampionships(){

let eligible=
game.horses.filter(
h=>
h.qualPoints.CSO>=20||
h.qualPoints.CCE>=20||
h.qualPoints.Dressage>=20
);

if(!eligible.length){

openModal(
"🇫🇷 Qualifications",
"Aucun cheval n'a encore atteint le seuil de qualification."
);

return;
}

let h=
eligible[
Math.floor(
Math.random()*eligible.length
)
];

let discipline=
h.qualPoints.CSO>=
Math.max(
h.qualPoints.CCE,
h.qualPoints.Dressage
)
?
"CSO"
:
h.qualPoints.CCE>=h.qualPoints.Dressage
?
"CCE"
:
"Dressage";

let partants=
40+
Math.floor(Math.random()*61);

let rank=
1+
Math.floor(Math.random()*partants);

h.results.push(
`Août · Championnats de France ${discipline} · ${rank}e / ${partants}`
);

save();

openModal(
"🇫🇷 Championnats de France",

`

<div class="rank">

${rank<=3?
["🥇","🥈","🥉"][rank-1]:
"🏅"}

${h.name}

<br>

${rank}e / ${partants}

</div>

<div class="notice good">

Discipline :
<b>${discipline}</b>

<br>

🏆 Résultat du Championnat de France

</div>
`,
false
);
}

function buyStock(t){

t==="grain"?180:
160;

let amount=
t==="hay"?500:
t==="grain"?300:
500;

let max=
t==="hay"?game.maxHay:
t==="grain"?game.maxGrain:
game.maxStraw;

if(game.money<cost){
openModal("💸","Pas assez d'argent.");
return;
}

game.money-=cost;

game[t]=
Math.min(
max,
game[t]+amount
);

save();

stocksPage();
}

========================= */

function nextDay(){

game.money-=350;

game.day++;

if(dayOfYear()===1)
game.year++;

game.horses.forEach(h=>{

h.fatigue=
clamp(
h.fatigue-
(
h.place==="pasture"
?10
:7
),
0,
100
);

if(h.place==="pasture")
h.health=
clamp(
h.health+1,
0,
100
);

h.form=
clamp(
h.form+1,
0,
100
);

game.hay=
Math.max(
0,
game.hay-h.ration.hay
);

game.grain=
Math.max(
0,
game.grain-h.ration.grain
);

game.straw=
Math.max(
0,
game.straw-.5
);

if(
game.hay===0||
game.grain===0
){

h.health=
clamp(
h.health-1,
0,
100
);

h.form=
clamp(
h.form-2,
0,
100
);

}

});

save();
}
