/* =====================================================
 CHARGEMENT / SAUVEGARDE
===================================================== */

let game=loadGame();

function loadGame(){

 try{

  const saved=
   localStorage.getItem("monEcurieV8");

  if(saved){

   return normalizeGame(
    JSON.parse(saved)
   );

  }

 }catch(e){

  console.log(e);

 }

 return normalizeGame(
  JSON.parse(
   JSON.stringify(initialGame)
  )
 );

}


function saveGame(){

 localStorage.setItem(
  "monEcurieV8",
  JSON.stringify(game)
 );

}


/* =====================================================
 NORMALISATION
===================================================== */

function normalizeGame(data){

 if(!data.horses)
  data.horses=[];

 if(data.day===undefined)
  data.day=1;

 if(data.year===undefined)
  data.year=1;

 if(data.marketCycle===undefined)
  data.marketCycle=0;

 data.horses.forEach(
  normalizeHorse
 );

 return data;

}


function normalizeHorse(h){

 const defaults={

  potential:60,
  realPotential:65,
  currentLevel:45,
  experience:10,

  technique:60,
  strength:60,
  endurance:60,
  regularity:60,

  mental:60,
  gentleness:60,
  calm:60,
  courage:60,
  concentration:60,
  willpower:60,
  reactivity:60,

  courseUse:60,
  competitionUse:60,
  breedingUse:60,

  winsClub:0,
  winsAmateur:0,
  winsNational:0,

  secondClub:0,
  secondAmateur:0,
  secondNational:0,

  thirdClub:0,
  thirdAmateur:0,
  thirdNational:0,

  totalCourses:0,

  championships:[],

  rationFoin:10,
  rationGrain:2,

  hoofMode:"ferré",
  hoofDay:1,

  vetDay:1,
  dentalDay:1,
  osteoDay:1

 };

 Object.keys(defaults).forEach(
  key=>{

   if(h[key]===undefined)
    h[key]=defaults[key];

  }
 );

 if(!h.father){

  h.father={
   name:"Origine inconnue",
   results:[]
  };

 }

 if(!h.mother){

  h.mother={
   name:"Origine inconnue",
   results:[]
  };

 }

 h.currentLevel=
  Math.min(
   h.currentLevel,
   h.realPotential,
   h.potential
  );

 calculateHorseValue(h);

 return h;

}

/* =====================================================
 RÉGULARITÉ
===================================================== */

function getPodiums(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational+

  h.secondClub+
  h.secondAmateur+
  h.secondNational+

  h.thirdClub+
  h.thirdAmateur+
  h.thirdNational

 );

}


function getWins(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational

 );

}


function getRegularity(h){

 if(h.totalCourses<=0)
  return 20;

 const podiumRate=
  getPodiums(h)/
  h.totalCourses;

 const winRate=
  getWins(h)/
  h.totalCourses;

 const experienceBonus=
  Math.min(
   15,
   h.experience/8
  );

 return clamp(
  Math.round(
   podiumRate*70+
   winRate*20+
   experienceBonus
  ),
  5,
  99
 );

}


/* =====================================================
 VALEUR
===================================================== */

function calculateHorseValue(h){

 const regularity=
  getRegularity(h);

 const sport=

  h.potential*0.30+
  h.currentLevel*0.18+
  h.experience*0.08+
  regularity*0.18+
  h.technique*0.08+
  h.strength*0.06+
  h.endurance*0.05+
  h.regularity*0.07;

 const mental=

  h.mental*0.20+
  h.gentleness*0.20+
  h.calm*0.16+
  h.courage*0.14+
  h.concentration*0.14+
  h.willpower*0.10+
  (100-h.reactivity)*0.06;

 const utility=

  h.courseUse*0.40+
  h.competitionUse*0.40+
  h.breedingUse*0.20;

 let ageScore=100;

 if(h.age<=8)
  ageScore=100;
 else if(h.age<=12)
  ageScore=92;
 else if(h.age<=15)
  ageScore=78;
 else if(h.age<=18)
  ageScore=60;
 else
  ageScore=38;

 const ageHealth=
  ageScore*0.55+
  h.health*0.45;

 const score=

  sport*0.45+
  mental*0.20+
  utility*0.15+
  ageHealth*0.20;

 let value=
  2500+
  Math.pow(score/100,2.7)*65000;

 if(
  h.courseUse>=90 &&
  h.gentleness>=90 &&
  h.calm>=90
 )
  value+=5000;

 if(h.breedingUse>=90)
  value+=5000;

 if(h.age>=18)
  value*=0.60;

 if(h.health<70)
  value*=0.85;

 if(h.health<50)
  value*=0.70;

 h.value=Math.round(value);

 return h.value;

}


/* =====================================================
 POTENTIEL
===================================================== */

function potentialRange(h){

 let uncertainty=4;

 if(h.age<=3)
  uncertainty=18;
 else if(h.age<=5)
  uncertainty=14;
 else if(h.age<=8)
  uncertainty=8;

 return{

  min:clamp(
   h.realPotential-uncertainty,
   40,
   99
  ),

  max:clamp(
   h.realPotential+uncertainty,
   40,
   99
  )

 };

}

function createMarketHorse(
 race,
 index,
 source
){

 const type=index%4;

 const age=
  3+
  Math.floor(
   Math.random()*15
  );

 let potential;

 if(type===0)
  potential=82+
   Math.floor(Math.random()*17);

 else if(type===1)

   Math.floor(Math.random()*25);

 else if(type===2)
  potential=70+
   Math.floor(Math.random()*25);

 else

  clamp(
   potential+

   40,

   currentLevel,

 if(type===0){

  mental=90+Math.floor(Math.random()*8);

   Math.floor(
    Math.random()*25
   ),

  place:"market",

  potential:potential,

  realPotential:realPotential,

  currentLevel:currentLevel,

  experience:
   age<=5
   ?
    5+Math.floor(Math.random()*25)
   :
    25+Math.floor(Math.random()*60),

  technique:
   clamp(
    currentLevel+
    Math.floor(Math.random()*21-10),
    40,
    99
   ),

  strength:
   50+Math.floor(Math.random()*45),

  endurance:
   50+Math.floor(Math.random()*45),

  regularity:
   45+Math.floor(Math.random()*50),

  mental:mental,
  gentleness:gentleness,
  calm:calm,

    99

    Math.floor(Math.random()*15-7),

   ),

function buyMarketHorse(
 type,
 index,
 price,
 race
){

 ensureMarket();

 let h;

 if(type==="breeding"){

  h=
   marketData.breeding[race][index];

 }
 else{

  h=
   marketData[type][index];

 }

 if(!h)return;

 if(game.money<price){

  openModal(
   "💸 Achat impossible",
   "Tu n'as pas assez d'argent."
  );

  return;

 }

 const occupied=
  game.horses.filter(
   x=>x.place==="box"
  ).length;

 if(occupied>=game.boxes){

  openModal(
   "🏠 Écurie complète",
   "Tu n'as plus de box disponible."
  );

  return;

 }

 game.money-=price;

 h.id=
  Date.now()+
  Math.floor(
   Math.random()*1000
  );

 h.place="box";

 if(type==="breeding"){

  marketData
   .breeding[race]
   .splice(index,1);

 }
 else{

  marketData[type]
   .splice(index,1);

 }

 game.horses.push(h);

 saveGame();

 openHorseBook(h.id);

}

function changeRation(
 id,
 type,
 amount
){

 const h=
  game.horses.find(
   x=>x.id==id
  );

 if(!h)return;

 if(type==="hay"){

  h.rationFoin=
   clamp(
    h.rationFoin+amount,
    4,
    20
   );

 }

 if(type==="grain"){

  h.rationGrain=
   clamp(
    h.rationGrain+amount,
    0,
    8
   );

 }

 saveGame();

 rationPage(id);

}

function hoofStatus(h){

 let text="";

 if(days<20){

  text=
   "🟢 Pieds suivis correctement.";

 }

 else if(days<35){

  text=
   "🟡 Échéance proche : prévoir le maréchal.";

 }

 else if(days<50){

  text=
   "🟠 Retard important : risque accru.";

 }

 else if(days<70){

  text=
   "🔴 Pieds très en retard : performances diminuées et risque de blessure.";

 }

 else{

  text=
   "⚠️ Situation critique : risque élevé de blessure et de boiterie.";

 }

 return `

 <div class="notice">

  <b>${h.hoofMode}</b>

  <br>

  Dernier passage :
  jour ${h.hoofDay}

  <br>

  ${days} jours depuis le dernier passage.

  <br><br>

  ${text}

 </div>

 `;

}

/* =====================================================
 ENTRAÎNEMENT
===================================================== */

function trainHorse(id){

 const h=
  game.horses.find(
   x=>x.id==id
  );

 if(!h)return;

 if(h.fatigue>=75){

  openModal(
   "😴 Cheval fatigué",
   h.name+
   " est trop fatigué."
  );

  return;

 }

 let progression=
  Math.max(
   1,
   Math.round(
    1+h.experience/35
   )
  );


 /*
 PLUS ON SE RAPPROCHE DU POTENTIEL,
 PLUS LA PROGRESSION RALENTIT.
 */

 const remaining=
  h.realPotential-h.currentLevel;

 if(remaining<=0){

  openModal(

   "🔒 Potentiel atteint",

   `

   <div class="notice">

    <b>${h.name}</b>
    a atteint son potentiel actuel.

    <br><br>

    Niveau :
    <b>${h.currentLevel}/100</b>

    <br>

    Potentiel :
    <b>${h.realPotential}/100</b>

    <br><br>

    L'entraînement ne peut plus augmenter
    directement son niveau.

   </div>

   `

  );

  return;

 }

 if(remaining<=5)
  progression=1;

 h.currentLevel=
  clamp(
   h.currentLevel+progression,
   0,
   h.realPotential
  );

 h.experience=
  clamp(
   h.experience+2,
   0,
   100
  );

 h.form=
  clamp(
   h.form+5,
   0,
   100
  );

 h.fatigue=
  clamp(
   h.fatigue+14,
   0,
   100
  );

 h.technique=
  clamp(
   h.technique+1,
   0,
   h.realPotential
  );

 h.regularity=
  clamp(
   h.regularity+1,
   0,
   100
  );

 calculateHorseValue(h);

 saveGame();

 openModal(

  "🏇 Entraînement terminé",

  `

  <div class="notice">

   <b>${h.name}</b>
   progresse.

  </div>

  Niveau :
  <b>${h.currentLevel}/100</b>

  <br>

  Potentiel maximum :
  <b>${h.realPotential}/100</b>

  <br>

  Expérience :
  <b>${h.experience}/100</b>

  `

 );

}

/* =====================================================
 JOUR
===================================================== */

function nextDay(){

 const cost=
  totalDailyFoodCost();


 if(game.money<cost){

  openModal(

   "💸 Attention",

   `

   La trésorerie ne permet plus
   de payer la nourriture quotidienne.

   <br><br>

   Coût :

   <b>${money(cost)}</b>/jour

   `

  );

  return;

 }


 game.money-=cost;

 game.day++;


 if(game.day>365){

  game.day=1;

  game.year++;

  game.horses.forEach(
   h=>h.age++
  );

 }


 game.horses.forEach(
  h=>{

   h.fatigue=
    clamp(
     h.fatigue-3,
     0,
     100
    );


   if(h.place==="pasture"){

    h.health=
     clamp(
      h.health+0.5,
      0,
      100
     );

   }


   const hoof=
    hoofDays(h);


   if(hoof>=20){

    h.form=
     clamp(
      h.form-0.15,
      0,
      100
     );

   }


   if(hoof>=35){

    h.health=
     clamp(
      h.health-0.10,
      0,
      100
     );

   }


   if(hoof>=50){

    h.form=
     clamp(
      h.form-0.25,
      0,
      100
     );

   }


   if(hoof>=70){

    h.health=
     clamp(
      h.health-0.50,
      0,
      100
     );

   }


   calculateHorseValue(h);

  }
 );


 /*
 LE MARCHÉ CHANGE AUTOMATIQUEMENT
 TOUS LES 30 JOURS.
 */

 ensureMarket();

 saveGame();

 domainPage();

}

function competition(
 level,
 cost,
 reputation
){

 const h=
  [...game.horses]
  .sort(
   (a,b)=>
    b.currentLevel-
    a.currentLevel
  )[0];

 if(!h)return;

 if(game.money<cost){

  openModal(
   "💸 Concours impossible",
   "Tu n'as pas assez d'argent."
  );

  return;

 }


 /*
 PIEDS

 Un cheval en retard de maréchal
 est plus pénalisé en compétition.
 */

 let hoofPenalty=0;

 const hoof=
  hoofDays(h);

 if(hoof>=20)
  hoofPenalty+=3;

 if(hoof>=35)
  hoofPenalty+=7;

 if(hoof>=50)
  hoofPenalty+=12;

 if(hoof>=70)
  hoofPenalty+=20;


 game.money-=cost;

 let difficulty=0;

 if(level==="Amateur")
  difficulty=12;

 if(level==="National")
  difficulty=25;


 let chance=

  h.currentLevel*0.42+
  h.experience*0.12+
  getRegularity(h)*0.24+
  h.mental*0.12+
  h.concentration*0.10-
  difficulty-
  hoofPenalty;


 chance=
  clamp(
   chance,
   3,
   95
  );


 const success=
  Math.random()*100<
  chance;


 h.totalCourses++;


 if(success){

  if(level==="Club")
   h.winsClub++;

  if(level==="Amateur")
   h.winsAmateur++;

  if(level==="National")
   h.winsNational++;

  game.money+=cost*2;

  game.reputation+=reputation;

  openModal(

   "🏆 Victoire !",

   `

   <div class="notice">

    <b>${h.name}</b>
    gagne son concours
    <b>${level}</b> !

   </div>

   ${getWins(h)}
   victoires sur
   ${h.totalCourses}
   parcours.

   `

  );

 }

 else{

  if(Math.random()<0.5){

   if(level==="Club")
    h.thirdClub++;

   if(level==="Amateur")
    h.thirdAmateur++;

   if(level==="National")
    h.thirdNational++;

  }

  openModal(

   "🏇 Concours terminé",

   `

   ${h.name}
   a participé au concours
   ${level}.

   <br><br>

   La performance n'a pas permis
   de gagner cette fois.

   `

  );

 }


 h.fatigue=
  clamp(
   h.fatigue+20,
   0,
   100
  );


 h.experience=
  clamp(
   h.experience+3,
   0,
   100
  );


 calculateHorseValue(h);

 saveGame();

}
