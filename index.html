];


/* =====================================================
 OUTILS DOM
===================================================== */

const $=id=>document.getElementById(id);

const modal=$("modal");
const modalTitle=$("modalTitle");
const modalContent=$("modalContent");
const backButton=$("backButton");

let historyStack=[];

let selectedBreed=RACES[0];

let markets={};


/* =====================================================
 OUTILS
===================================================== */

function clamp(n,a,b){
return Math.max(a,Math.min(b,n));
}

function money(n){
return Math.round(n).toLocaleString("fr-FR")+" €";
}

function random(min,max){
return Math.floor(Math.random()*(max-min+1))+min;
}

function clone(x){
return JSON.parse(JSON.stringify(x));
}

function dayOfYear(){
return ((game.day-1)%365)+1;
}

function gameDate(){

let d=new Date(2026,8,1);

d.setDate(
d.getDate()+dayOfYear()-1
);

return d.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}

function season(){

let d=dayOfYear();

if(d<=79)return "🌸 Printemps";
if(d<=171)return "☀️ Été";
if(d<=264)return "🍂 Automne";

return "❄️ Hiver";
}

function sexText(sex){

if(sex==="Jument")return "♀️ Jument";

if(sex==="Entier")return "♂️ Entier";

return "♂️ Hongre";
}


/* =====================================================
 NAVIGATION
===================================================== */

function openModal(title,html,push=true){

if(
push &&
modal.classList.contains("show")
){

historyStack.push({
title:modalTitle.innerHTML,
html:modalContent.innerHTML
});

}

modalTitle.innerHTML=title;
modalContent.innerHTML=html;

modal.classList.add("show");

backButton.style.visibility=
historyStack.length
?
"visible"
:
"hidden";

}

function closeModal(){

modal.classList.remove("show");

historyStack=[];

}

function goBack(){

if(!historyStack.length){

closeModal();

return;

}

let previous=
historyStack.pop();

modalTitle.innerHTML=
previous.title;

modalContent.innerHTML=
previous.html;

backButton.style.visibility=
historyStack.length
?
"visible"
:
"hidden";

}

modal.addEventListener(
"click",
function(e){

if(e.target===modal)
closeModal();

}
);


/* =====================================================
 PRÉNOM LIBRE
===================================================== */

function usedNames(){

return game.horses.map(
h=>String(h.name).toLowerCase()
);

}

function randomFreeName(){

let used=usedNames();

let available=
NAMES.filter(
n=>!used.includes(
n.toLowerCase()
)
);

if(!available.length){

return "Étoile";

}

return available[
Math.floor(
Math.random()*available.length
)
];

}


/* =====================================================
 CHEVAL
===================================================== */

function disciplinePotential(race,key){

let profile=
RACE_PROFILE[race]||
{cso:65,cce:65,dressage:65};

return clamp(
profile[key]+random(-10,10),
35,
99
);

}

function createHorse(
id,
name,
race,
age,
sex,
place
){

let base=
race==="OC"
?
65
:
70;

let horse={

id:id,

name:name,

race:race,

age:age,

sex:sex,

place:place,

health:94,

form:80,

fatigue:10,

experience:0,

potential:clamp(
base+random(-10,10),
40,
95
),

father:{
name:"Origines inconnues",
race:"Inconnue",
results:[]
},

mother:{
name:"Origines inconnues",
race:"Inconnue",
results:[]
},

ration:{
hay:10,
grain:3
},

hoof:{
type:"ferrure",
lastDay:1
},

vet:{
lastDay:1,
nextDay:91
},

dentist:{
lastDay:1,
nextDay:181
},

osteo:{
lastDay:1,
nextDay:121
},

disciplines:{}

};

horse.disciplines.cso={
potential:disciplinePotential(race,"cso"),
level:Math.round(disciplinePotential(race,"cso")*.45),
experience:0,
club:0,
amateur:0,
national:0,
courses:0
};

horse.disciplines.cce={
potential:disciplinePotential(race,"cce"),
level:Math.round(disciplinePotential(race,"cce")*.45),
experience:0,
club:0,
amateur:0,
national:0,
courses:0
};

horse.disciplines.dressage={
potential:disciplinePotential(race,"dressage"),
level:Math.round(disciplinePotential(race,"dressage")*.45),
experience:0,
club:0,
amateur:0,
national:0,
courses:0
};


/* éviter un cheval excellent partout */

let vals=[
horse.disciplines.cso.potential,
horse.disciplines.cce.potential,
horse.disciplines.dressage.potential
];

let high=
vals.filter(v=>v>=88).length;

if(high>=3){

horse.disciplines.dressage.potential=
Math.min(
horse.disciplines.dressage.potential,
84
);

}

return horse;

}


/* =====================================================
 PARTIE INITIALE
===================================================== */

const initialGame={

money:18450,

reputation:0,

day:1,

year:1,

boxes:6,

pastures:1,

land:1,

truckCapacity:2,

hay:1200,

grain:800,

straw:600,

horses:[]

};


/* =====================================================
 MIGRATION / CORRECTION DES ANCIENNES VERSIONS
===================================================== */

function loadGame(){

let raw=
localStorage.getItem(STORAGE);

if(!raw)
raw=localStorage.getItem("monEcurieV11");

if(!raw)
raw=localStorage.getItem("monEcurieV10");

if(!raw)
return clone(initialGame);

try{

let g=JSON.parse(raw);

g.money??=18450;
g.reputation??=0;
g.day??=1;
g.year??=1;
g.boxes??=6;
g.pastures??=1;
g.land??=1;
g.truckCapacity??=2;
g.hay??=1200;
g.grain??=800;
g.straw??=600;
g.horses??=[];

g.horses.forEach(h=>normalizeHorse(h,g));

return g;

}catch(e){

return clone(initialGame);

}

}


/* =====================================================
 NORMALISATION CHEVAUX
===================================================== */

function normalizeHorse(h,g){

h.name=
h.name||
randomFreeName();

h.race=
h.race||
"OC";

h.age=
Number.isFinite(h.age)
?
h.age
:
1;

h.sex=
h.sex||
"Hongre";

h.place=
h.place==="box"
?
"box"
:
"pasture";

h.health=
Number(h.health)||90;

h.form=
Number(h.form)||80;

h.fatigue=
Number(h.fatigue)||10;

h.experience=
Number(h.experience)||0;

h.potential=
Number(h.potential)||70;

h.ration??={
hay:10,
grain:3
};

h.hoof??={
type:"ferrure",
lastDay:g.day
};

h.vet??={
lastDay:g.day,
nextDay:g.day+90
};

h.dentist??={
lastDay:g.day,
nextDay:g.day+180
};

h.osteo??={
lastDay:g.day,
nextDay:g.day+120
};

h.father??={
name:"Origines inconnues",
race:"Inconnue",
results:[]
};

h.mother??={
name:"Origines inconnues",
race:"Inconnue",
results:[]
};


/* anciennes données */

if(
!h.disciplines||
!h.disciplines.cso||
!h.disciplines.cce||
!h.disciplines.dressage
){

let oldLevel=
Number(h.currentLevel)||40;

h.disciplines={

cso:{
potential:clamp(
Number(h.potential)||70,
35,
99
),
level:clamp(oldLevel,20,99),
experience:0,
club:0,
amateur:0,
national:0,
courses:0
},

cce:{
potential:disciplinePotential(
h.race,
"cce"
),
level:40,
experience:0,
club:0,
amateur:0,
national:0,
courses:0
},

dressage:{
potential:disciplinePotential(
h.race,
"dressage"
),
level:40,
experience:0,
club:0,
amateur:0,
national:0,
courses:0
}

};

}

}


/* =====================================================
 JEU
===================================================== */

let game=loadGame();


/* =====================================================
 SAUVEGARDE
===================================================== */

function save(){

localStorage.setItem(
STORAGE,
JSON.stringify(game)
);

render();

}

function saveManual(){

openModal(
"💾 Sauvegarde",
`
<div class="notice good">
La partie V12 est sauvegardée.
</div>
`,
false
);

/* =====================================================
 RENDU
===================================================== */

function render(){

$("dateLabel").textContent=
gameDate();

$("dayLabel").textContent=
"J"+dayOfYear()+"/365 · Année "+game.year;

$("seasonLabel").textContent=
season();

$("moneyLabel").textContent=
money(game.money);

$("repLabel").textContent=
game.reputation;

$("horseCount").textContent=
game.horses.length;

$("boxCount").textContent=
game.horses.filter(
h=>h.place==="box"
).length+
"/"+
game.boxes;

}


/* =====================================================
 VALEUR
===================================================== */

function horseValue(h){

let c=h.disciplines.cso.potential;
let e=h.disciplines.cce.potential;
let d=h.disciplines.dressage.potential;

let best=Math.max(c,e,d);

let score=
c*.35+
e*.25+
d*.20+
h.health*.10+
h.form*.10;

let v=
2500+
Math.pow(score/100,2.5)*65000;


/* OC moins cher */

if(h.race==="OC")
v*=.80;

if(h.age>=18)
v*=.55;

if(best>=92)
v*=1.12;

return Math.max(
1000,
Math.round(v)
);

}


/* =====================================================
 STAT
===================================================== */

function stat(name,value){

return `

<div class="choice">

<div class="statLine">

<span>${name}</span>

<b>${Math.round(value)}/100</b>

</div>

<div class="progress">

<span style="width:${clamp(value,0,100)}%"></span>

</div>

</div>

`;

}

"📖 Carnet de "+h.name,

`

<span class="badge">${h.race}</span>

<span class="badge">${sexText(h.sex)}</span>

<span class="badge">
${h.age===0?"🐣 Poulain":h.age+" ans"}

function compete(id,key,level,cost){

let h=
game.horses.find(
x=>String(x.id)===String(id)
);

if(!h)return;

let d=h.disciplines[key];

if(game.money<cost){

openModal(
"💸",
`
<div class="notice alert">
Pas assez d'argent.
</div>
`
);

return;

}

if(h.fatigue>=80){

openModal(
"😴",
`
<div class="notice alert">
Cheval trop fatigué.
</div>
`
);

return;

}

game.money-=cost;

h.fatigue=
clamp(
h.fatigue+20,
0,
100
);

d.courses++;

d.experience+=3;

let difficulty=
level==="Club"
?
0
:
level==="Amateur"
?
15
:
30;

let chance=
d.level*.55+
h.form*.15+
h.health*.10+
d.experience*.10+
h.age>=6
?
10
:
0;

chance-=difficulty;

chance=
clamp(
chance,
3,
95
);

if(Math.random()*100<chance){

d[level.toLowerCase()]=
(d[level.toLowerCase()]||0)+1;

game.money+=cost*2;

game.reputation+=
level==="Club"
?
2
:
level==="Amateur"
?
5
:
10;

openModal(

"🏆 Victoire !",

`

<div class="notice good">

🎉 <b>${h.name}</b>

<br>

Victoire en
${level}

<br>

Discipline :
${key.toUpperCase()}

</div>

`

);

}

else{

openModal(

"🏇 Concours terminé",

`

<div class="notice">

${h.name} termine son concours
${level} en ${key.toUpperCase()}.

</div>

`

);

}

save();

}

/* =====================================================
 NAISSANCE
===================================================== */

function createFoal(motherId,fatherId){

let mother=
game.horses.find(
h=>String(h.id)===String(motherId)
);

let father=
game.horses.find(
h=>String(h.id)===String(fatherId)
);

if(!mother||!father)return;

if(game.money<1000){

openModal(
"💸",
`
<div class="notice alert">
Il faut 1 000 € pour la reproduction.
</div>
`
);

return;

}


/* RACE */

let foalRace=
mother.race===father.race
?
mother.race
:
"OC";


/* sexe */

let sex=
Math.random()<.5
?
"Jument"
:
"Entier";


let foal=
createHorse(
"foal_"+Date.now(),
"",
foalRace,
0,
sex,
"pasture"
);


/* génétique */

["cso","cce","dressage"].forEach(key=>{

let a=
mother.disciplines[key].potential;

let b=
father.disciplines[key].potential;

foal.disciplines[key].potential=
clamp(
Math.round(
(a+b)/2+
random(-6,6)
),
35,
99
);

foal.disciplines[key].level=20;

});


/* éviter l'excellent partout */

let high=
["cso","cce","dressage"]
.filter(
key=>
foal.disciplines[key].potential>=90
);

if(high.length>=3){

let weakest=
["cso","cce","dressage"]
.sort(
(a,b)=>
foal.disciplines[a].potential-
foal.disciplines[b].potential
)[0];

foal.disciplines[weakest].potential=
Math.min(
84,
foal.disciplines[weakest].potential
);

}


/* origines */

foal.father={
name:father.name,
race:father.race,
results:[
"CSO : "+father.disciplines.cso.potential,
"CCE : "+father.disciplines.cce.potential,
"Dressage : "+father.disciplines.dressage.potential
]
};

foal.mother={
name:mother.name,
race:mother.race,
results:[
"CSO : "+mother.disciplines.cso.potential,
"CCE : "+mother.disciplines.cce.potential,
"Dressage : "+mother.disciplines.dressage.potential
]
};


/* IMPORTANT :
   le prénom est choisi maintenant */

openModal(

"🐣 Naissance",

`

<div class="notice good">

🎉 Le poulain est né !

</div>

<div class="card">

<b>Race :</b>
${foal.race}

<br>

<b>Sexe :</b>
${sexText(foal.sex)}

<br><br>

🧬 Père :
${father.name}

<br>
${father.race}

<br><br>

🧬 Mère :
${mother.name}

<br>
${mother.race}

</div>


${
foal.race==="OC"
?
`
<div class="notice">

🧬 <b>OC</b>

<br>

Les deux parents sont de races différentes.

<br>

💰 Sa valeur sera inférieure à celle d'un cheval de race pure.

</div>
`
:
""
}


<label>
✍️ Choisir le prénom du poulain
</label>

<input
id="foalNameInput"
class="input"
maxlength="25"
placeholder="Prénom"
>

<button class="primary"
onclick="finishFoal('${foal.id}','${mother.id}','${father.id}')">

🐣 Donner ce prénom au poulain

</button>

`

);

}


/* =====================================================
 FINALISATION POULAIN
===================================================== */

function finishFoal(foalId,motherId,fatherId){

let name=
$("foalNameInput").value.trim();

if(!name){

openModal(
"✍️ Prénom obligatoire",
`
<div class="notice alert">
Tu dois choisir un prénom pour le poulain.
</div>
`
);

return;

}

let duplicate=
game.horses.some(
h=>
h.name.toLowerCase()===
name.toLowerCase()
);

if(duplicate){

openModal(
"✍️ Prénom déjà utilisé",
`
<div class="notice alert">
Ce prénom est déjà utilisé par un autre cheval.
<br><br>
Choisis un autre prénom.
</div>
`
);

return;

}


/* retrouver le poulain */

let mother=
game.horses.find(
h=>String(h.id)===String(motherId)
);

let father=
game.horses.find(
h=>String(h.id)===String(fatherId)
);


/* recréer proprement */

let foal=
createHorse(
foalId,
name,
mother.race===father.race
?
mother.race
:
"OC",
0,
Math.random()<.5
?
"Jument"
:
"Entier",
"pasture"
);

foal.father={
name:father.name,
race:father.race,
results:[]
};

foal.mother={
name:mother.name,
race:mother.race,
results:[]
};


/* génétique */

["cso","cce","dressage"].forEach(key=>{

foal.disciplines[key].potential=
clamp(
Math.round(
(
mother.disciplines[key].potential+
father.disciplines[key].potential
)/2+
random(-6,6)
),
35,
99
);

foal.disciplines[key].level=20;

});


game.money-=1000;

game.horses.push(foal);

save();

horseBook(foal.id);

}

/* =====================================================
 MARCHÉ
===================================================== */

function generateMarket(race,count){

let list=[];

for(let i=0;i<count;i++){

let h=
createHorse(
"market_"+Date.now()+"_"+Math.random(),
randomFreeMarketName(),
race,
random(3,16),
Math.random()<.5
?
"Jument"
:
"Hongre",
"market"
);

h.disciplines.cso.potential=
clamp(
RACE_PROFILE[race].cso+random(-8,8),
35,
99
);

h.disciplines.cce.potential=
clamp(
RACE_PROFILE[race].cce+random(-8,8),
35,
99
);

h.disciplines.dressage.potential=
clamp(
RACE_PROFILE[race].dressage+random(-8,8),
35,
99
);


/* niveau cohérent */

["cso","cce","dressage"].forEach(k=>{

h.disciplines[k].level=
clamp(
Math.round(
h.disciplines[k].potential*
random(35,65)/100
),
20,
h.disciplines[k].potential
);

});

list.push(h);

}

return list;

}


function randomFreeMarketName(){

let names=
NAMES.slice();

for(let i=names.length-1;i>0;i--){

let j=
Math.floor(Math.random()*(i+1));

[names[i],names[j]]=
[names[j],names[i]];

}

return names[0];

}


function marketEnsure(type){

let month=
Math.floor(
(dayOfYear()-1)/30
);

if(
!markets[type]||
markets[type].month!==month||
markets[type].year!==game.year
){

markets[type]={
month:month,
year:game.year
};

if(type==="breeding"){

markets[type].breeds={};

RACES.forEach(race=>{

markets[type].breeds[race]=
generateMarket(race,7);

});

}

else{

markets[type].horses=
generateMarket(
RACES[random(0,RACES.length-1)],
14
);

}

}

}

function marketCard(h,type,index){

let price=
horseValue(h);

if(type==="merchant")
price=Math.round(price*1.08);

if(type==="auction")
price=Math.round(price*.55);

return `

${h.race}
</span>

<span class="badge">
${sexText(h.sex)}
</span>

<span class="badge">
${h.age} ans
</span>

<br><br>

🏇 CSO :
${h.disciplines.cso.potential}

<br>

🌳 CCE :
${h.disciplines.cce.potential}

<br>

💃 Dressage :
${h.disciplines.dressage.potential}

<div class="notice">

💰 <span class="value">
${money(price)}
</span>

</div>

<button class="primary"
onclick="marketDetails('${type}',${index})">

📖 Voir le carnet

</button>

<button class="primary"
onclick="buyMarket('${type}',${index},${price})">

${type==="auction"
?
"🔨 Acheter aux enchères"
:
"💰 Acheter"}

</button>

</div>

`;

}


function getMarket(type,index){

if(type==="breeding"){

return markets.breeding

}

return markets[type].horses[index];

}

);

function buyMarket(type,index,price){

let h=
getMarket(type,index);

if(!h)return;

if(game.money<price){

openModal(
"💸",
`
<div class="notice alert">
Pas assez d'argent.
</div>
`
);

return;

}

let occupied=
game.horses.filter(
x=>x.place==="box"
).length;

if(occupied>=game.boxes){

openModal(
"🏠 Boxes complets",
`
<div class="notice alert">
Plus de box disponible.
</div>
`
);

return;

}

game.money-=price;

h.id=
"owned_"+Date.now()+"_"+Math.random();

h.place="box";

game.horses.push(h);

if(type==="breeding"){

markets.breeding
.breeds[selectedBreed]
.splice(index,1);

}
else{

markets[type]
.horses.splice(index,1);

}

save();

horseBook(h.id);

}

/* =====================================================
 JOUR SUIVANT
===================================================== */

function nextDay(){

game.money-=350;

game.day++;

if(dayOfYear()===1)
game.year++;


game.horses.forEach(h=>{

h.fatigue=
clamp(
h.fatigue-
(
h.place==="pasture"
?
10
:
7
),
0,
100
);

h.form=
clamp(
h.form+1,
0,
100
);

if(h.place==="pasture"){

h.health=
clamp(
h.health+1,
0,
100
);

}


/* alimentation */

game.hay=
Math.max(
0,
game.hay-h.ration.hay
);

game.grain=
Math.max(
0,
game.grain-h.ration.grain
);

game.straw=
Math.max(
0,
game.straw-.5
);


/* manque nourriture */

if(
game.hay<=0||
game.grain<=0
){

h.health=
clamp(
h.health-1,
0,
100
);

h.form=
clamp(
h.form-1,
0,
100
);

}

});

save();

}
