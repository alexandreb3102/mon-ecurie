function normalizeHorse(h){

const nums=[

"potential",
"current",
"experience",
"technique",
"force",
"endurance",

"mental",
"gentillesse",
"calme",
"courage",
"concentration",
"volonte",

"utilityCourse",
"utilityCompetition",
"utilityBreeding",

"health",
"form"

];

nums.forEach(k=>{

if(typeof h[k]!=="number")
h[k]=60;

});

h.current=Math.max(
0,
Math.min(
h.current,
h.potential
)
);

h.courses=h.courses||0;

[
"winsClub",
"winsAmateur",
"winsNational",

"secondClub",
"secondAmateur",
"secondNational",

"thirdClub",
"thirdAmateur",
"thirdNational"

].forEach(k=>{
h[k]=h[k]||0;
});

h.championships=
h.championships||[];

h.fatigue=
h.fatigue||0;

h.rider=
h.rider||{
name:"Alexandre",
level:62
};

h.health=
Math.max(
0,
Math.min(100,h.health)
);

}


/* =========================================================
   CALCULS
========================================================= */

function wins(h){

return h.winsClub+
h.winsAmateur+
h.winsNational;

}


function podiums(h){

return wins(h)+

h.secondClub+
h.secondAmateur+
h.secondNational+

h.thirdClub+
h.thirdAmateur+
h.thirdNational;

}


function regularity(h){

if(!h.courses)
return 15;

const p=
podiums(h)/h.courses;

const w=
wins(h)/h.courses;

return Math.round(

Math.max(

5,

Math.min(

99,

p*65+
w*25+
(h.experience||0)*.1

)

)

);

}


/*

45 % SPORT
20 % MENTAL
15 % UTILITÉ
20 % ÂGE + SANTÉ

*/

function horseValue(h){

const sport=

h.potential*.30+
h.current*.20+
h.experience*.10+
regularity(h)*.20+
h.technique*.08+
h.force*.06+
h.endurance*.06;


const mental=

h.mental*.20+
h.gentillesse*.20+
h.calme*.17+
h.courage*.14+
h.concentration*.16+
h.volonte*.13;


const utility=

h.utilityCourse*.40+
h.utilityCompetition*.40+
h.utilityBreeding*.20;


let ageScore=

h.age<=7
?100
:h.age<=10
?94
:h.age<=13
?84
:h.age<=16
?68
:45;


const ageHealth=
ageScore*.55+
h.health*.45;


let value=

2500+

Math.pow(

(
sport*.45+
mental*.20+
utility*.15+
ageHealth*.20

)/100,

2.65

)*65000;


if(
h.utilityCourse>=90 &&
h.gentillesse>=90 &&
h.calme>=90
)
value+=5000;


if(
h.age>=16 &&
wins(h)<3
)
value*=.72;


if(h.health<70)
value*=.82;


if(h.health<50)
value*=.65;


return Math.round(value);

}


function potentialRange(h){

let margin=

h.age<=3
?18
:h.age<=5
?14
:h.age<=8
?9
:6;


return{

min:Math.max(
40,
h.potential-margin
),

max:Math.min(
99,
h.potential+margin
)

};

}


function euro(n){

return Math.round(n)
.toLocaleString("fr-FR")
+" €";

/* =========================================================
   CAVALIER + ENTRAÎNEMENT
========================================================= */

function riderFactor(h){

return h.rider &&
typeof h.rider.level==="number"

?

h.rider.level

:

50;

}


function train(id){

const h=
game.horses.find(
x=>x.id===id
);

if(!h)return;


if(
h.fatigue>=75
){

return openModal(

"😴 Fatigue",

"Ce cheval est trop fatigué pour un nouvel entraînement."

);

}


const before=
h.current;


const gain=

Math.max(

1,

Math.round(

1+
h.experience/35+
(riderFactor(h)-50)/40

)

);


h.current=
Math.min(
h.potential,
h.current+gain
);


h.experience=
Math.min(
100,
h.experience+2
);


h.technique=
Math.min(
h.potential,
h.technique+
(riderFactor(h)>=60?1:0)
);


h.form=
Math.min(
100,
h.form+4
);


h.fatigue=
Math.min(
100,
h.fatigue+15
);


save();


openModal(

"🏇 Entraînement",

`

<div class="notice">

<b>${h.name}</b>
a travaillé.

<br><br>

Niveau :

<b>
${before} → ${h.current}
</b>

<br>

<b>
${h.potential}
</b>

<br>

<b>
${h.experience}/100
</b>

<br>

Cavalier :

<b>
${riderFactor(h)}/100
</b>

</div>

class="btn"
onclick="book(${h.id})">

📖 Retour au carnet

</button>

`

);

}

function competitionCard(level,cost){

return`

<div class="horseCard">

<b>
${level}
</b>

<div class="muted">

Frais d'engagement :
${euro(cost)}

</div>


${game.horses.map(h=>`

<button
class="btn secondary"
onclick="runCompetition(${h.id},'${level}',${cost})">

${h.name}

· cheval ${h.current}

· cavalier ${riderFactor(h)}

</button>

`).join("")}

</div>

`;

}


function qualifies(h,level){

if(
level==="Club"
)
return
h.current>=45 &&
riderFactor(h)>=35;


if(
level==="Amateur"
)
return
h.current>=62 &&
riderFactor(h)>=55;


return
h.current>=75 &&
riderFactor(h)>=70;

}


function runCompetition(
id,
level,
cost
){

const h=
game.horses.find(
x=>x.id===id
);

if(!h)return;


if(
game.money<cost
){

return openModal(

"💸 Concours impossible",

"Tu n'as pas assez d'argent."

);

}


if(
!qualifies(h,level)
){

return openModal(

"❌ Niveau insuffisant",

`

Le couple
<b>${h.name}</b>
/
cavalier

n'a pas encore le niveau requis pour cette épreuve
${level}.

`

);

}


game.money-=cost;


const difficulty=

level==="Club"

?

0

:

level==="Amateur"

?

12

:

25;


let chance=

h.current*.35+
riderFactor(h)*.18+
regularity(h)*.20+
h.mental*.10+
h.concentration*.07+
h.form*.10-
h.fatigue*.08-
difficulty;


chance=
Math.max(
3,
Math.min(
95,
chance
)
);


const roll=
Math.random()*100;


h.courses++;


h.fatigue=
Math.min(
100,
h.fatigue+20
);


h.experience=
Math.min(
100,
h.experience+3
);


let message="";


if(
roll<
chance*.55
){

if(level==="Club")
h.winsClub++;

if(level==="Amateur")
h.winsAmateur++;

if(level==="National")
h.winsNational++;


game.reputation+=

level==="National"
?10
:level==="Amateur"
?5
:2;


game.money+=
cost*2;


message=`

🥇
<b>
Victoire !
</b>

<br><br>

${h.name}
remporte l'épreuve
${level}.

`;

}


else if(
roll<chance
){

if(level==="Club")
h.secondClub++;

if(level==="Amateur")
h.secondAmateur++;

if(level==="National")
h.secondNational++;


game.reputation++;


message=`

🥈
<b>
Deuxième place
</b>

<br><br>

${h.name}
réalise un très bon résultat.

`;

}


else{

if(
Math.random()<.5
){

if(level==="Club")
h.thirdClub++;

if(level==="Amateur")
h.thirdAmateur++;

if(level==="National")
h.thirdNational++;

}


message=`

🏇
<b>
Concours terminé
</b>

<br><br>

${h.name}
n'a pas réussi à se placer cette fois.

`;

}


save();


openModal(

"🏆 Résultat",

`

<div class="notice">

${message}

</div>


<div class="result">

Niveau :

<b>
${h.current}/100
</b>

<br>

Régularité :

<b>
${regularity(h)}/100
</b>

<br>

Parcours :

<b>
${h.courses}
</b>

</div>


<button
class="btn"
onclick="book(${h.id})">

📖 Voir le carnet

</button>

`

);

}
