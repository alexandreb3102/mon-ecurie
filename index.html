<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Mon Écurie V6</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#07170d;
font-family:Arial,sans-serif;
}

body{
display:flex;
justify-content:center;
}

#app{
position:relative;
width:100%;
max-width:430px;
min-height:100vh;
overflow:hidden;
background:#111;
}

/* =========================
   MAQUETTE V6
========================= */

#screen{
position:relative;
width:100%;
aspect-ratio:853 / 1844;
background-image:url("v6-maquette.jpg");
background-size:100% 100%;
background-position:center;
background-repeat:no-repeat;
}

/* =========================
   ZONES TACTILES
========================= */

.hit{
position:absolute;
border:0;
background:transparent;
border-radius:18px;
cursor:pointer;
-webkit-appearance:none;
}

.hit:active{
background:rgba(255,255,255,.12);
}

/* ACTIONS */

#weekBtn{
left:2.5%;
top:43%;
width:18%;
height:11%;
}

#hayBtn{
left:21%;
top:43%;
width:18%;
height:11%;
}

#grainBtn{
left:40%;
top:43%;
width:18%;
height:11%;
}

#careBtn{
left:59%;
top:43%;
width:18%;
height:11%;
}

#showBtn{
left:78%;
top:43%;
width:19%;
height:11%;
}

/* CHEVAUX */

#horse1{
left:3%;
top:57%;
width:23%;
height:12%;
}

#horse2{
left:27%;
top:57%;
width:23%;
height:12%;
}

#horse3{
left:51%;
top:57%;
width:23%;
height:12%;
}

#horse4{
left:75%;
top:57%;
width:22%;
height:12%;
}

/* MENU BAS */

#domain{
left:2%;
bottom:0;
width:18%;
height:8%;
}

#stable{
left:21%;
bottom:0;
width:18%;
height:8%;
}

#horses{
left:40%;
bottom:0;
width:18%;
height:8%;
}

#shows{
left:59%;
bottom:0;
width:18%;
height:8%;
}

#care{
left:78%;
bottom:0;
width:19%;
height:8%;
}

/* =========================
   FENÊTRE
========================= */

#modal{
position:fixed;
inset:0;

display:none;

align-items:center;
justify-content:center;

padding:20px;

background:rgba(0,0,0,.72);

z-index:1000;
}

#modal.show{
display:flex;
}

.modalBox{
width:min(390px,92vw);

padding:22px;

border-radius:22px;

background:
linear-gradient(
145deg,
#f8f1df,
#dfe8d7
);

color:#294b38;

box-shadow:
0 20px 60px #000b;

border:2px solid #b99d5b;
}

.modalBox h2{
margin:0 0 12px;

font-family:Georgia,serif;

font-size:25px;
}

.modalBox p{
line-height:1.5;
margin:0;
}

.modalBox button{
width:100%;

margin-top:18px;

padding:14px;

border:0;

border-radius:13px;

background:#315f3c;

color:white;

font-weight:800;

font-size:16px;
}

/* =========================
   PETITS ECRANS
========================= */

@media(max-width:350px){

#app{
max-width:100%;
}

}

</style>
</head>

<body>

<div id="app">

<div id="screen">

<!-- ACTIONS -->

<button
class="hit"
id="weekBtn"
aria-label="Passer une semaine">
</button>

<button
class="hit"
id="hayBtn"
aria-label="Acheter du foin">
</button>

<button
class="hit"
id="grainBtn"
aria-label="Acheter du grain">
</button>

<button
class="hit"
id="careBtn"
aria-label="S'occuper d'un cheval">
</button>

<button
class="hit"
id="showBtn"
aria-label="Voir les concours">
</button>


<!-- CHEVAUX -->

<button
class="hit"
id="horse1"
aria-label="Luna">
</button>

<button
class="hit"
id="horse2"
aria-label="Caramel">
</button>

<button
class="hit"
id="horse3"
aria-label="Jasper">
</button>

<button
class="hit"
id="horse4"
aria-label="Étoile">
</button>


<!-- MENU -->

<button
class="hit"
id="domain"
aria-label="Domaine">
</button>

<button
class="hit"
id="stable"
aria-label="Écurie">
</button>

<button
class="hit"
id="horses"
aria-label="Chevaux">
</button>

<button
class="hit"
id="shows"
aria-label="Concours">
</button>

<button
class="hit"
id="care"
aria-label="Soins">
</button>

</div>


<!-- MODAL -->

<div id="modal">

<div class="modalBox">

<h2 id="modalTitle">
Mon Écurie
</h2>

<p id="modalText">
</p>

<button onclick="closeModal()">
Fermer
</button>

</div>

</div>

</div>


<script>

/* =========================
   DONNEES
========================= */

const actions={

weekBtn:[
"Passer une semaine",
"Une semaine est passée. La gestion complète sera reliée à cette interface."
],

hayBtn:[
"Acheter du foin",
"+500 kg de foin pour 250 €."
],

grainBtn:[
"Acheter du grain",
"+300 kg de grain pour 180 €."
],

careBtn:[
"S'occuper d'un cheval",
"Choisis le cheval que tu souhaites soigner ou entraîner."
],

showBtn:[
"Concours",
"Les prochaines épreuves seront bientôt disponibles."
],

horse1:[
"Luna",
"Selle Français · 8 ans · Jument · Box"
],

horse2:[
"Caramel",
"Anglo-Arabe · 12 ans · Hongre · Box"
],

horse3:[
"Jasper",
"Quarter Horse · 6 ans · Hongre · Pré"
],

horse4:[
"Étoile",
"Connemara · 4 ans · Jument · Pré"
],

domain:[
"Domaine",
"Tu es actuellement sur le domaine."
],

stable:[
"Écurie",
"Ouverture de l'écurie."
],

horses:[
"Chevaux",
"Ouverture du carnet des chevaux."
],

shows:[
"Concours",
"Ouverture des concours."
],

care:[
"Soins",
"Ouverture des soins."
]

};


/* =========================
   MODAL
========================= */

const modal=
document.getElementById("modal");

const title=
document.getElementById("modalTitle");

const text=
document.getElementById("modalText");


function openModal(t,p){

title.textContent=t;

text.textContent=p;

modal.classList.add("show");

}


function closeModal(){

modal.classList.remove("show");

}


/* =========================
   BOUTONS
========================= */

Object.entries(actions).forEach(

([id,value])=>{

const button=
document.getElementById(id);

if(!button)return;

button.addEventListener(
"click",
()=>{

openModal(
value[0],
value[1]
);

}
);

}

);


/* =========================
   FERMETURE
========================= */

modal.addEventListener(
"click",
event=>{

if(event.target===modal){

closeModal();

}

}
);

</script>

</body>
</html>
