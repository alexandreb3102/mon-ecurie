<html lang="fr">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07170d;
font-family:Arial,sans-serif;
color:#294b38
}
#app{
max-width:430px;
margin:auto;
min-height:100vh;
background:#edf0e8
}
header{
background:linear-gradient(145deg,#173b25,#315f3c);
color:white;
padding:14px;
position:sticky;
top:0;
z-index:20
}
h1{
font-family:Georgia,serif;
margin:0 0 8px
}
.header{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:5px
}
.header div{
background:#ffffff18;
padding:7px;
border-radius:10px;
text-align:center;
font-size:11px
}
main{
padding:10px 10px 85px
}
.title{
background:linear-gradient(90deg,#315f3c,#6d8c59);
color:white;
font:bold 18px Georgia;
padding:9px;
border-radius:12px;
margin:12px 0 8px
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px
}
button{
font-weight:bold;
cursor:pointer
}
.menu{
min-height:65px;
border:1px solid #c9d3c4;
border-radius:14px;
background:linear-gradient(145deg,#fffaf0,#dce8d4);
color:#294b38
}
.primary{
width:100%;
border:0;
border-radius:11px;
padding:11px;
background:#315f3c;
color:white;
margin-top:7px
}
.secondary{
width:100%;
border:0;
border-radius:11px;
padding:10px;
background:#d9e3d4;
color:#294b38;
margin-top:6px
}
.card,.choice,.notice{
background:white;
border:1px solid #d2dbce;
border-radius:14px;
padding:11px;
margin:7px 0
}
.notice{
background:#fff9e8
}
.alert{
background:#fff0e8
}
.good{
background:#edf7ea
}
.badge{
display:inline-block;
background:#dfe8d7;
padding:4px 7px;
border-radius:8px;
font-size:11px;
font-weight:bold;
margin:2px
}
.progress{
height:8px;
background:#d5dbd0;
border-radius:10px;
overflow:hidden
}
.progress span{
display:block;
height:100%;
background:#5d8b5e
}
.statline{
display:flex;
justify-content:space-between;
margin:6px 0
}
.input{
width:100%;
padding:10px;
border:1px solid #c7d1c1;
border-radius:10px
}
.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:7px
}
.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:10px;
z-index:100
}
.modal.show{
display:flex
}
.modalbox{
width:min(410px,95vw);
max-height:92vh;
overflow:auto;
background:#f4f0df;
border-radius:20px;
padding:15px
}
.modalhead{
display:flex;
align-items:center;
gap:7px;
margin-bottom:10px
}
.modalhead h2{
font:700 21px Georgia;
margin:0;
flex:1
}
.back,.close{
border:0;
border-radius:9px;
padding:8px 11px
}
.back{
background:#315f3c;
color:white
}
.close{
background:#d5d1c5
}
.bottom{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(430px,100%);
display:grid;
grid-template-columns:repeat(5,1fr);
background:#173b25;
padding:5px;
z-index:50
}
.bottom button{
border:0;
background:#315f3c;
color:white;
border-radius:8px;
padding:7px 2px;
font-size:10px
}
</style>
</head>

<script>

const STORAGE="monEcurieV11";


/* =====================================================
 RACES
===================================================== */

const RACES=[

"Selle Français",
"KWPN",
"Anglo-Arabe",
"Connemara",
"Poney Français de Selle",
"Hanovrien",
"Oldenbourg",
"Quarter Horse",
"Lusitanien",
"Frison"

];


/* =====================================================
 GRAND STOCK DE PRÉNOMS
===================================================== */

const PRENOMS=[

"Amande","Amiral","Apache","Aria","Atlas","Aurore",
"Azur","Babylon","Baladin","Bambou","Bandit",
"Belle Étoile","Biscotte","Black Pearl","Blue Moon",
"Bonnie","Brume","Calypso","Cannelle","Caramel",
"Céleste","Chance","Charly","Chimère","Cobalt",
"Comète","Cookie","Cosmos","Django","Dolce",
"Dream","Éclipse","Éden","Émeraude","Étoile",
"Fantôme","Fidji","Flamme","Fleur","Galaxie",
"Gatsby","Ginger","Harmonie","Havana","Hélios",
"Hermès","Horizon","Icare","Indigo","Jazz",
"Joker","Joy","Jupiter","Karma","Lagon",
"Légende","Liberty","Lilas","Loki","Lucky",
"Luna","Maestro","Mango","Marley","Marvel",
"Mélodie","Mercure","Merlin","Mistral","Mystère",
"Nala","Némo","Nébuleuse","Nikita","Nova",
"Nuage","Océane","Opale","Orage","Orphée",
"Oscar","Osiris","Panache","Paris","Pearl",
"Phoenix","Pirate","Plume","Praline","Prince",
"Princesse","Quartz","Quasar","Rêve","Rivière",
"Roméo","Royal","Saphir","Shadow","Shaman",
"Sirocco","Solstice","Spirit","Stella","Storm",
"Sultan","Sunshine","Tango","Toscane","Tonnerre",
"Topaze","Trésor","Ulysse","Valentino","Velours",
"Venise","Vénus","Victoire","Volt","Willow",
"Xéna","Yoko","Zéphyr","Zigzag"

];


/* =====================================================
 RACES : TENDANCES RÉALISTES
===================================================== */

const RACE_PROFILE={

"Selle Français":
{cso:90,cce:78,dressage:67},

"KWPN":
{cso:88,cce:72,dressage:88},

"Anglo-Arabe":
{cso:78,cce:90,dressage:72},

"Connemara":
{cso:78,cce:75,dressage:65},

"Poney Français de Selle":
{cso:82,cce:76,dressage:68},

"Hanovrien":
{cso:78,cce:68,dressage:91},

"Oldenbourg":
{cso:82,cce:65,dressage:90},

"Quarter Horse":
{cso:62,cce:67,dressage:58},

"Lusitanien":
{cso:60,cce:65,dressage:92},

"Frison":
{cso:45,cce:50,dressage:82}

};


/* =====================================================
 NAVIGATION
===================================================== */

let navigation=[];

function openPage(title,html){

if(
modal.classList.contains("show") &&
modalContent.innerHTML
){

navigation.push({

title:modalTitle.textContent,

html:modalContent.innerHTML

});

}

modalTitle.textContent=title;

modalContent.innerHTML=html;

modal.classList.add("show");

backButton.style.visibility=
navigation.length
?"visible"
:"hidden";

}


function closeModal(){

modal.classList.remove("show");

navigation=[];

}


function goBack(){

if(!navigation.length){

closeModal();

return;

}

let p=
navigation.pop();

modalTitle.textContent=p.title;

modalContent.innerHTML=p.html;

backButton.style.visibility=
navigation.length
?"visible"
:"hidden";

}


/* =====================================================
 OUTILS
===================================================== */

function clamp(n,min,max){

return Math.max(
min,
Math.min(max,n)
);

}


function money(n){

return Math.round(n)
.toLocaleString("fr-FR")+" €";

}


function dayOfYear(){

return ((game.day-1)%365)+1;

}


function dateGame(){

let d=
new Date(2026,8,1);

d.setDate(
d.getDate()+dayOfYear()-1
);

return d.toLocaleDateString(
"fr-FR",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

}


function season(){

let d=dayOfYear();

if(d<=79)
return "🌸 Printemps";

if(d<=171)
return "☀️ Été";

if(d<=264)
return "🍂 Automne";

return "❄️ Hiver";

}


/* =====================================================
 CHEVAL
===================================================== */

function createHorse(
id,
name,
race,
age,
sex,
base,
place
){

let profile=
RACE_PROFILE[race]||
{
cso:65,
cce:65,
dressage:65
};

function individual(v){

return clamp(
Math.round(
v+(Math.random()*20-10)
),
35,
99
);

}

return {

id:id,

name:name,

race:race,

age:age,

sex:sex,

place:place,

health:94,

form:80,

fatigue:10,

experience:0,

potential:individual(base),

disciplines:{

cso:{
potential:individual(profile.cso),
level:Math.max(20,Math.round(profile.cso*.45)),
experience:0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
},

cce:{
potential:individual(profile.cce),
level:Math.max(20,Math.round(profile.cce*.45)),
experience:0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
},

dressage:{
potential:individual(profile.dressage),
level:Math.max(20,Math.round(profile.dressage*.45)),
experience:0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
}

},

father:{
name:"Origine inconnue",
race:"Inconnue",
results:[]
},

mother:{
name:"Origine inconnue",
race:"Inconnue",
results:[]
},

ration:{
hay:10,
grain:3
},

hoof:{
type:"ferrure",
lastDay:1
},

vet:{
lastDay:1,
nextDay:91
},

dentist:{
lastDay:1,
nextDay:181
},

osteo:{
lastDay:1,
nextDay:121
}

};

}


/* =====================================================
 PARTIE INITIALE
===================================================== */

const initialGame={

money:18450,

reputation:0,

day:1,

year:1,

boxes:6,

pastures:1,

land:1,

truckCapacity:2,

hay:1200,

grain:800,

straw:600,

horses:[

createHorse(
1,
"Luna",
"Selle Français",
8,
"Jument",
86,
"box"
),

createHorse(
2,
"Caramel",
"Anglo-Arabe",
12,
"Hongre",
74,
"box"
),

createHorse(
3,
"Jasper",
"Quarter Horse",
6,
"Hongre",
81,
"pasture"
),

createHorse(
4,
"Étoile",
"Connemara",
4,
"Jument",
73,
"pasture"
)

]

};


/* =====================================================
 MIGRATION V10
===================================================== */

function migrate(){

let saved=
localStorage.getItem(
"monEcurieV10"
);

if(!saved){

return initialGame;

}

try{

let old=
JSON.parse(saved);

old.money??=18450;
old.reputation??=0;
old.day??=1;
old.year??=1;
old.boxes??=6;
old.pastures??=1;
old.land??=1;
old.truckCapacity??=2;
old.hay??=1200;
old.grain??=800;
old.straw??=600;

old.horses??=[];

old.horses.forEach(h=>{

h.name??="Sans nom";

h.race??="OC";

h.sex??="Hongre";

h.place??="pasture";

h.health??=90;

h.form??=80;

h.fatigue??=10;

h.experience??=0;

h.ration??={
hay:10,
grain:3
};

h.hoof??={
type:"ferrure",
lastDay:old.day
};

h.vet??={
lastDay:old.day,
nextDay:old.day+90
};

h.dentist??={
lastDay:old.day,
nextDay:old.day+180
};

h.osteo??={
lastDay:old.day,
nextDay:old.day+120
};


/* nouvelles disciplines */

if(!h.disciplines){

let profile=
RACE_PROFILE[h.race]||
{
cso:65,
cce:65,
dressage:65
};

h.disciplines={

cso:{
potential:clamp(
h.potential||profile.cso,
35,
99
),
level:h.currentLevel||40,
experience:h.experience||0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
},

cce:{
potential:profile.cce,
level:Math.max(
20,
Math.round(profile.cce*.45)
),
experience:0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
},

dressage:{
potential:profile.dressage,
level:Math.max(
20,
Math.round(profile.dressage*.45)
),
experience:0,
winsClub:0,
winsAmateur:0,
winsNational:0,
courses:0
}

};

}

h.father??={
name:"Origine inconnue",
race:"Inconnue",
results:[]
};

h.mother??={
name:"Origine inconnue",
race:"Inconnue",
results:[]
};

});

return old;

}catch(e){

return initialGame;

}

}


let game=migrate();

let selectedBreed=RACES[0];

let markets={};

let pendingFoal=null;


/* =====================================================
 SAUVEGARDE
===================================================== */

function save(){

localStorage.setItem(
STORAGE,
JSON.stringify(game)
);

render();

}


function saveGame(){

save();

openPage(
"💾 Sauvegarde",
`
<div class="notice good">
La partie V11 a été sauvegardée.
</div>
`
);

}


/* =====================================================
 RENDU
===================================================== */

function render(){

date.textContent=
dateGame();

jour.textContent=
"J"+dayOfYear()+"/365 · Année "+game.year;

saison.textContent=
season();

argent.textContent=
money(game.money);

reputation.textContent=
game.reputation;

nombre.textContent=
game.horses.length;

boxes.textContent=
game.horses.filter(
h=>h.place==="box"
).length+
"/"+
game.boxes;

}


/* =====================================================
 SEXE
===================================================== */

function sexText(sex){

if(sex==="Jument")
return "♀️ Jument";

if(sex==="Hongre")
return "♂️ Hongre";

return "♂️ Entier";

}


/* =====================================================
 VALEUR
===================================================== */

function horseValue(h){

let c=
h.disciplines.cso.potential;

let e=
h.disciplines.cce.potential;

let d=
h.disciplines.dressage.potential;

let score=
c*.35+
e*.25+
d*.20+
h.health*.10+
h.form*.10;

let v=
2500+
Math.pow(
score/100,
2.5
)*65000;


/* OC -20 % */

if(h.race==="OC"){

v*=.80;

}


/* âge */

if(h.age>=18){

v*=.55;

}

return Math.max(
1000,
Math.round(v)
);

}


/* =====================================================
 STAT
===================================================== */

function stat(label,value){

return `

<div class="choice">

<div class="statline">

<span>${label}</span>

<b>${Math.round(value)}/100</b>

</div>

<div class="progress">

<span style="width:${clamp(value,0,100)}%"></span>

</div>

</div>

`;

}


/* =====================================================
 MES CHEVAUX
===================================================== */

function horsesPage(){

openPage(

"🐴 Mes chevaux",

game.horses.map(

h=>`

<div class="card">

<span class="badge">
${h.race}
</span>

<span class="badge">
${sexText(h.sex)}
</span>

<span class="badge">
${h.age===0?"🐣 Poulain":h.age+" ans"}

<span class="badge">
${h.place==="box"?"🏠 Box":"🌳 Pré"}
</span>

<h3>
${h.name}
</h3>

<b>
💰 ${money(horseValue(h))}
</b>

<br><br>

🏇 CSO :
<b>${h.disciplines.cso.level}</b>

<br>

🌳 CCE :
<b>${h.disciplines.cce.level}</b>

<br>

💃 Dressage :
<b>${h.disciplines.dressage.level}</b>

<button
class="primary"
onclick="horseBook(${JSON.stringify(h.id)})">

📖 Ouvrir le carnet

</button>

</div>

`

).join("")

"<div class='notice'>Aucun cheval.</div>"

}


/* =====================================================
 CARNET
===================================================== */

function horseBook(id){

let h=
game.horses.find(
x=>x.id==id
);

openPage(

"📖 Carnet de "+h.name,

`

<div class="notice">

<h3>
🐴 ${h.name}
</h3>

${h.race}

<br>

${sexText(h.sex)}

<br>

${h.age===0
?"🐣 Poulain"
:h.age+" ans"}

<br>

${h.place==="box"
?"🏠 Box"
:"🌳 Pré"}

<br><br>

💰 Valeur :

<b>
${money(horseValue(h))}
</b>

</div>


<div class="two">

<button
class="primary"
onclick="renameHorse(${JSON.stringify(h.id)})">

✏️ Modifier prénom

</button>

<button
class="primary"
onclick="moveHorse(${JSON.stringify(h.id)})">

${h.place==="box"
?"🌳 Mettre au pré"
:"🏠 Mettre au box"}

</button>

</div>


<div class="title">
🏆 Disciplines
</div>


${disciplineInfo(
h,
"cso",
"🏇 CSO"
)}

${disciplineInfo(
h,
"cce",
"🌳 CCE"
)}

${disciplineInfo(
h,
"dressage",
"💃 Dressage"
)}


<div class="title">
🧬 Origines
</div>


<div class="choice">

<b>Père :</b>

${h.father.name}

<br>

Race :
${h.father.race}

<br>

${h.father.results.join("<br>")}

</div>


<div class="choice">

<b>Mère :</b>

${h.mother.name}

<br>

Race :
${h.mother.race}

<br>

${h.mother.results.join("<br>")}

</div>


${
h.race==="OC"

?

`

<div class="notice">

🧬 <b>OC</b>

<br>

Les parents sont de deux races différentes.

<br>

💰 Décote de 20 % appliquée à la valeur.

</div>

`

:""

}


<div class="title">
🩺 Suivi professionnel
</div>


<div class="choice">

🧲 Maréchal

<br>

Dernier :
J${h.hoof.lastDay}

<br>

Prochain :
J${h.hoof.lastDay+60}

</div>


<div class="choice">

🩺 Vétérinaire

<br>

Prochain :
J${h.vet.nextDay}

function compete(
id,
key,
level,
cost
){

let h=
game.horses.find(
x=>x.id==id
);

let d=
h.disciplines[key];

if(game.money<cost){

openPage(
"💸",
`
<div class="notice alert">
Pas assez d'argent.
</div>
`
);

return;

}

if(h.fatigue>=80){

openPage(
"😴",
`
<div class="notice alert">
Cheval trop fatigué.
</div>
`
);

return;

}

game.money-=cost;

h.fatigue=
clamp(
h.fatigue+20,
0,
100
);

d.courses++;

d.experience+=3;

let difficulty=
level==="Club"
?0
:
level==="Amateur"
?15
:30;

let chance=
clamp(

d.level*.60+
d.experience*.10+
h.form*.10+
h.health*.10+
h.mental*.10-
difficulty,

3,
95

);

if(
Math.random()*100<
chance
){

if(level==="Club")
d.winsClub++;

if(level==="Amateur")
d.winsAmateur++;

if(level==="National")
d.winsNational++;

game.money+=
cost*2;

game.reputation+=
level==="Club"
?2
:
level==="Amateur"
?5
:10;

openPage(

"🏆 Victoire !",

`

<div class="notice good">

🎉 <b>${h.name}</b>

<br>

Victoire en
${level}

<br>

Discipline :
${key.toUpperCase()}

</div>

`

);

}

else{

openPage(

"🏇 Concours terminé",

`

<div class="notice">

${h.name} termine son concours
${level} en ${key.toUpperCase()}.

</div>

`

);

}

save();

}

/* =====================================================
 POULAIN
===================================================== */

function createFoal(
motherId,
fatherId
){

let mother=
game.horses.find(
h=>h.id==motherId
);

let father=
game.horses.find(
h=>h.id==fatherId
);

if(game.money<1000){

openPage(
"💸",
`
<div class="notice alert">
Il faut 1 000 € pour la reproduction.
</div>
`
);

return;

}


/* RACE */

let race=
mother.race===
father.race
?
mother.race
:
"OC";


/* POTENTIELS */

function genetics(a,b){

return clamp(

Math.round(
(a+b)/2+
(Math.random()*12-6)
),

40,
99

);

}


let foal=
createHorse(

"foal"+Date.now(),

"",

race,

0,

Math.random()<.5
?"Jument"
:"Étalon",

genetics(
mother.potential,
father.potential
),

"pasture"

);


/* Disciplines héritées */

foal.disciplines.cso.potential=
genetics(
mother.disciplines.cso.potential,
father.disciplines.cso.potential
);

foal.disciplines.cce.potential=
genetics(
mother.disciplines.cce.potential,
father.disciplines.cce.potential
);

foal.disciplines.dressage.potential=
genetics(
mother.disciplines.dressage.potential,
father.disciplines.dressage.potential
);


/* On évite le cheval parfait */

let best=
Math.max(
foal.disciplines.cso.potential,
foal.disciplines.cce.potential,
foal.disciplines.dressage.potential
);

["cso","cce","dressage"].forEach(

k=>{

if(
foal.disciplines[k].potential===best
)
return;

if(
foal.disciplines[k].potential>90 &&
best>90
){

foal.disciplines[k].potential=
clamp(
foal.disciplines[k].potential-
Math.floor(
Math.random()*8
),
40,
99
);

}

}

);


/* ORIGINES */

foal.father={
name:father.name,
race:father.race,
results:[
"Potentiel CSO : "+
father.disciplines.cso.potential,
"Potentiel CCE : "+
father.disciplines.cce.potential,
"Potentiel Dressage : "+
father.disciplines.dressage.potential
]
};

foal.mother={
name:mother.name,
race:mother.race,
results:[
"Potentiel CSO : "+
mother.disciplines.cso.potential,
"Potentiel CCE : "+
mother.disciplines.cce.potential,
"Potentiel Dressage : "+
mother.disciplines.dressage.potential
]
};


/* SUIVI */

foal.hoof={
type:"parage",
lastDay:game.day
};

foal.vet={
lastDay:game.day,
nextDay:game.day+30
};


/* ATTENTE DU PRÉNOM */

pendingFoal=foal;


openPage(

"🐣 Naissance",

`

<div class="notice good">

🎉 Un poulain vient de naître !

</div>


<div class="choice">

<b>Race :</b>

${race}

<br>

<b>Sexe :</b>

${sexText(foal.sex)}

<br><br>

🧬 Père :
${father.name}

<br>
${father.race}

<br><br>

🧬 Mère :
${mother.name}

<br>
${mother.race}

</div>


${
race==="OC"

?

`

<div class="notice">

🧬 <b>OC</b>

<br>

Les parents sont de deux races différentes.

</div>

`

:""

}


<label>

✍️ Prénom du poulain

</label>

<input
id="foalName"
class="input"
maxlength="25"
placeholder="Choisis son prénom"
>


<button
class="primary"
onclick="validateFoalName()">

🐣 Enregistrer le poulain

</button>

`

);

}

class="primary"
onclick="sellHorse(${JSON.stringify(h.id)})">

💶 Vendre
${money(
Math.round(
horseValue(h)*.82
)
)}

</button>

</div>

`

).join("")

||
"<div class='notice'>Aucun cheval à vendre.</div>"

);

}


function sellHorse(id){

let index=
game.horses.findIndex(
h=>h.id==id
);

if(index===-1){

return;

}

let h=
game.horses[index];

let price=
Math.round(
horseValue(h)*.82
);

game.money+=price;

game.horses.splice(
index,
1
);

save();

/* on reconstruit la page */

salesPage();

}


/* =====================================================
 MARCHÉ
===================================================== */

function generateMarket(
race,
amount
){

let list=[];

for(
let i=0;
i<amount;
i++
){

let r=
race||
RACES[
Math.floor(
Math.random()*RACES.length
)
];

let profile=
RACE_PROFILE[r];

let h=
createHorse(

"market"+
Date.now()+
i,

PRENOMS[
Math.floor(
Math.random()*PRENOMS.length
)
]+
" "+(i+1),

r,

3+
Math.floor(
Math.random()*13
),

i%2
?
"Hongre"
:
"Jument",

70+
Math.floor(
Math.random()*25
),

"market"

);

h.disciplines.cso.potential=
clamp(
profile.cso+
Math.floor(
Math.random()*20-10
),
35,
99
);

h.disciplines.cce.potential=
clamp(
profile.cce+
Math.floor(
Math.random()*20-10
),
35,
99
);

h.disciplines.dressage.potential=
clamp(
profile.dressage+
Math.floor(
Math.random()*20-10
),
35,
99
);

list.push(h);

}

return list;

}


function marketEnsure(type){

let month=
Math.floor(
(dayOfYear()-1)/30
);

if(
!markets[type]||
markets[type].month!==month||
markets[type].year!==game.year
){

markets[type]={
month:month,
year:game.year
};

if(type==="breeding"){

markets[type].breeds={};

RACES.forEach(

race=>

markets[type]
.breeds[race]=
generateMarket(
race,
7
)

);

}
else{

markets[type].horses=
generateMarket(
null,
14
);

}

}

}


function marketPage(type){

marketEnsure(type);

let html=

`

<div class="notice">

Renouvellement tous les 30 jours.

<br>

Chaque élevage propose
<b>7 chevaux</b>.

</div>


<div class="two">

<button
class="primary"
onclick="marketPage('breeding')">

🧬 Élevages

</button>

<button
class="primary"
onclick="marketPage('merchant')">

🐎 Marchands

</button>

</div>


<button
class="primary"
onclick="marketPage('auction')">

🔨 Enchères

</button>

`;


if(type==="breeding"){

html+=`

<div class="title">
Choisir une race
</div>

`;

RACES.forEach(

race=>{

html+=`

<button
class="secondary"
onclick="selectMarketBreed(${JSON.stringify(race)})">

${race}

</button>

`;

}

);

html+=

markets.breeding
.breeds[selectedBreed]
.map(

(h,i)=>
marketCard(
h,
type,
i
)

).join("");

}

else{

html+=

markets[type]
.horses
.map(

(h,i)=>
marketCard(
h,
type,
i
)

).join("");

}


openPage(

"🏪 Marché",

html

);

}


function selectMarketBreed(race){

selectedBreed=race;

marketPage("breeding");

}


function marketCard(
h,
type,
index
){

let price=
horseValue(h);

if(type==="merchant")
price*=1.08;

if(type==="auction")
price*=.55;

return `

<div class="card">

<span class="badge">
${h.race}
</span>

<span class="badge">
${sexText(h.sex)}
</span>

<span class="badge">
${h.age} ans
</span>

<h3>
${h.name}
</h3>

🏇 CSO :
${h.disciplines.cso.potential}

<br>

🌳 CCE :
${h.disciplines.cce.potential}

<br>

💃 Dressage :
${h.disciplines.dressage.potential}

<div class="notice">

💰
<b>
${money(price)}
</b>

</div>

<button
class="primary"
onclick="buyMarket('${type}',${index},${Math.round(price)})">

${type==="auction"
?"🔨 Enchérir"
:"💰 Acheter"}

</button>

</div>

`;

}


function getMarket(type,index){

if(type==="breeding"){

return markets.breeding
.breeds[selectedBreed][index];

}

return markets[type]
.horses[index];

}


function buyMarket(
type,
index,
price
){

let h=
getMarket(
type,
index
);

if(game.money<price){

return openPage(
"💸",
`
<div class="notice alert">
Pas assez d'argent.
</div>
`
);

}

let occupied=
game.horses.filter(
h=>h.place==="box"
).length;

if(
occupied>=game.boxes
){

return openPage(
"🏠",
`
<div class="notice alert">
Plus de box disponible.
</div>
`
);

}

game.money-=price;

h.id=
"bought"+
Date.now()+
Math.random();

h.place="box";

game.horses.push(h);

if(type==="breeding"){

markets.breeding
.breeds[selectedBreed]
.splice(index,1);

}
else{

markets[type]
.horses.splice(index,1);

}

save();

horseBook(h.id);

}

 DOMAINE

"🏡 Domaine",

`

<div class="choice">

⭐ ${game.reputation}

 STOCKS

function buyStock(type){

type==="hay"
?
250
:
type==="grain"

180

?
500

 CALENDRIER

game.horses.forEach(

h=>{

);

);

);

);

 TRANSPORT

function transportPage(){

openPage(

`

<b>
${game.truckCapacity}
chevaux

);

function upgradeTruck(){

if(
game.truckCapacity>=12
)
return;

if(
game.money<6000
)
return;

game.money-=6000;

game.truckCapacity+=2;

save();

transportPage();

}


/* =====================================================
 SOINS
===================================================== */

function carePage(){

openPage(

"❤️ Soins",

game.horses.map(

h=>

`

<div class="card">

<b>
${h.name}
</b>

<br>

Santé :
${h.health}%

<br>

Forme :
${h.form}%

<br>

Fatigue :
${h.fatigue}%

<button
class="primary"
onclick="basicCare(${JSON.stringify(h.id)})">

❤️ Soins — 80 €

</button>

</div>

`

).join("")

);

}


function basicCare(id){

let h=
game.horses.find(
x=>x.id==id
);

if(game.money<80)
return;

game.money-=80;

h.health=
clamp(
h.health+5,
0,
100
);

h.form=
clamp(
h.form+4,
0,
100
);

h.fatigue=
clamp(
h.fatigue-10,
0,
100
);

save();

horseBook(id);

}


/* =====================================================
 JOUR SUIVANT
===================================================== */

function nextDay(){

game.money-=350;

game.day++;

if(
dayOfYear()===1
)
game.year++;


game.horses.forEach(

h=>{

h.fatigue=
clamp(
h.fatigue-
(
h.place==="pasture"
?
10
:
7
),
0,
100
);

h.form=
clamp(
h.form+1,
0,
100
);

if(
h.place==="pasture"
){

h.health=
clamp(
h.health+1,
0,
100
);

}


/* nourriture */

game.hay=
Math.max(
0,
game.hay-h.ration.hay
);

game.grain=
Math.max(
0,
game.grain-h.ration.grain
);

game.straw=
Math.max(
0,
game.straw-.5
);


/* retard maréchal */

let due=
h.hoof.lastDay+60;

if(
game.day>due
){

let retard=
game.day-due;

h.health=
clamp(
h.health-
Math.min(
12,
Math.ceil(retard/5)
),
0,
100
);

h.form=
clamp(
h.form-
Math.min(
12,
Math.ceil(retard/6)
),
0,
100
);

}

}

);

save();

}


/* =====================================================
 INITIALISATION
===================================================== */

render();

</script>
