<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Écurie V13.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07170d;font-family:Arial,sans-serif;color:#294b38}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;background:#edf0e8}
header{position:sticky;top:0;z-index:50;padding:14px;background:linear-gradient(145deg,#173b25,#315f3c);color:#fff;box-shadow:0 3px 12px #0006}
h1{font:700 25px Georgia,serif;margin:0 0 8px}
.headerGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.headerStat{background:#ffffff18;border-radius:10px;padding:7px;text-align:center;font-size:11px}
main{padding:10px 10px 88px}
.sectionTitle{font:700 18px Georgia,serif;color:#fff;background:linear-gradient(90deg,#315f3c,#6d8c59);padding:8px 10px;border-radius:12px;margin:13px 0 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menuBtn{border:1px solid #c9d3c4;border-radius:14px;min-height:68px;padding:10px;background:linear-gradient(145deg,#fffaf0,#dce8d4);color:#294b38;font-weight:900;box-shadow:0 3px 8px #0002}
.primary,.secondary,.back,.close{border:0;border-radius:11px;padding:10px;font-weight:900}
.primary{width:100%;background:#315f3c;color:#fff;margin-top:7px}
.secondary{width:100%;background:#d9e3d4;color:#294b38;margin-top:7px}
.back{background:#d9e3d4;color:#294b38;font-size:17px}
.close{background:#d5d1c5;font-size:17px}
.choice,.card,.marketCard{padding:11px;margin:7px 0;border-radius:14px;background:#fff;border:1px solid #d2dbce;box-shadow:0 2px 6px #0001}
.notice{padding:11px;margin:7px 0;border-radius:12px;background:#fff9e8;border:1px solid #dfd0a8}
.good{background:#edf7ea;border-color:#a9c79f}
.alert{background:#fff0e8;border-color:#d98d65}
.badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#dfe8d7;font-size:11px;font-weight:800;margin:2px}
.input{width:100%;padding:10px;border:1px solid #c7d1c1;border-radius:10px;background:#fff}
.select{width:100%;padding:10px;border:1px solid #c7d1c1;border-radius:10px;background:#fff;font-weight:800}
.statLine{display:flex;justify-content:space-between;margin:7px 0}
.progress{height:8px;background:#d5dbd0;border-radius:10px;overflow:hidden}
.progress span{display:block;height:100%;background:#5d8b5e}
.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs{display:flex;gap:5px;overflow:auto;margin:8px 0}
.tabs button{white-space:nowrap;border:0;border-radius:10px;padding:9px;background:#d8e1d3;color:#294b38;font-weight:800}
.tabs button.active{background:#315f3c;color:#fff}
.hero{height:145px;margin:-10px -10px 10px;position:relative;overflow:hidden;background:linear-gradient(#8bb5c7 0 48%,#6f995e 48% 74%,#8a6943 74%);border-bottom:5px solid #584029}
.hero:before{content:"";position:absolute;left:-10%;bottom:20px;width:120%;height:75px;background:radial-gradient(ellipse at 15% 80%,#355c38 0 35px,transparent 36px),radial-gradient(ellipse at 50% 85%,#426b3e 0 45px,transparent 46px),radial-gradient(ellipse at 85% 80%,#355c38 0 40px,transparent 41px)}
.stable{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:180px;height:70px;background:#875737;border:5px solid #54331f}
.door{position:absolute;left:64px;bottom:0;width:50px;height:46px;background:#35261f;border:3px solid #d0a66d}
.hero .horse{position:absolute;right:18px;bottom:18px;font-size:68px}
.hero h2{position:absolute;left:12px;top:8px;color:#fff;text-shadow:0 2px 4px #000;font:700 21px Georgia,serif}
.horsePic,.marketPic{height:100px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#a7b997,#607b54 55%,#b59a6b);font-size:65px;margin-bottom:8px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:#000b;z-index:100}
.modal.show{display:flex}
.modalBox{width:min(410px,95vw);max-height:92vh;overflow:auto;padding:16px;border-radius:22px;background:linear-gradient(145deg,#f8f1df,#dfe8d7);border:2px solid #b99d5b;box-shadow:0 20px 60px #000}
.modalHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.modalHead h2{margin:0;font:700 21px Georgia,serif}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#173b25;padding:5px;z-index:60}
.bottom button{border:0;background:#315f3c;color:#fff;border-radius:9px;padding:8px 2px;font-size:10px;font-weight:800}
.rank{text-align:center;font-size:25px;font-weight:900;padding:10px}
.cleanMap{position:relative;height:360px;border-radius:18px;background:linear-gradient(#b8d6df,#e8efe6);border:1px solid #9db29d;overflow:hidden}
.cleanMap svg{width:100%;height:100%}
.mapPin{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;width:38px;height:38px;background:#315f3c;color:#fff;font-size:17px;box-shadow:0 3px 7px #0006}
.mapPin span{position:absolute;top:37px;left:50%;transform:translateX(-50%);background:#fff;color:#294b38;padding:3px 6px;border-radius:7px;font-size:9px;white-space:nowrap;font-weight:900}
.small{font-size:12px}.muted{opacity:.72}.danger{color:#a64224}.success{color:#2e6b36}.center{text-align:center}
.potentialBox{padding:9px;border-radius:12px;background:#f3f6ef;margin-top:7px}
.prob{font-size:12px;line-height:1.6}
.eventRow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.check{transform:scale(1.2)}
</style>
</head>
<body>

<script>
const STORAGE="monEcurieV13_3";
const BREEDS=["Selle Français","KWPN","Anglo-Arabe","Connemara","Poney Français de Selle","Hanovrien","Oldenbourg","Quarter Horse","Lusitanien","Frison"];
const NAMES=["Luna","Caramel","Jasper","Étoile","Silver Moon","Golden Dream","Belle Romance","Royal Star","Évidence","Mystère","Opale","Nébuleuse","Rivière","Saphir","Toscane","Violette","Orage","Galaxie","Éclipse","Tempête","Vanille","Praline","Câline","Nikita","Sultan","Atlas","Jazz","Jade","Ambre","Rubis","Topaze","Perle","Safran","Mistral","Phoenix","Volcan","Aria","Bella","Cassandre","Diva","Émeraude","Fleur","Harmonie","Isis","Karma","Légende","Mélodie","Nova","Ondine","Pacha","Quartz","Rêve","Soleil","Tango","Ulysse","Vega","Whisky","Xena","Yoko","Zéphyr","Aube","Bambou","Cobalt","Dune","Flamme","Gatsby","Hélios","Icare","Joy","Kenza","Lilas","Maestro","Nacre","Olympe","Pistache","Roméo","Salsa","Trésor","Utopia","Victoire","Willow","Zara","Altesse","Bounty","César","Darling","Elixir","Fidji","Ginger","Horizon","Jupiter","Kiss","Lancelot","Moka","Nirvana","Oscar","Pépite","Roxane","Titan","Vénus","Wendy","Yasmine","Aquarelle","Bambina","Calypso","Cappuccino","Céleste","Chantilly","Cléopâtre","Comète","Django","Eden","Espoir","Fascination","Gala","Havana","Hermine","Indiana","Jolie","Kheops","Liberté","Majestic","Mango","Maya","Mirage","Mistral","Navajo","Oasis","Paloma","Pégase","Plume","Rhapsodie","Saphir Bleu","Sirocco","Storm","Talisman","Thémis","Valentine","Velours","Viking","Willow Creek","Zénith"];
const RACE={
"Selle Français":{CSO:15,CCE:8,Dressage:2},
"KWPN":{CSO:10,CCE:6,Dressage:15},
"Anglo-Arabe":{CSO:7,CCE:17,Dressage:4},
"Connemara":{CSO:12,CCE:11,Dressage:2},
"Poney Français de Selle":{CSO:13,CCE:11,Dressage:5},
"Hanovrien":{CSO:7,CCE:4,Dressage:18},
"Oldenbourg":{CSO:9,CCE:3,Dressage:15},
"Quarter Horse":{CSO:2,CCE:5,Dressage:2},
"Lusitanien":{CSO:2,CCE:5,Dressage:18},
"Frison":{CSO:1,CCE:3,Dressage:15}
};
const DISC=["CSO","CCE","Dressage"];
const $=x=>document.getElementById(x);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const money=n=>Math.round(n).toLocaleString("fr-FR")+" €";
let nav=[],currentPage=null,selectedEvent=null,selectedHorses=[],marketCache={},trip=null;

function dateDay(){return ((game.day-1)%365)+1}
function dateText(){let d=new Date(2026,8,1);d.setDate(d.getDate()+dateDay()-1);return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function season(){let d=dateDay();return d<=91?"🍂 Automne":d<=182?"❄️ Hiver":d<=274?"🌸 Printemps":"☀️ Été"}
function clone(x){return JSON.parse(JSON.stringify(x))}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function chance(p){return Math.random()<p}
function ageBand(age){return age<=2?25:age<=4?20:age<=6?15:age<=9?10:age<=13?6:3}

function rawPotential(race){
  let b=RACE[race]||{CSO:4,CCE:4,Dressage:4};
  let quality=rand(45,68);
  let hidden={};
  DISC.forEach(d=>hidden[d]=clamp(quality+(b[d]||0)+rand(-18,18),40,99));
  return hidden;
}
function estimateRange(real,age){
  let w=ageBand(age);
  return [clamp(real-w,35,99),clamp(real+w,40,99)];
}
function rangesFor(p,age){
  let out={};DISC.forEach(d=>out[d]=estimateRange(p[d],age));return out;
}
function probabilityProfile(p,price,race){
  let avg=(p.CSO+p.CCE+p.Dressage)/3;
  let elite=clamp((avg-68)/28,0,1);
  let priceBoost=clamp(Math.log10(Math.max(price,1000))-3,0,2)/2;
  let breedBoost=(RACE[race]?Math.max(...Object.values(RACE[race])):5)/18;
  let exceptional=clamp(0.02+elite*.28+priceBoost*.16+breedBoost*.05,0.01,.55);
  let very=clamp(.10+elite*.32+priceBoost*.14,.05,.70);
  let good=clamp(.30+(1-elite)*.28,.15,.65);
  let medium=Math.max(.02,1-exceptional-very-good);
  let total=exceptional+very+good+medium;
  return {exceptional:exceptional/total,very:very/total,good:good/total,medium:medium/total};
}
function probHTML(p){
return `<div class="potentialBox prob"><b>📊 Probabilité estimée</b><br>
🔥 Exceptionnel : <b>${Math.round(p.exceptional*100)} %</b><br>
⭐ Très bon : <b>${Math.round(p.very*100)} %</b><br>
👍 Bon : <b>${Math.round(p.good*100)} %</b><br>
😐 Moyen : <b>${Math.round(p.medium*100)} %</b></div>`;
}
function potentialHTML(h,showReal=false){
  let r=h.ranges||rangesFor(h.potential,h.age);
  return `<div class="potentialBox"><b>🔎 Potentiel estimé</b><br>
  🏇 CSO : <b>${r.CSO[0]}–${r.CSO[1]}</b><br>
  🌳 CCE : <b>${r.CCE[0]}–${r.CCE[1]}</b><br>
  💃 Dressage : <b>${r.Dressage[0]}–${r.Dressage[1]}</b>
  ${showReal?`<br><span class="muted small">Potentiel réel de test : ${h.potential.CSO} / ${h.potential.CCE} / ${h.potential.Dressage}</span>`:""}</div>`;
}
function historyEvent(h,text){h.history=h.history||[];h.history.push({day:game.day,text})}
function uniqueName(){
 let used=new Set(game.horses.map(h=>(h.name||"").toLowerCase()));
 let available=NAMES.filter(n=>!used.has(n.toLowerCase()));
 return available.length?available[rand(0,available.length-1)]:"Étoile "+rand(100,999);
}
function randomBackstory(race,age){
 let origins=["petit élevage familial","élevage reconnu régionalement","élevage spécialisé dans le sport","origine de compétition","élevage de poneys et chevaux de sport"];
 let chars=["calme et volontaire","sensible mais très appliqué","énergique et courageux","froid et régulier","réactif avec beaucoup de sang","facile mais parfois distrait","très proche de l'humain"];
 let strengths=["bonne locomotion","très bon équilibre","excellent coup de saut","beaucoup de courage","bonne récupération","belle technique","grande régularité"];
 let weaknesses=["pieds sensibles","tendance à se tendre en concours","petite fragilité musculaire","récupération lente","aucune fragilité particulière","caractère exigeant","dos à surveiller"];
 return {origin:origins[rand(0,origins.length-1)],character:chars[rand(0,chars.length-1)],strength:strengths[rand(0,strengths.length-1)],weakness:weaknesses[rand(0,weaknesses.length-1)],race};
}
function makeHorse(id,name,race,age,sex,place="pasture",price=0,potential=null){
 potential=potential||rawPotential(race);
 let h={
  id,name,race,age,sex,place,retired:false,away:false,
  potential,ranges:rangesFor(potential,age),
  current:{CSO:clamp(rand(28,55),0,potential.CSO),CCE:clamp(rand(28,55),0,potential.CCE),Dressage:clamp(rand(28,55),0,potential.Dressage)},
  experience:{CSO:0,CCE:0,Dressage:0},regularity:{CSO:50,CCE:50,Dressage:50},
  health:rand(86,98),form:rand(72,90),fatigue:rand(8,20),mental:rand(58,88),
  ration:{hay:10,grain:3},hoof:{type:"ferrure",lastDay:1,nextDay:61},
  vet:{lastDay:1,nextDay:91},dentist:{lastDay:1,nextDay:181},osteo:{lastDay:1,nextDay:121},
  vaccines:{grippe:1,tetanos:1,rhino:1},
  injuries:[],illnesses:[],treatments:[],
  father:{name:"Père d'origine",results:["Origines enregistrées"]},
  mother:{name:"Mère d'origine",results:["Origines enregistrées"]},
  results:[],qualPoints:{CSO:0,CCE:0,Dressage:0},courses:{CSO:0,CCE:0,Dressage:0},
  lastCompetitionDay:-999,history:[],backstory:randomBackstory(race,age),purchasePrice:price||2500
 };
 historyEvent(h,`Naissance / arrivée : ${h.backstory.origin}. ${h.backstory.character}.`);
 historyEvent(h,`Particularité : ${h.backstory.strength}. Point à surveiller : ${h.backstory.weakness}.`);
 return h;
}
const initial={
 money:100000,reputation:0,day:1,year:1,boxes:8,pastures:2,land:2,truckCapacity:4,
 hay:1800,grain:1000,straw:1000,maxHay:2500,maxGrain:1800,maxStraw:1800,
 horses:[
  makeHorse(1,"Luna","Selle Français",8,"Jument","box",0,{CSO:94,CCE:76,Dressage:60}),
  makeHorse(2,"Caramel","Anglo-Arabe",12,"Hongre","box",0,{CSO:72,CCE:91,Dressage:62}),
  makeHorse(3,"Jasper","Quarter Horse",6,"Hongre","pasture",0,{CSO:63,CCE:66,Dressage:54}),
  makeHorse(4,"Étoile","Connemara",4,"Jument","pasture",0,{CSO:82,CCE:77,Dressage:59})
 ]
};
function normalize(g){
 g=Object.assign(clone(initial),g||{});
 g.horses=(g.horses||[]).map(h=>{
  h.name=h.name||uniqueName();h.potential=h.potential||{CSO:65,CCE:65,Dressage:65};
  h.ranges=rangesFor(h.potential,h.age||5);h.current=h.current||{CSO:45,CCE:45,Dressage:45};
  h.experience=h.experience||{CSO:0,CCE:0,Dressage:0};h.regularity=h.regularity||{CSO:50,CCE:50,Dressage:50};
  h.qualPoints=h.qualPoints||{CSO:0,CCE:0,Dressage:0};h.courses=h.courses||{CSO:0,CCE:0,Dressage:0};
  h.ration=h.ration||{hay:10,grain:3};h.hoof=h.hoof||{type:"ferrure",lastDay:1,nextDay:61};
  h.vet=h.vet||{lastDay:1,nextDay:91};h.dentist=h.dentist||{lastDay:1,nextDay:181};h.osteo=h.osteo||{lastDay:1,nextDay:121};
  h.vaccines=h.vaccines||{grippe:1,tetanos:1,rhino:1};h.injuries=h.injuries||[];h.illnesses=h.illnesses||[];h.treatments=h.treatments||[];
  h.results=h.results||[];h.history=h.history||[];h.backstory=h.backstory||randomBackstory(h.race,h.age);
  if(h.lastCompetitionDay==null)h.lastCompetitionDay=-999;if(h.away==null)h.away=false;
  return h;
 });
 return g;
}
function load(){try{let s=localStorage.getItem(STORAGE);if(s)return normalize(JSON.parse(s))}catch(e){}return normalize(clone(initial))}
let game=load();
function save(){localStorage.setItem(STORAGE,JSON.stringify(game));render()}
function render(){
 $("dateLabel").textContent=dateText();$("dayLabel").textContent="J"+dateDay()+"/365 · Année "+game.year;$("season").textContent=season();
 $("money").textContent=money(game.money);$("rep").textContent="⭐ "+game.reputation;$("horseCount").textContent=game.horses.length;
 $("boxCount").textContent=game.horses.filter(h=>h.place==="box"&&!h.away).length+"/"+game.boxes+" boxes";
 let a=[];game.horses.forEach(h=>{
  if(game.day>=h.hoof.nextDay)a.push(`🧲 <b>${h.name}</b> : maréchal à prévoir.`);
  if(game.day>=h.vet.nextDay)a.push(`🩺 <b>${h.name}</b> : visite vétérinaire à prévoir.`);
  if(game.day>=h.dentist.nextDay)a.push(`🦷 <b>${h.name}</b> : dentiste à prévoir.`);
  if(game.day>=h.osteo.nextDay)a.push(`👐 <b>${h.name}</b> : ostéopathe à prévoir.`);
  if(h.vaccines.grippe<=game.day||h.vaccines.tetanos<=game.day||h.vaccines.rhino<=game.day)a.push(`💉 <b>${h.name}</b> : vaccination à renouveler.`);
  if(h.injuries.some(i=>i.active))a.push(`🩹 <b>${h.name}</b> : blessure en cours, repos.`);
 });
 $("alerts").innerHTML=a.slice(0,7).map(x=>`<div class="notice alert">${x}</div>`).join("");
}
function open(title,html,back=true){
 $("modalTitle").textContent=title;$("modalContent").innerHTML=html;$("modal").classList.add("show");
 $("backBtn").style.display=back&&nav.length?"block":"none";
}
function closeModal(){nav=[];currentPage=null;$("modal").classList.remove("show")}
$("modal").onclick=e=>{if(e.target===$("modal"))closeModal()}
function page(fn){if(currentPage)nav.push(currentPage);currentPage=fn;fn()}
function goBack(){let f=nav.pop();if(f){currentPage=f;f()}else closeModal()}
function stat(n,v){return `<div class="choice"><div class="statLine"><span>${n}</span><b>${Math.round(v)}/100</b></div><div class="progress"><span style="width:${clamp(v,0,100)}%"></span></div></div>`}
function value(h){let p=(h.potential.CSO+h.potential.CCE+h.potential.Dressage)/3,c=(h.current.CSO+h.current.CCE+h.current.Dressage)/3;return Math.round(2500+Math.pow(clamp(p*.55+c*.35+h.mental*.1,0,100)/100,2.5)*65000)}
function injuryText(h){let i=h.injuries.filter(x=>x.active);return i.length?i.map(x=>`🩹 ${x.type} · repos ${x.until-game.day>0?x.until-game.day:0} j`).join("<br>"):"Aucune blessure active."}

function horseCard(h){
 let prob=probabilityProfile(h.potential,value(h),h.race);
 return `<div class="card"><div class="horsePic">🐎</div>
 <span class="badge">${h.race}</span><span class="badge">${h.age} ans</span><span class="badge">${h.sex}</span>${h.away?'<span class="badge">🏆 En concours</span>':''}
 <h3>${h.name}</h3>${h.place==="box"?"🏠 Box":"🌳 Pré"} · 💰 ${money(value(h))}
 ${stat("🏇 CSO",h.current.CSO)}${stat("🌳 CCE",h.current.CCE)}${stat("💃 Dressage",h.current.Dressage)}
 ${potentialHTML(h)}${probHTML(prob)}
 <button class="primary" onclick="horseBook('${h.id}')">📖 Carnet</button></div>`;
}
function horsesPage(){page(()=>open("🐎 Mes chevaux",game.horses.map(horseCard).join("")||"<div class='notice'>Aucun cheval.</div>"))}

const BOOK_TABS=[
 ["id","🐴 Identité"],["sport","🏇 Sport"],["pal","🏆 Palmarès"],["orig","🧬 Origines"],["health","🩺 Santé"],["vacc","💉 Vaccins"],
 ["farrier","🧲 Maréchal"],["dentist","🦷 Dentiste"],["osteo","👐 Ostéo"],["food","🥕 Alimentation"],["train","🏋️ Entraînement"],["history","📋 Historique"]
];
function horseBook(id,tab="id"){
 let h=game.horses.find(x=>String(x.id)===String(id));if(!h)return;
 let tabs=BOOK_TABS.map(t=>`<button class="${t[0]===tab?"active":""}" onclick="horseBook('${id}','${t[0]}')">${t[1]}</button>`).join("");
 let body="";
 if(tab==="id")body=`<div class="horsePic">🐎</div><div class="notice"><b>${h.name}</b><br>${h.race} · ${h.age} ans · ${h.sex}<br>${h.away?"🏆 En concours":h.place==="box"?"🏠 Box":"🌳 Pré"} · 💰 ${money(value(h))}</div>
 <div class="choice"><b>Histoire</b><br>${h.backstory.origin}. ${h.backstory.character}. ${h.backstory.strength}. À surveiller : ${h.backstory.weakness}.</div>`;
 if(tab==="sport")body=`${stat("🏇 CSO",h.current.CSO)}${stat("🌳 CCE",h.current.CCE)}${stat("💃 Dressage",h.current.Dressage)}${potentialHTML(h,true)}<div class="choice">Expérience : CSO ${h.experience.CSO} · CCE ${h.experience.CCE} · Dressage ${h.experience.Dressage}</div>`;
 if(tab==="pal")body=h.results.length?h.results.slice().reverse().map(x=>`<div class="choice">${x}</div>`).join(""):"<div class='notice'>Aucun concours.</div>";
 if(tab==="orig")body=`<div class="choice"><b>Père :</b> ${h.father.name}<br>${h.father.results.join("<br>")}<br><br><b>Mère :</b> ${h.mother.name}<br>${h.mother.results.join("<br>")}</div>`;
 if(tab==="health")body=`${stat("❤️ Santé",h.health)}${stat("💪 Forme",h.form)}${stat("😴 Fatigue",h.fatigue)}<div class="choice"><b>Blessures</b><br>${injuryText(h)}</div><div class="choice"><b>Maladies / traitements</b><br>${h.illnesses.length?h.illnesses.join("<br>"):"Aucun problème enregistré."}<br>${h.treatments.length?h.treatments.join("<br>"):"Aucun traitement."}</div><button class="primary" onclick="professional('vet','${h.id}',100,90,8)">🩺 Faire venir le vétérinaire — 100 €</button>`;
 if(tab==="vacc")body=`${["grippe","tetanos","rhino"].map(v=>`<div class="choice"><b>💉 ${v==="grippe"?"Grippe":v==="tetanos"?"Tétanos":"Rhinopneumonie"}</b><br>Prochaine échéance : J${h.vaccines[v]}<button class="primary" onclick="vaccinate('${h.id}','${v}')">Vacciner — 55 €</button></div>`).join("")}`;
 if(tab==="farrier")body=`<div class="choice">Type : <b>${h.hoof.type}</b><br>Prochaine échéance : J${h.hoof.nextDay}</div><div class="two"><button class="primary" onclick="farrier('${h.id}','ferrure')">🔨 Ferrure 110 €</button><button class="primary" onclick="farrier('${h.id}','parage')">✂️ Parage 50 €</button></div>`;
 if(tab==="dentist")body=`<div class="choice">Dernier passage : J${h.dentist.lastDay}<br>Prochain : J${h.dentist.nextDay}</div><button class="primary" onclick="professional('dentist','${h.id}',70,180,4)">🦷 Faire venir — 70 €</button>`;
 if(tab==="osteo")body=`<div class="choice">Dernier passage : J${h.osteo.lastDay}<br>Prochain : J${h.osteo.nextDay}</div><button class="primary" onclick="professional('osteo','${h.id}',90,120,5)">👐 Faire venir — 90 €</button>`;
 if(tab==="food")body=`<div class="choice">🌾 ${h.ration.hay} kg de foin/j<br>🌽 ${h.ration.grain} kg de grain/j</div><button class="primary" onclick="setRation('${h.id}')">🥕 Modifier la ration</button>`;
 if(tab==="train")body=`<div class="choice">Les séances augmentent progressivement le niveau jusqu'au potentiel réel. La fatigue limite le travail.</div><button class="primary" onclick="trainingFor('${h.id}')">🏋️ Choisir une discipline</button>`;
 if(tab==="history")body=h.history.slice().reverse().map(x=>`<div class="choice"><b>J${x.day}</b> · ${x.text}</div>`).join("")||"<div class='notice'>Aucun historique.</div>";
 open("📖 Carnet de "+h.name,`<div class="tabs">${tabs}</div>${body}<button class="secondary" onclick="togglePlace('${h.id}')">${h.place==="box"?"🌳 Mettre au pré":"🏠 Mettre au box"}</button>`);
}

function trainingPage(){page(()=>open("🏋️ Entraînement",game.horses.filter(h=>!h.away).map(h=>`<div class="card"><b>${h.name}</b><br>🏇 ${h.current.CSO} · 🌳 ${h.current.CCE} · 💃 ${h.current.Dressage}<button class="primary" onclick="trainingFor('${h.id}')">Choisir une discipline</button></div>`).join("")))}
function trainingFor(id){let h=game.horses.find(x=>String(x.id)===String(id));open("🏋️ Travail de "+h.name,DISC.map(d=>`<div class="choice">${d==="CSO"?"🏇":d==="CCE"?"🌳":"💃"} <b>${d}</b> — ${h.current[d]}/100 · potentiel ${h.ranges[d][0]}–${h.ranges[d][1]}<button class="primary" onclick="train('${h.id}','${d}')">Entraîner</button></div>`).join(""))}
function train(id,d){let h=game.horses.find(x=>String(x.id)===String(id));if(h.injuries.some(i=>i.active)){open("🩹","Impossible de travailler : le cheval est blessé.");return}if(h.fatigue>=75){open("😴","Cheval trop fatigué.");return}let gain=Math.max(1,Math.round(1+h.experience[d]/45));h.current[d]=clamp(h.current[d]+gain,0,h.potential[d]);h.experience[d]=clamp(h.experience[d]+2,0,100);h.form=clamp(h.form+3,0,100);h.fatigue=clamp(h.fatigue+14,0,100);historyEvent(h,`Séance de travail en ${d}.`);save();horseBook(id,"train")}

function competitionSetup(){page(()=>open("🏆 Préparer un concours",`<div class="notice">Avant la carte, choisis d'abord la <b>discipline</b> puis le <b>niveau</b>. La carte sera filtrée.</div><div class="choice"><b>1. Discipline</b><div class="three"><button class="secondary" onclick="chooseCompDis('CSO')">🏇 CSO</button><button class="secondary" onclick="chooseCompDis('CCE')">🌳 CCE</button><button class="secondary" onclick="chooseCompDis('Dressage')">💃 Dressage</button></div></div><div id="compLevelBox"></div>`))}
function chooseCompDis(d){window.compDis=d;let box=$("compLevelBox");box.innerHTML=`<div class="choice"><b>2. Niveau</b><div class="three"><button class="secondary" onclick="showCompMap('Club')">🟢 Club</button><button class="secondary" onclick="showCompMap('Amateur')">🔵 Amateur</button><button class="secondary" onclick="showCompMap('National')">🔴 National</button></div></div>`}
function showCompMap(level){window.compLevel=level;let list=EVENTS.filter(e=>e.discipline===window.compDis&&e.level===level);page(()=>open(`🗺️ ${window.compDis} · ${level}`,`<div class="notice">${list.length} concours correspondant à tes critères.<br>🏆 Un cheval ne peut faire qu'un concours sur une période de 7 jours.</div><div class="cleanMap"><svg viewBox="0 0 430 360" aria-hidden="true"><path d="M78 55 L125 28 L185 36 L220 22 L285 42 L345 38 L377 82 L365 125 L390 165 L355 196 L365 235 L328 274 L285 292 L246 326 L205 308 L165 322 L128 294 L91 302 L61 268 L69 226 L43 190 L55 151 L35 118 L61 92Z" fill="#d5e4cc" stroke="#789176" stroke-width="3"/><path d="M88 72 L145 58 M210 50 L310 75 M92 155 L200 160 M218 115 L345 145 M120 235 L270 215 M255 290 L335 240" stroke="#a7b89e" stroke-width="2" fill="none"/></svg>${list.map(e=>`<button class="mapPin" style="left:${e.x}%;top:${e.y}%" onclick="eventDetails(${e.id})">🏆<span>${e.city}</span></button>`).join("")}</div>${list.map(e=>`<div class="choice eventRow"><span><b>${e.city}</b><br><span class="small">${e.days} jour${e.days>1?"s":""} · ${e.places} places · J+${e.dateOffset}</span></span><button class="secondary" style="width:auto" onclick="eventDetails(${e.id})">Voir</button></div>`).join("")||"<div class='notice'>Aucun concours avec ces critères.</div>"}`))}
function eventDetails(id){selectedEvent=EVENTS.find(e=>e.id===id);let e=selectedEvent;open("🏆 "+e.city,`<div class="notice">📍 ${e.region}<br>🏇 ${e.discipline} · ${e.level}<br>📅 ${e.days} jour${e.days>1?"s":""}<br>👥 ${e.places} partants maximum<br>💰 Engagement : ${e.level==="Club"?250:e.level==="Amateur"?600:1500} €</div><div class="choice"><b>Programme</b><br>${Array.from({length:e.days},(_,i)=>`📅 Jour ${i+1} — épreuve indépendante`).join("<br>")}</div><button class="primary" onclick="chooseCompetitionHorses()">🐴 Choisir les chevaux</button>`)}
function chooseCompetitionHorses(){let e=selectedEvent;selectedHorses=[];open("🐴 Choisir les chevaux",`<div class="notice">🚚 Camion : <b>${game.truckCapacity} places</b><br>Sélectionnés : <b id="selectedCount">0</b>/${game.truckCapacity}</div>${game.horses.filter(h=>!h.away&&!h.retired).map(h=>`<div class="choice"><label><input type="checkbox" class="horseCheck check" value="${h.id}" onchange="updateSelection()"><b>${h.name}</b></label><br>${h.sex} · ${h.race}<br>${e.discipline==="CSO"?"🏇":e.discipline==="CCE"?"🌳":"💃"} Niveau ${h.current[e.discipline]}/100<br>${canCompete(h,e)?"✅ Disponible":"❌ Indisponible cette semaine"}</div>`).join("")}<button class="primary" onclick="prepareTrip()">🚚 Préparer le départ</button>`)}
function canCompete(h,e){return game.day-h.lastCompetitionDay>=7&&!h.away&&!h.retired&&!h.injuries.some(i=>i.active)&&h.current[e.discipline]>0}
function updateSelection(){let checks=[...document.querySelectorAll(".horseCheck:checked")];if(checks.length>game.truckCapacity){checks[checks.length-1].checked=false;return updateSelection()}selectedHorses=checks.map(x=>x.value);$("selectedCount").textContent=selectedHorses.length}
function prepareTrip(){let e=selectedEvent,ids=selectedHorses;if(!ids.length){open("🐴","Sélectionne au moins un cheval.");return}let horses=ids.map(id=>game.horses.find(h=>String(h.id)===String(id)));if(horses.some(h=>!canCompete(h,e))){open("❌","Un cheval sélectionné est indisponible cette semaine ou blessé.");return}let stable=game.horses.filter(h=>!h.away&&!ids.includes(String(h.id)));trip={event:e,day:0,remaining:e.days,stableHorses:stable.map(h=>h.id),travelHorses:horses.map(h=>h.id),palefrenier:false,palefrenierCost:0};let need=stable.length>0&&e.days>1;open("🚚 Préparation du départ",`<div class="notice">🏆 ${e.city}<br>📅 ${e.days} jour${e.days>1?"s":""}<br>🐴 ${horses.length} cheval${horses.length>1?"ux":""} embarqué${horses.length>1?"s":""}</div><div class="choice">🏠 Chevaux restant à l'écurie : <b>${stable.length}</b></div>${need?`<div class="notice alert">👨‍🌾 Palefrenier obligatoire pendant l'absence.<br>Coût : <b>${palefrenierCost(stable.length,e.days)} €</b></div><button class="primary" onclick="hirePalefrenier()">👨‍🌾 Engager le palefrenier</button>${trip.palefrenier?`<div class="notice good">Palefrenier déjà engagé.</div>`:""}`:`<div class="notice good">Aucun palefrenier nécessaire.</div>`}<button class="primary" onclick="startTrip()">🚚 Partir</button>`)}
function palefrenierCost(n,d){return 80*d+25*n*d}
function hirePalefrenier(){if(!trip)return;let cost=palefrenierCost(trip.stableHorses.length,trip.event.days);if(trip.palefrenier){open("👨‍🌾","Le palefrenier est déjà engagé.");return}if(game.money<cost){open("💸","Pas assez d'argent.");return}game.money-=cost;trip.palefrenier=true;trip.palefrenierCost=cost;save();prepareTrip()}
function startTrip(){if(trip.event.days>1&&trip.stableHorses.length&&!trip.palefrenier){open("👨‍🌾","Engage le palefrenier avant de partir.");return}trip.travelHorses.forEach(id=>{let h=game.horses.find(x=>String(x.id)===String(id));if(h)h.away=true});runCompetitionDay()}
function competitionScore(h,d,level){let diff=level==="Club"?0:level==="Amateur"?8:16;return h.current[d]*.5+h.potential[d]*.12+h.experience[d]*.12+h.mental*.08+h.regularity[d]*.1+h.form*.08-h.fatigue*.1+Math.random()*18-9-diff}
function runCompetitionDay(){let e=trip.event;trip.day++;trip.remaining--;let results=[];trip.travelHorses.forEach(id=>{let h=game.horses.find(x=>String(x.id)===String(id));let score=competitionScore(h,e.discipline,e.level),competitors=[];for(let i=0;i<e.places-1;i++)competitors.push(Math.random()*100);let rank=1+competitors.filter(x=>x>score).length;rank=clamp(rank,1,e.places);let penalties=0,summary="";if(e.discipline==="CSO"){let bars=chance(.24)?rand(1,2):0,refus=chance(.09)?1:0,time=chance(.16)?1:0;penalties=bars*4+refus*4+time;summary=`${bars} barre(s), ${refus} refus, ${time?"temps dépassé":"temps correct"}`}else if(e.discipline==="Dressage"){let percent=clamp(50+h.current.Dressage*.38+h.mental*.08+Math.random()*8,45,85);penalties=Math.round((100-percent)*10)/10;summary=`Moyenne ${percent.toFixed(3)} %`}else{let dress=clamp(50+h.current.CCE*.35+Math.random()*10,45,82),cross=rand(0,11),cso=chance(.3)?4:0;penalties=Math.round((100-dress)*1.5+cross+cso);summary=`Dressage ${dress.toFixed(2)} %, cross +${cross}, CSO +${cso}`}let points=qualificationPoints(rank,e.places,penalties);h.qualPoints[e.discipline]+=points;h.courses[e.discipline]++;h.lastCompetitionDay=game.day;h.experience[e.discipline]=clamp(h.experience[e.discipline]+3,0,100);h.fatigue=clamp(h.fatigue+28,0,100);if(chance(.06+h.fatigue/1000)){let injury=chance(.5)?"petite lésion musculaire":"tendinite légère";h.injuries.push({type:injury,active:true,until:game.day+rand(5,14)});historyEvent(h,`Blessure : ${injury}. Repos nécessaire.`)}let result=`J${dateDay()} · ${e.city} · ${e.discipline} ${e.level} · ${rank}e/${e.places} · ${summary} · +${points} pts`;h.results.push(result);historyEvent(h,`Concours à ${e.city} : ${rank}e/${e.places}, ${e.discipline}, +${points} points de qualification.`);results.push({name:h.name,rank,places:e.places,penalties,points,summary})});save();showDayResults(results)}
function qualificationPoints(rank,total,penalties){let q=Math.ceil(total*.25);if(rank<=q)return penalties===0?10:5;if(rank<=Math.ceil(total*.5))return 3;if(rank<=Math.ceil(total*.75))return 1;return 0}
function showDayResults(results){let e=trip.event,html=`<div class="notice">📍 ${e.city}<br>🏆 ${e.discipline} — ${e.level}<br>📅 Épreuve ${trip.day}/${e.days}</div>`;results.forEach(r=>html+=`<div class="card"><div class="rank">${r.rank===1?"🥇":r.rank===2?"🥈":r.rank===3?"🥉":"🏅"}<br>${r.rank}e / ${r.places}</div><b>${r.name}</b><br>${r.summary}<br>🎯 ${r.penalties} point(s) de pénalité<br>🇫🇷 <b>+${r.points} point(s) qualification</b></div>`);html+=trip.remaining>0?`<button class="primary" onclick="nextCompetitionDay()">📅 Passer à l'épreuve suivante</button>`:`<button class="primary" onclick="finishTrip()">🏠 Terminer le concours et rentrer</button>`;open("🏆 Résultats",html,false)}
function nextCompetitionDay(){game.day++;game.horses.forEach(h=>{if(h.away)h.fatigue=clamp(h.fatigue-4,0,100)});save();runCompetitionDay()}
function finishTrip(){trip.travelHorses.forEach(id=>{let h=game.horses.find(x=>String(x.id)===String(id));if(h)h.away=false});trip=null;save();open("🏠 Retour à l'écurie",`<div class="notice good">🏠 Les chevaux sont revenus à l'écurie.<br>📖 Résultats enregistrés dans leur carnet.</div><button class="primary" onclick="horsesPage()">🐴 Voir mes chevaux</button>`,false)}

function championshipPage(){page(()=>open("🇫🇷 Championnats de France",`<div class="notice">📅 Saison : automne → fin juillet<br>🇫🇷 Championnats de France : août.</div>${game.horses.map(h=>`<div class="card"><b>${h.name}</b><br>🏇 CSO : ${h.qualPoints.CSO} pts · 🌳 CCE : ${h.qualPoints.CCE} pts · 💃 Dressage : ${h.qualPoints.Dressage} pts</div>`).join("")}<button class="primary" onclick="runChampionships()">🇫🇷 Participer</button>`))}
function runChampionships(){let eligible=game.horses.filter(h=>h.qualPoints.CSO>=20||h.qualPoints.CCE>=20||h.qualPoints.Dressage>=20);if(!eligible.length){open("🇫🇷","Aucun cheval qualifié.");return}let h=eligible[rand(0,eligible.length-1)],d=h.qualPoints.CSO>=Math.max(h.qualPoints.CCE,h.qualPoints.Dressage)?"CSO":h.qualPoints.CCE>=h.qualPoints.Dressage?"CCE":"Dressage",total=rand(50,100),rank=rand(1,total);h.results.push(`Août · Championnat de France ${d} · ${rank}e/${total}`);historyEvent(h,`Championnat de France ${d} : ${rank}e/${total}.`);save();open("🇫🇷 Résultat",`<div class="rank">${rank===1?"🥇":rank===2?"🥈":rank===3?"🥉":"🏅"}<br>${rank}e / ${total}</div><div class="notice good"><b>${h.name}</b><br>${d}<br>Championnat de France terminé.</div>`,false)}

function breedingPage(){let females=game.horses.filter(h=>h.sex==="Jument"&&h.age>=4&&h.age<=18&&!h.retired&&!h.away);page(()=>open("❤️‍🔥 Reproduction",`<div class="notice">Gestation : 11 mois.<br>Le prénom est choisi <b>uniquement à la naissance</b>.</div>${females.map(h=>`<div class="card"><b>${h.name}</b> · ${h.race}<button class="primary" onclick="chooseStallion('${h.id}')">❤️‍🔥 Choisir un étalon</button></div>`).join("")||"<div class='notice'>Aucune jument disponible.</div>"}`))}
function chooseStallion(mid){let stallions=game.horses.filter(h=>h.sex==="Entier"&&!h.retired&&!h.away);open("🐎 Choisir l'étalon",stallions.map(h=>`<div class="card"><b>${h.name}</b> · ${h.race} · ${h.sex}<br>${potentialHTML(h)}<button class="primary" onclick="createFoal('${mid}','${h.id}')">Choisir</button></div>`).join("")||"<div class='notice'>Aucun entier disponible.</div>")}
function createFoal(mid,fid){let m=game.horses.find(h=>String(h.id)===String(mid)),f=game.horses.find(h=>String(h.id)===String(fid));if(game.money<1000){open("💸","Il faut 1 000 €.");return}game.money-=1000;let race=m.race===f.race?m.race:"OC";let p={CSO:clamp(Math.round((m.potential.CSO+f.potential.CSO)/2+rand(-14,14)),40,99),CCE:clamp(Math.round((m.potential.CCE+f.potential.CCE)/2+rand(-14,14)),40,99),Dressage:clamp(Math.round((m.potential.Dressage+f.potential.Dressage)/2+rand(-14,14)),40,99)};let foal=makeHorse("foal"+Date.now(),"",race,0,chance(.5)?"Jument":"Entier","pasture",1000,p);foal.current={CSO:20,CCE:20,Dressage:20};foal.father={name:f.name,results:[f.race]};foal.mother={name:m.name,results:[m.race]};historyEvent(foal,`Naissance issue de ${m.name} et ${f.name}.`);game.horses.push(foal);save();open("🐴 Naissance",`<div class="notice good">🎉 Un poulain est né !<br>Race : <b>${race}</b><br>Sexe : <b>${foal.sex}</b></div><input id="foalName" class="input" placeholder="Prénom du poulain" maxlength="24"><button class="primary" onclick="nameFoal('${foal.id}')">🐴 Donner ce prénom</button>`,false)}
function nameFoal(id){let h=game.horses.find(x=>String(x.id)===String(id)),n=$("foalName").value.trim();if(!n){open("🐴","Choisis un prénom.",false);return}if(game.horses.some(x=>x!==h&&(x.name||"").toLowerCase()===n.toLowerCase())){open("🐴","Ce prénom est déjà utilisé.",false);return}h.name=n;historyEvent(h,`Prénom choisi à la naissance : ${n}.`);save();horseBook(id)}

function marketPage(){page(()=>open("🏪 Marché",`<div class="notice">Les trois filières sont de nouveau disponibles. Chaque cheval a son histoire, ses aptitudes et ses probabilités propres.</div><div class="grid"><button class="menuBtn" onclick="breedersPage()">🧬<br>Élevages</button><button class="menuBtn" onclick="merchantPage()">🐎<br>Marchands</button><button class="menuBtn" onclick="auctionPage()">🔨<br>Enchères</button><button class="menuBtn" onclick="salesPage()">💶<br>Vendre</button></div>`))}
function generateMarket(race,count,mode){let arr=[];for(let i=0;i<count;i++){let p=rawPotential(race),age=mode==="foal"?rand(0,3):rand(3,14),sex=["Jument","Hongre","Entier"][rand(0,2)],base=mode==="auction"?rand(6000,45000):mode==="breeder"?rand(3500,60000):rand(2500,30000);let h=makeHorse("m"+Date.now()+i,uniqueName(),race,age,sex,"market",base,p);h.purchasePrice=base;h.ranges=rangesFor(p,age);arr.push(h)}return arr}
function breedersPage(){page(()=>open("🧬 Élevages",BREEDS.map(r=>`<div class="card"><b>${r}</b><br>Origines sportives et profils individuels.<button class="primary" onclick="marketList('${encodeURIComponent(r)}','breeder')">Voir les chevaux</button></div>`).join("")))}
function merchantPage(){page(()=>open("🐎 Marchands",`<div class="notice">Chevaux de profils variés, y compris de bonnes surprises.</div>${BREEDS.slice(0,6).map(r=>`<div class="card"><b>${r}</b><button class="primary" onclick="marketList('${encodeURIComponent(r)}','merchant')">Voir</button></div>`).join("")}`))}
function auctionPage(){page(()=>open("🔨 Enchères",`<div class="notice">Les enchères proposent des chevaux avec des prix de départ variables. Ici, le prix ne garantit jamais le potentiel.</div>${BREEDS.slice(2,9).map(r=>`<div class="card"><b>${r}</b><button class="primary" onclick="marketList('${encodeURIComponent(r)}','auction')">Voir les enchères</button></div>`).join("")}`))}
function marketList(er,mode){let r=decodeURIComponent(er),horses=generateMarket(r,mode==="auction"?5:6,mode);let key=mode+"_"+r;marketCache[key]=horses;open(`${mode==="breeder"?"🧬 Élevage":mode==="auction"?"🔨 Enchères":"🐎 Marchand"} · ${r}`,horses.map((h,i)=>{let p=probabilityProfile(h.potential,h.purchasePrice,h.race);return `<div class="marketCard"><div class="marketPic">🐎</div><span class="badge">${h.sex}</span><span class="badge">${h.age} ans</span><span class="badge">${h.race}</span><h3>${h.name}</h3>${potentialHTML(h)}${probHTML(p)}<br><b>${mode==="auction"?"Mise de départ":"Prix"} : ${money(h.purchasePrice)}</b><button class="primary" onclick="buyMarket('${key}',${i})">💰 Acheter</button></div>`}).join(""))}
function buyMarket(key,i){let h=marketCache[key]?.[i];if(!h)return;if(game.money<h.purchasePrice){open("💸","Pas assez d'argent.");return}if(game.horses.filter(x=>x.place==="box"&&!x.away).length>=game.boxes){open("🏠","Plus de box disponible.");return}game.money-=h.purchasePrice;h.id="h"+Date.now()+Math.random();h.place="box";h.away=false;historyEvent(h,`Achat : ${money(h.purchasePrice)}.`);game.horses.push(h);save();horseBook(h.id)}
function salesPage(){page(()=>open("💶 Vendre un cheval",game.horses.filter(h=>!h.away).map(h=>`<div class="card"><b>${h.name}</b> · ${h.race} · ${h.sex}<br>Valeur : ${money(value(h))}<button class="primary" onclick="sellHorse('${h.id}')">💶 Vendre ${money(Math.round(value(h)*.82))}</button></div>`).join("")||"<div class='notice'>Aucun cheval disponible.</div>"))}
function sellHorse(id){let i=game.horses.findIndex(h=>String(h.id)===String(id));if(i<0)return;let h=game.horses[i];game.money+=Math.round(value(h)*.82);historyEvent(h,`Vendu pour ${money(Math.round(value(h)*.82))}.`);game.horses.splice(i,1);save();salesPage()}

function vetPage(){professionalPage("🩺 Vétérinaire","vet",100,90,8)}
function dentistPage(){professionalPage("🦷 Dentiste","dentist",70,180,4)}
function osteoPage(){professionalPage("👐 Ostéopathe","osteo",90,120,5)}
function professionalPage(title,key,cost,interval,gain){page(()=>open(title,game.horses.filter(h=>!h.away).map(h=>`<div class="card"><b>${h.name}</b> · ${h.sex}<br>Dernier J${h[key].lastDay} · prochain J${h[key].nextDay}<button class="primary" onclick="professional('${key}','${h.id}',${cost},${interval},${gain})">Faire venir — ${cost} €</button></div>`).join("")))}
function professional(key,id,cost,interval,gain){let h=game.horses.find(x=>String(x.id)===String(id));if(game.money<cost){open("💸","Pas assez d'argent.");return}game.money-=cost;h[key]={lastDay:game.day,nextDay:game.day+interval};h.health=clamp(h.health+gain,0,100);if(key==="vet"){h.injuries.forEach(i=>{if(i.active&&game.day>=i.until){i.active=false}});if(h.injuries.some(i=>i.active))historyEvent(h,"Visite vétérinaire : blessure suivie, repos maintenu.");else historyEvent(h,"Visite vétérinaire : contrôle général.")}else historyEvent(h,`Visite ${key==="dentist"?"du dentiste":"de l'ostéopathe"}.`);save();horseBook(id,key==="vet"?"health":key)}
function vaccinate(id,type){let h=game.horses.find(x=>String(x.id)===String(id));if(game.money<55){open("💸","Pas assez d'argent.");return}game.money-=55;h.vaccines[type]=game.day+365;historyEvent(h,`Vaccination ${type==="tetanos"?"tétanos":type==="grippe"?"grippe":"rhinopneumonie"} effectuée.`);save();horseBook(id,"vacc")}
function farrierPage(){page(()=>open("🧲 Maréchal-ferrant",game.horses.filter(h=>!h.away).map(h=>`<div class="card"><b>${h.name}</b> · ${h.sex}<br>${h.hoof.type==="ferrure"?"🔨 Ferrure":"✂️ Parage"} · échéance J${h.hoof.nextDay}<div class="two"><button class="primary" onclick="farrier('${h.id}','ferrure')">110 €</button><button class="primary" onclick="farrier('${h.id}','parage')">50 €</button></div></div>`).join("")))}
function farrier(id,type){let h=game.horses.find(x=>String(x.id)===String(id)),c=type==="ferrure"?110:50;if(game.money<c){open("💸","Pas assez d'argent.");return}game.money-=c;h.hoof={type,lastDay:game.day,nextDay:game.day+60};h.health=clamp(h.health+2,0,100);historyEvent(h,`${type==="ferrure"?"Ferrure":"Parage"} effectué.`);save();horseBook(id,"farrier")}

function carePage(){page(()=>open("❤️ Soins",game.horses.filter(h=>!h.away).map(h=>`<div class="choice"><b>${h.name}</b> · ${h.sex}<br>Santé ${h.health}% · Forme ${h.form}% · Fatigue ${h.fatigue}%<button class="primary" onclick="care('${h.id}')">❤️ Soins — 80 €</button></div>`).join("")))}
function care(id){let h=game.horses.find(x=>String(x.id)===String(id));if(game.money<80){open("💸","Pas assez d'argent.");return}game.money-=80;h.health=clamp(h.health+5,0,100);h.form=clamp(h.form+4,0,100);h.fatigue=clamp(h.fatigue-10,0,100);historyEvent(h,"Soins quotidiens renforcés.");save();carePage()}
function feedPage(){page(()=>open("🥕 Rations",game.horses.filter(h=>!h.away).map(h=>`<div class="card"><b>${h.name}</b><br>🌾 ${h.ration.hay} kg · 🌽 ${h.ration.grain} kg<button class="primary" onclick="setRation('${h.id}')">Modifier</button></div>`).join("")))}
function setRation(id){let h=game.horses.find(x=>String(x.id)===String(id));open("🥕 Ration de "+h.name,`<label>🌾 Foin kg/j</label><input id="hayI" class="input" type="number" value="${h.ration.hay}" step=".5"><br><br><label>🌽 Grain kg/j</label><input id="grainI" class="input" type="number" value="${h.ration.grain}" step=".5"><button class="primary" onclick="saveRation('${h.id}')">💾 Enregistrer</button>`)}
function saveRation(id){let h=game.horses.find(x=>String(x.id)===String(id));h.ration.hay=clamp(parseFloat($("hayI").value)||0,0,25);h.ration.grain=clamp(parseFloat($("grainI").value)||0,0,10);save();horseBook(id,"food")}

function domainPage(){page(()=>open("🏡 Domaine",`<div class="choice">💰 ${money(game.money)}<br>🏠 ${game.horses.filter(h=>h.place==="box"&&!h.away).length}/${game.boxes} boxes<br>🌳 ${game.pastures} pâtures<br>🌾 ${game.land} hectares<br>🚚 Camion : ${game.truckCapacity} places</div><button class="primary" onclick="buyBox()">🏠 Box — 3 500 €</button><button class="primary" onclick="buyPasture()">🌳 Pâture — 5 000 €</button><button class="primary" onclick="buyLand()">🌾 Hectare — 8 000 €</button>`))}
function buyBox(){if(game.money<3500){open("💸","Pas assez d'argent.");return}game.money-=3500;game.boxes++;save();domainPage()}
function buyPasture(){if(game.money<5000){open("💸","Pas assez d'argent.");return}game.money-=5000;game.pastures++;save();domainPage()}
function buyLand(){if(game.money<8000){open("💸","Pas assez d'argent.");return}game.money-=8000;game.land++;save();domainPage()}
function transportPage(){page(()=>open("🚚 Transport",`<div class="choice">🚚 Capacité : <b>${game.truckCapacity} chevaux</b></div><button class="primary" onclick="upgradeTruck()">🚚 +2 places — 6 000 €</button>`))}
function upgradeTruck(){if(game.truckCapacity>=12){open("🚚","Capacité maximale atteinte.");return}if(game.money<6000){open("💸","Pas assez d'argent.");return}game.money-=6000;game.truckCapacity=Math.min(12,game.truckCapacity+2);save();transportPage()}
function stablePage(){page(()=>open("🏚️ Boxes",game.horses.filter(h=>h.place==="box").map(horseCard).join("")||"<div class='notice'>Aucun cheval.</div>"))}
function pasturePage(){page(()=>open("🌳 Pâtures",game.horses.filter(h=>!h.away).map(h=>`<div class="choice"><b>${h.name}</b> · ${h.sex}<br>${h.place==="pasture"?"🌳 Pré":"🏠 Box"}<button class="primary" onclick="togglePlace('${h.id}')">${h.place==="pasture"?"🏠 Mettre au box":"🌳 Mettre au pré"}</button></div>`).join("")))}
function togglePlace(id){let h=game.horses.find(x=>String(x.id)===String(id));if(!h||h.away){open("🐴","Impossible pendant un concours.");return}if(h.place==="pasture"){if(game.horses.filter(x=>x.place==="box"&&!x.away).length>=game.boxes){open("🏠","Plus de box disponible.");return}h.place="box"}else h.place="pasture";historyEvent(h,`Changement de logement : ${h.place==="box"?"box":"pré"}.`);save();pasturePage()}
function stocksPage(){page(()=>open("📦 Stocks",`<div class="choice">🌾 Foin : ${game.hay}/${game.maxHay} kg</div><div class="choice">🌽 Grain : ${game.grain}/${game.maxGrain} kg</div><div class="choice">🪵 Paille : ${game.straw}/${game.maxStraw} kg</div><button class="primary" onclick="buyStock('hay')">🌾 500 kg — 250 €</button><button class="primary" onclick="buyStock('grain')">🌽 300 kg — 180 €</button><button class="primary" onclick="buyStock('straw')">🪵 500 kg — 160 €</button>`))}
function buyStock(t){let c=t==="hay"?250:t==="grain"?180:160,a=t==="hay"?500:t==="grain"?300:500,m=t==="hay"?game.maxHay:t==="grain"?game.maxGrain:game.maxStraw;if(game.money<c){open("💸","Pas assez d'argent.");return}game.money-=c;game[t]=Math.min(m,game[t]+a);save();stocksPage()}
function financesPage(){page(()=>open("💰 Finances",`<div class="notice">💰 Trésorerie : <b>${money(game.money)}</b></div><div class="choice">🩺 Vétérinaire : 100 €</div><div class="choice">🦷 Dentiste : 70 €</div><div class="choice">👐 Ostéo : 90 €</div><div class="choice">🧲 Ferrure : 110 € · Parage : 50 €</div><div class="choice">💉 Vaccin : 55 €</div><div class="choice">📅 Frais quotidiens : 350 €</div>`))}
function calendarPage(){page(()=>open("📆 Calendrier",`<div class="notice"><b>${dateText()}</b><br>J${dateDay()}/365 · ${season()}<br><br>🏆 Saison de concours : automne → fin juillet<br>🇫🇷 Championnats : août</div>`))}
function saveManual(){save();open("💾 Sauvegarde","La V13.3 est sauvegardée sur cet appareil.",false)}
function nextDay(){
 game.money=Math.max(0,game.money-350);game.day++;if(dateDay()===1)game.year++;
 game.horses.forEach(h=>{
  if(h.away)return;
  h.age+=dateDay()===1?1:0;
  h.ranges=rangesFor(h.potential,h.age);
  h.fatigue=clamp(h.fatigue-(h.place==="pasture"?10:7),0,100);h.form=clamp(h.form+1,0,100);
  if(h.place==="pasture")h.health=clamp(h.health+1,0,100);
  game.hay=Math.max(0,game.hay-h.ration.hay);game.grain=Math.max(0,game.grain-h.ration.grain);game.straw=Math.max(0,game.straw-.5);
  h.injuries.forEach(i=>{if(i.active&&game.day>=i.until)i.active=false});
  if(chance(.012)&&h.health<85){h.illnesses.push(`Épisode léger détecté à J${game.day}`);h.health=clamp(h.health-5,0,100);historyEvent(h,"Petit épisode de santé, surveillance recommandée.")}
  if(game.hay===0||game.grain===0){h.health=clamp(h.health-1,0,100);h.form=clamp(h.form-2,0,100)}
 });
 save();
}
render();
</script>
</body>
</html>
