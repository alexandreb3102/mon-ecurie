function loadGame(){

/* =====================================================
 NORMALISATION
===================================================== */

function normalizeGame(data){

 if(!data.horses)
  data.horses=[];

 if(!data.marketCycle)
  data.marketCycle=1;

 data.horses.forEach(
  normalizeHorse
 );

 return data;

}

function normalizeHorse(h){

 const defaults={

  potential:60,
  realPotential:65,
  currentLevel:45,
  experience:10,

  technique:60,
  strength:60,
  endurance:60,
  regularity:60,

  mental:60,
  gentleness:60,
  calm:60,
  courage:60,
  concentration:60,
  willpower:60,
  reactivity:60,

  courseUse:60,
  competitionUse:60,
  breedingUse:60,

  winsClub:0,
  winsAmateur:0,
  winsNational:0,

  secondClub:0,
  secondAmateur:0,
  secondNational:0,

  thirdClub:0,
  thirdAmateur:0,
  thirdNational:0,

  totalCourses:0,

  championships:[]

 };

 Object.keys(defaults).forEach(key=>{

  if(h[key]===undefined)
   h[key]=defaults[key];

 });

 if(!h.father){

  h.father={
   name:"Origine inconnue",
   results:[]
  };

 }

 if(!h.mother){

  h.mother={
   name:"Origine inconnue",
   results:[]
  };

 }

 h.currentLevel=
  Math.min(
   h.currentLevel,
   h.realPotential,
   h.potential
  );

 calculateHorseValue(h);

 return h;

}

/* =====================================================
 RÉGULARITÉ
===================================================== */

function getPodiums(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational+

  h.secondClub+
  h.secondAmateur+
  h.secondNational+

  h.thirdClub+
  h.thirdAmateur+
  h.thirdNational

 );

}

function getWins(h){

 return (

  h.winsClub+
  h.winsAmateur+
  h.winsNational

 );

}

function getRegularity(h){

 if(h.totalCourses<=0)
  return 20;

 const podiumRate=
  getPodiums(h)/
  h.totalCourses;

 const winRate=
  getWins(h)/
  h.totalCourses;

 const experienceBonus=
  Math.min(
   15,
   h.experience/8
  );

 return clamp(
  Math.round(
   podiumRate*70+
   winRate*20+
   experienceBonus
  ),
  5,
  99
 );

}


/* =====================================================
 VALEUR DU CHEVAL
===================================================== */

function calculateHorseValue(h){

 const regularity=
  getRegularity(h);

 const sport=

  h.potential*0.30+
  h.currentLevel*0.18+
  h.experience*0.08+
  regularity*0.18+
  h.technique*0.08+
  h.strength*0.06+
  h.endurance*0.05+
  h.regularity*0.07;

 const mental=

  h.mental*0.20+
  h.gentleness*0.20+
  h.calm*0.16+
  h.courage*0.14+
  h.concentration*0.14+
  h.willpower*0.10+
  (100-h.reactivity)*0.06;

 const utility=

  h.courseUse*0.40+
  h.competitionUse*0.40+
  h.breedingUse*0.20;

 let ageScore=100;

 if(h.age<=8)
  ageScore=100;
 else if(h.age<=12)
  ageScore=92;
 else if(h.age<=15)
  ageScore=78;
 else if(h.age<=18)
  ageScore=60;
 else
  ageScore=38;

 const ageHealth=
  ageScore*0.55+
  h.health*0.45;

 const score=

  sport*0.45+
  mental*0.20+
  utility*0.15+
  ageHealth*0.20;

 let value=
  2500+
  Math.pow(score/100,2.7)*65000;

 if(
  h.courseUse>=90 &&
  h.gentleness>=90 &&
  h.calm>=90
 ){

  value+=5000;

 }

 if(h.breedingUse>=90)
  value+=5000;

 if(h.age>=18)
  value*=0.60;

 if(h.health<70)
  value*=0.85;

 if(h.health<50)
  value*=0.70;

 h.value=Math.round(value);

 return h.value;

}


/* =====================================================
 POTENTIEL VISIBLE
===================================================== */

function potentialRange(h){

 let uncertainty=4;

 if(h.age<=3)
  uncertainty=18;
 else if(h.age<=5)
  uncertainty=14;
 else if(h.age<=8)
  uncertainty=8;
 else if(h.age<=12)
  uncertainty=5;

 return{

  min:clamp(
   h.realPotential-uncertainty,
   40,
   99
  ),

  max:clamp(
   h.realPotential+uncertainty,
   40,
   99
  )

 };

}

 "Espoir"

];


const marketRaces=[

 "Selle Français",
 "KWPN",
 "Anglo-Arabe",
 "Connemara",
 "Poney Français de Selle",
 "Hanovrien",
 "Oldenbourg",
 "Quarter Horse",
 "Lusitanien",
 "Frison"

];


function randomBetween(min,max){

 return Math.floor(
  Math.random()*(max-min+1)
 )+min;

}


function generateMarketHorse(i){

 const race=
  marketRaces[
   randomBetween(
    0,
    marketRaces.length-1
   )
  ];

 const name=
  marketNames[
   (game.marketCycle*7+i)
   %marketNames.length
  ];


 /*
 PROFILS :

 0 = cheval moyen
 1 = cheval de cours
 2 = sportif
 3 = jeune prometteur
 4 = cheval confirmé
 5 = mauvaise affaire possible
 6 = bonne surprise possible
 */

 const profile=i%7;

 let realPotential;

 if(profile===0){

  realPotential=
   randomBetween(55,70);

 }
 else if(profile===1){

  realPotential=
   randomBetween(58,76);

 }
 else if(profile===2){

  realPotential=
   randomBetween(75,90);

 }
 else if(profile===3){

  realPotential=
   randomBetween(78,96);

 }
 else if(profile===4){

  realPotential=
   randomBetween(70,88);

 }
 else if(profile===5){

  realPotential=
   randomBetween(48,65);

 }
 else{

  realPotential=
   randomBetween(78,94);

 }


 const age=
  profile===3
  ?randomBetween(3,6)
  :randomBetween(4,16);


 let current;

 if(age<=5){

  current=
   randomBetween(
    35,
    Math.min(65,realPotential)
   );

 }
 else if(age<=10){

  current=
   randomBetween(
    48,
    Math.min(78,realPotential)
   );

 }
 else{

  current=
   randomBetween(
    52,
    Math.min(82,realPotential)
   );

 }


 /*
 Le profil "mauvaise affaire"
 peut être séduisant mais plafonner.
 */

 let mental=
  randomBetween(50,92);

 let gentleness=
  randomBetween(45,95);

 let calm=
  randomBetween(45,95);

 let courage=
  randomBetween(50,95);

 let concentration=
  randomBetween(50,95);

 let willpower=
  randomBetween(45,95);

 let reactivity=
  randomBetween(35,90);


 if(profile===1){

  gentleness=
   randomBetween(88,98);

  calm=
   randomBetween(88,98);

  courseUse=96;

 }
 else{

  courseUse=
   randomBetween(45,95);

 }


 let experience;

 if(age<=6)
  experience=randomBetween(5,30);
 else if(age<=10)
  experience=randomBetween(25,65);
 else
  experience=randomBetween(55,90);


 const h={

  id:
   "market_"+game.marketCycle+"_"+i,

  name:name,

  race:race,

  age:age,

  sex:
   i%2===0
   ?"Jument"
   :"Hongre",

  form:
   randomBetween(68,94),

  health:
   randomBetween(80,99),

  fatigue:
   randomBetween(5,30),

  place:"market",

  potential:
   clamp(
    realPotential+
    randomBetween(-7,7),
    40,
    99
   ),

  realPotential:
   realPotential,

  currentLevel:
   Math.min(
    current,
    realPotential
   ),

  experience:experience,

  technique:
   clamp(
    current+
    randomBetween(-10,12),
    40,
    realPotential
   ),

  strength:
   randomBetween(50,96),

  endurance:
   randomBetween(50,96),

  regularity:
   randomBetween(45,96),

  mental:mental,

  gentleness:gentleness,

  calm:calm,

  courage:courage,

  concentration:concentration,

  willpower:willpower,

  reactivity:reactivity,

  courseUse:
   profile===1
   ?96
   :courseUse,

  competitionUse:
   clamp(
    realPotential+
    randomBetween(-10,5),
    40,
    99
   ),

  breedingUse:
   randomBetween(45,95),

  winsClub:
   age>=7
   ?randomBetween(0,8)
   :randomBetween(0,2),

  winsAmateur:
   realPotential>=72
   ?randomBetween(0,6)
   :randomBetween(0,2),

  winsNational:
   realPotential>=84
   ?randomBetween(0,4)
   :0,

  secondClub:
   randomBetween(0,6),

  secondAmateur:
   randomBetween(0,4),

  secondNational:
   realPotential>=82
   ?randomBetween(0,3)
   :0,

  thirdClub:
   randomBetween(0,6),

  thirdAmateur:
   randomBetween(0,4),

  thirdNational:
   realPotential>=82
   ?randomBetween(0,3)
   :0,

  totalCourses:
   age>=7
   ?randomBetween(8,55)
   :randomBetween(2,18),

  championships:[],

  father:{
   name:"Père de "+name,
   results:[
    "Origine enregistrée",
    "Résultats disponibles au dossier"
   ]
  },

  mother:{
   name:"Mère de "+name,
   results:[
    "Origine enregistrée",
    "Résultats disponibles au dossier"
   ]
  }

 };

 /*
 Bonne surprise :
 potentiel affiché peut être inférieur
 au potentiel réel.
 */

 if(profile===6){

  h.potential=
   clamp(
    h.realPotential-
    randomBetween(5,12),
    40,
    99
   );

 }

 /*
 Mauvaise affaire :
 le cheval paraît correct
 mais son potentiel réel est faible.
 */

 if(profile===5){

  h.potential=
   clamp(
    h.realPotential+
    randomBetween(3,8),
    40,
    99
   );

 }

 normalizeHorse(h);

 return h;

}


function generateMarket(){

 const result=[];

 for(let i=0;i<7;i++){

  result.push(
   generateMarketHorse(i)
  );

 }

 return result;

}


let marketData={
 cycle:0,
 breeding:[],
 auction:[],
 merchant:[]
};


function ensureMarket(){

 if(
  marketData.cycle!==game.marketCycle ||
  !marketData.breeding.length
 ){

  marketData={

   cycle:game.marketCycle,

   breeding:
    generateMarket(),

   auction:
    generateMarket(),

   merchant:
    generateMarket()

  };

 }

}

function marketPrice(type,h){

 let price=h.value;

 if(type==="breeding"){

  price=
   Math.round(
    h.value*1.05
   );

 }

 if(type==="auction"){

  price=
   Math.round(
    h.value*0.55
   );

 }

 if(type==="merchant"){

  price=
   Math.round(
    h.value*1.10
   );

 }

 /*
 Prix minimum.
 */

 return Math.max(
  2500,
  price
 );

}

function buyMarketHorse(type,index,price){

 ensureMarket();

 const h=
  marketData[type][index];

 if(!h)
  return;


 if(game.money<price){

  openModal(

   "💸 Achat impossible",

   `

   <div class="notice">

    Tu n'as pas assez d'argent.

    <br><br>

    Prix :
    <b>${money(price)}</b>

    <br>

    Trésorerie :
    <b>${money(game.money)}</b>

   </div>

   `

  );

  return;

 }


 const occupied=
  game.horses.filter(
   x=>x.place==="box"
  ).length;


 if(occupied>=game.boxes){

  openModal(

   "🏠 Écurie complète",

   `

   <div class="notice">

    Tu n'as plus de box disponible.

    <br><br>

    Boxes :
    <b>${occupied}/${game.boxes}</b>

   </div>

   `

  );

  return;

 }


 game.money-=price;

 h.id=
  Date.now();

 h.place="box";


 game.horses.push(h);

 marketData[type].splice(index,1);


 saveGame();


 openModal(

  "🎉 Nouveau cheval !",

  `

  <div class="photoBox">

   <img
    src="${raceImage(h.race)}"
    onerror="this.style.display='none';this.nextElementSibling.style.display='block';">

  </div>

   <br><br>

   ${h.race}

   · ${h.age} ans

  </div>


  <div class="choice">

   💰 Prix payé :

/* =====================================================
 PROGRESSION
===================================================== */

function trainHorse(id){

 const h=
  game.horses.find(
   x=>x.id===id
  );

 if(!h)return;


 if(h.fatigue>=75){

  openModal(

   "😴 Cheval fatigué",

   `

   <div class="notice">

   ${h.name}
   est trop fatigué pour travailler
   correctement.

   </div>

   `

  );

  return;

 }


 /*
 PROGRESSION LIÉE À L'ÂGE
 */

 let ageFactor=1;

 if(h.age<=5)
  ageFactor=1.35;

 else if(h.age<=8)
  ageFactor=1.15;

 else if(h.age<=12)
  ageFactor=1.0;

 else if(h.age<=15)
  ageFactor=0.65;

 else if(h.age<=18)
  ageFactor=0.30;

 else
  ageFactor=0.10;


 /*
 PLUS LE NIVEAU SE RAPPROCHE
 DU POTENTIEL, PLUS C'EST DUR.
 */

 const remaining=
  Math.max(
   0,
   h.realPotential-h.currentLevel
  );


 let progression=

  (
   0.8+
   h.experience/55
  )*
  ageFactor;


 if(remaining<=5)
  progression*=0.35;

 else if(remaining<=10)
  progression*=0.60;


 progression=
  Math.max(
   0.2,
   Math.round(
    progression*10
   )/10
  );


 /*
 PETITE CHANCE DE RÉVÉLATION
 */

 let revelation="";

 if(
  h.age<=8 &&
  h.currentLevel< h.realPotential-5 &&
  Math.random()<0.08
 ){

  const reveal=
   Math.min(
    2,
    h.realPotential-h.currentLevel
   );

  progression+=reveal;

  revelation=
   "<br><br>✨ Le cheval révèle une partie de son potentiel !";

 }


 h.currentLevel=
  Math.min(
   h.realPotential,
   h.currentLevel+progression
  );


 h.experience=
  clamp(
   h.experience+2,
   0,
   100
  );


 h.form=
  clamp(
   h.form+4,
   0,
   100
  );


 h.fatigue=
  clamp(
   h.fatigue+14,
   0,
   100
  );


 h.technique=
  clamp(
   h.technique+0.8,
   0,
   h.realPotential
  );


 h.regularity=
  clamp(
   h.regularity+0.5,
   0,
   100
  );


 calculateHorseValue(h);

 saveGame();


 openModal(

  "🏇 Entraînement terminé",

  `

  <div class="notice">

   <b>${h.name}</b>
   progresse.

  </div>


  Niveau :

  <b>
   ${Math.round(h.currentLevel*10)/10}/100
  </b>

  <br>

  Potentiel maximum :

  <b>
   ${h.realPotential}/100
  </b>

  <br>

  Expérience :

  <b>
   ${h.experience}/100
  </b>

  <br>

  Régularité :

  <b>
   ${getRegularity(h)}/100
  </b>

  ${revelation}

  `

 );

}

function nextWeek(){

 if(game.money<350){

  openModal(
   "💸 Argent insuffisant",
   "Tu n'as pas assez d'argent."
  );

  return;

 }


 game.money-=350;

 game.week++;


 /*
 RENOUVELLEMENT DU MARCHÉ
 */

 if(game.week%10===0){

  game.marketCycle++;

  marketData={
   cycle:0,
   breeding:[],
   auction:[],
   merchant:[]
  };

 }


 /*
 NOUVELLE ANNÉE
 */

 if(game.week>52){

  game.week=1;

  game.year++;

  game.horses.forEach(
   h=>h.age++
  );

 }


 /*
 ÉVOLUTION DES CHEVAUX
 */

 game.horses.forEach(h=>{

  h.fatigue=
   clamp(
    h.fatigue-12,
    0,
    100
   );


  if(h.place==="pasture"){

   h.health=
    clamp(
     h.health+2,
     0,
     100
    );

  }


  /*
  récupération de forme
  */

  if(h.fatigue<35){

   h.form=
    clamp(
     h.form+1,
     0,
     100
    );

  }


  calculateHorseValue(h);

 });


 saveGame();

 domainPage();

}

/* =====================================================
 COMPÉTITION
===================================================== */

function competition(
 level,
 cost,
 reputation
){

 const h=
  [...game.horses]
  .sort(
   (a,b)=>
    b.currentLevel-
    a.currentLevel
  )[0];


 if(game.money<cost){

  openModal(
   "💸 Concours impossible",
   "Tu n'as pas assez d'argent."
  );

  return;

 }


 game.money-=cost;


 let difficulty=0;

 if(level==="Amateur")
  difficulty=12;

 if(level==="National")
  difficulty=25;


 let chance=

  h.currentLevel*0.42+

  h.experience*0.12+

  getRegularity(h)*0.24+

  h.mental*0.12+

  h.concentration*0.10-

  difficulty;


 chance=
  clamp(
   chance,
   3,
   95
  );


 const success=
  Math.random()*100<
  chance;


 h.totalCourses++;


 if(success){

  if(level==="Club")
   h.winsClub++;

  if(level==="Amateur")
   h.winsAmateur++;

  if(level==="National")
   h.winsNational++;


  game.money+=cost*2;

  game.reputation+=reputation;


  openModal(

   "🏆 Victoire !",

   `

   <div class="notice">

    <b>${h.name}</b>
    gagne son concours
    <b>${level}</b> !

   </div>

   ${getWins(h)}
   victoires sur
   ${h.totalCourses}
   parcours.

   `

  );

 }

 else{

  if(Math.random()<0.5){

   if(level==="Club")
    h.thirdClub++;

   if(level==="Amateur")
    h.thirdAmateur++;

   if(level==="National")
    h.thirdNational++;

  }


  openModal(

   "🏇 Concours terminé",

   `

   ${h.name}
   a participé au concours
   ${level}.

   <br><br>

   La performance n'a pas permis
   de gagner cette fois.

   `

  );

 }


 h.fatigue=
  clamp(
   h.fatigue+20,
   0,
   100
  );


 h.experience=
  clamp(
   h.experience+3,
   0,
   100
  );


 calculateHorseValue(h);

 saveGame();

}
