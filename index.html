function defaultGame(){

  year:1,

/* =========================================================
   OUTILS
========================================================= */

function euro(n){

 return Math.round(n)
 .toLocaleString("fr-FR")+" €";

}

function wins(h){

 return h.winsClub+
 h.winsAmateur+
 h.winsNational;

}

function podiums(h){

 return wins(h)+
 h.secondClub+
 h.secondAmateur+
 h.secondNational+
 h.thirdClub+
 h.thirdAmateur+
 h.thirdNational;

}

function regularity(h){

 if(!h.courses)return 10;

 const score=
 (
  podiums(h)/h.courses*65+
  wins(h)/h.courses*25+
  h.experience*.10
 );

 return Math.max(
  5,
  Math.min(99,Math.round(score))
 );

}

function potentialRange(h){

 let margin=6;

 if(h.age<=3)margin=18;
 else if(h.age<=5)margin=14;
 else if(h.age<=8)margin=9;

 return{
  min:Math.max(40,h.potential-margin),
  max:Math.min(99,h.potential+margin)
 };

}


/* =========================
   VALEUR 45/20/15/20
========================= */

function horseValue(h){

 const sport=
 h.potential*.30+
 h.current*.20+
 h.experience*.10+
 regularity(h)*.20+
 h.technique*.08+
 h.force*.06+
 h.endurance*.06;

 const mental=
 h.mental*.20+
 h.gentillesse*.20+
 h.calme*.17+
 h.courage*.14+
 h.concentration*.16+
 h.volonte*.13;

 const utility=
 h.utilityCourse*.40+
 h.utilityCompetition*.40+
 h.utilityBreeding*.20;

 let ageScore;

 if(h.age<=7)ageScore=100;
 else if(h.age<=10)ageScore=94;
 else if(h.age<=13)ageScore=84;
 else if(h.age<=16)ageScore=68;
 else ageScore=45;

 const ageHealth=
 ageScore*.55+
 h.health*.45;

 let value=
 2500+
 Math.pow(
  (
   sport*.45+
   mental*.20+
   utility*.15+
   ageHealth*.20
  )/100,
  2.65
 )*65000;

 if(
  h.utilityCourse>=90 &&
  h.gentillesse>=90 &&
  h.calme>=90
 )value+=5000;

 if(h.age>=16 && wins(h)<3)
  value*=.72;

 if(h.health<70)value*=.82;
 if(h.health<50)value*=.65;

 return Math.round(value);

}

function generateMarket(){

 const breeds=[
  "Selle Français",
  "KWPN",
  "Anglo-Arabe",
  "Connemara",
  "Poney Français de Selle",
  "Hanovrien",
  "Oldenbourg"
 ];

 const names=[
  "Noblesse",
  "Évidence",
  "Silver Star",
  "Belle Ambition",
  "Royal Dream",
  "Mystère",
  "Victoire"
 ];

 return names.map((name,i)=>{

  const potential=
   50+
   Math.floor(Math.random()*49);

  const age=
   2+
   Math.floor(Math.random()*14);

  const current=
   Math.min(
    potential,
    20+
    Math.floor(Math.random()*55)
   );

  const gentle=
   i===0 ||
   i===3 ||
   i===6;

  const h={

   id:"market-"+game.marketCycle+"-"+i,

   name,
   breed:breeds[i],
   age,
   sex:i%2?"Hongre":"Jument",

   photo:horsePhotos[
    i%horsePhotos.length
   ],

   potential,
   current,

   experience:
    age<6
    ?5+Math.floor(Math.random()*30)
    :40+Math.floor(Math.random()*50),

   technique:
    45+Math.floor(Math.random()*50),

   force:
    45+Math.floor(Math.random()*50),

   endurance:
    45+Math.floor(Math.random()*50),

   mental:
    40+Math.floor(Math.random()*60),

   gentillesse:
    gentle
    ?90+Math.floor(Math.random()*10)
    :40+Math.floor(Math.random()*55),

   calme:
    gentle
    ?88+Math.floor(Math.random()*12)
    :40+Math.floor(Math.random()*55),

   courage:
    40+Math.floor(Math.random()*60),

   concentration:
    40+Math.floor(Math.random()*60),

   volonte:
    40+Math.floor(Math.random()*60),

   utilityCourse:
    gentle
    ?92+Math.floor(Math.random()*8)
    :40+Math.floor(Math.random()*55),

   utilityCompetition:
    potential,

   utilityBreeding:
    45+Math.floor(Math.random()*50),

   health:
    80+Math.floor(Math.random()*21),

   form:
    65+Math.floor(Math.random()*36),

   fatigue:
    5+Math.floor(Math.random()*25),

   winsClub:
    Math.floor(Math.random()*10),

   winsAmateur:
    potential>70
    ?Math.floor(Math.random()*6)
    :Math.floor(Math.random()*3),

   winsNational:
    potential>85
    ?Math.floor(Math.random()*4)
    :0,

   secondClub:
    Math.floor(Math.random()*7),

   secondAmateur:
    Math.floor(Math.random()*5),

   secondNational:
    potential>84
    ?Math.floor(Math.random()*3)
    :0,

   thirdClub:
    Math.floor(Math.random()*6),

   thirdAmateur:
    Math.floor(Math.random()*5),

   thirdNational:
    potential>84
    ?Math.floor(Math.random()*3)
    :0,

   courses:
    8+Math.floor(Math.random()*45),

   championships:[],

   father:{
    name:"Père de "+name,
    results:[
     "3 victoires en Amateur",
     "Origine sportive reconnue"
    ]
   },

   mother:{
    name:"Mère de "+name,
    results:[
     "5 victoires en Club",
     "Bonne réputation d'élevage"
    ]
   },

   rider:{
    name:"À attribuer",
    level:50
   }

  };

  return h;

 });

}

function riderLevel(h){

 typeof h.rider.level==="number"
 ?h.rider.level

function train(id){

 const h=
 game.horses.find(
  x=>x.id===id
 );

 if(!h)return;

 if(h.fatigue>=75){

  return openModal(
   "😴 Cheval fatigué",
   "Il faut le laisser récupérer avant de continuer."
  );

 }

 const before=h.current;

 const gain=
 Math.max(
  1,
  Math.round(
   1+
   h.experience/35+
   (riderLevel(h)-50)/45
  )
 );

 h.current=
 Math.min(
  h.potential,
  h.current+gain
 );

 h.experience=
 Math.min(
  100,
  h.experience+2
 );

 h.technique=
 Math.min(
  h.potential,
  h.technique+1
 );

 h.form=
 Math.min(
  100,
  h.form+3
 );

 h.fatigue=
 Math.min(
  100,
  h.fatigue+15
 );

 save();

 openModal(

 "🏇 Entraînement",

 `

 <div class="notice">

 <b>${h.name}</b>
 progresse.

 <br><br>

 Niveau :
 <b>${before} → ${h.current}</b>

 `

 );

}

function qualifies(h,level){

 if(level==="Club")
  return h.current>=45 &&
         riderLevel(h)>=35;

 if(level==="Amateur")
  return h.current>=62 &&
         riderLevel(h)>=55;

 return h.current>=75 &&
        riderLevel(h)>=70;

}


function runCompetition(id,level,cost){

 const h=
 game.horses.find(
  x=>x.id===id
 );

 if(!h)return;

 if(game.money<cost){

  return openModal(
   "💸 Impossible",
   "Tu n'as pas assez d'argent."
  );

 }

 if(!qualifies(h,level)){

  return openModal(

   "❌ Couple non qualifié",

   `

   <b>${h.name}</b>
   n'a pas encore le niveau nécessaire pour cette épreuve.

   <br><br>

   Cheval :
   ${h.current}/100

   <br>

   Cavalier :
   ${riderLevel(h)}/100

   `

  );

 }

 game.money-=cost;

 let difficulty=0;

 if(level==="Amateur")
  difficulty=12;

 if(level==="National")
  difficulty=25;

 let chance=

 h.current*.35+
 riderLevel(h)*.18+
 regularity(h)*.20+
 h.mental*.10+
 h.concentration*.07+
 h.form*.10-
 h.fatigue*.08-
 difficulty;

 chance=Math.max(
  3,
  Math.min(95,chance)
 );

 const roll=
 Math.random()*100;

 h.courses++;

 h.fatigue=
 Math.min(100,h.fatigue+20);

 h.experience=
 Math.min(100,h.experience+3);

 let result;


 if(roll<chance*.55){

  if(level==="Club")h.winsClub++;
  if(level==="Amateur")h.winsAmateur++;
  if(level==="National")h.winsNational++;

  game.reputation+=
   level==="National"
   ?10
   :level==="Amateur"
   ?5
   :2;

  game.money+=cost*2;

  result=
   "🥇 Victoire !";

 }

 else if(roll<chance){

  if(level==="Club")h.secondClub++;
  if(level==="Amateur")h.secondAmateur++;
  if(level==="National")h.secondNational++;

  game.reputation++;

  result=
   "🥈 Deuxième place !";

 }

 else{

  if(Math.random()<.5){

   if(level==="Club")h.thirdClub++;
   if(level==="Amateur")h.thirdAmateur++;
   if(level==="National")h.thirdNational++;

  }

  result=
   "🏇 Concours terminé";

 }

 save();

 openModal(

 "🏆 Résultat",

 `

 <div class="notice">

 <b>${result}</b>

 <br><br>

 ${h.name}
 · ${level}

 <br>

 Parcours :
 <b>${h.courses}</b>

 <br>

 Régularité :
 <b>${regularity(h)}/100</b>

 </div>

 <button
 class="btn"
 onclick="book(${h.id})">
  📖 Voir le carnet
 </button>

 `

 );

}

/* =========================================================
   NAVIGATION / MODAL
========================================================= */

function setActive(id){

 document
 .querySelectorAll(".nav button")
 .forEach(x=>x.classList.remove("active"));

 const el=
 document.getElementById(id);

 if(el)el.classList.add("active");

}


function openModal(title,content){

 document.getElementById(
  "modalTitle"
 ).innerHTML=title;

 document.getElementById(
  "modalContent"
 ).innerHTML=content;

 document.getElementById(
  "modalBack"
 ).classList.add("open");

}


function closeModal(){

 document.getElementById(
  "modalBack"
 ).classList.remove("open");

}
